<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配额与上下文</title>
<script src="/preload.js"></script>
<style>
  :root {
    --bg: var(--background, #16181d);
    --fg: var(--foreground, #e4e7ec);
    --dim: var(--muted-foreground, #9aa0a6);
    --line: var(--border, rgba(127, 127, 127, .24));
    --card: color-mix(in srgb, var(--fg) 4%, transparent);
    --card-hi: color-mix(in srgb, var(--fg) 7%, transparent);
    --track: color-mix(in srgb, var(--dim) 20%, transparent);
    --empty: color-mix(in srgb, var(--dim) 28%, transparent);
    --pool-a: #4c8df6;
    --pool-b: #b07ef6;
    --pool-c: #38bdf8;
    --ok: #34a853;
    --warn: #f9ab00;
    --bad: #f2645a;
    --c-system: #9aa0a6;
    --c-user: #a8c7fa;
    --c-agent: #4c8df6;
    --c-tool: #f9ab00;
    --c-custom: #c58af9;
    --c-sysmsg: #f28b82;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 12.5px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-button { display: none; }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--dim) 32%, transparent);
    border: 3px solid transparent;
    border-radius: 999px;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--dim) 55%, transparent); }

  .num { font-variant-numeric: tabular-nums; }
  .dim { color: var(--dim); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* sticky header */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 10px 12px 8px;
  }
  .hbar { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .hquota {
    display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
    padding: 4px 8px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card);
    font-size: 11px; color: var(--dim);
  }
  .hquota:hover { border-color: var(--dim); background: var(--card-hi); }
  .hquota.pool-a { border-color: color-mix(in srgb, var(--pool-a) 42%, transparent); background: color-mix(in srgb, var(--pool-a) 8%, transparent); }
  .hquota.pool-b { border-color: color-mix(in srgb, var(--pool-b) 42%, transparent); background: color-mix(in srgb, var(--pool-b) 8%, transparent); }
  .hquota.pool-c { border-color: color-mix(in srgb, var(--pool-c) 42%, transparent); background: color-mix(in srgb, var(--pool-c) 8%, transparent); }
  .hq-item { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 4px; overflow: hidden; white-space: nowrap; }
  .hq-sep { width: 1px; height: 12px; background: var(--line); flex: none; }
  .hq-lbl { color: var(--dim); font-weight: 500; flex: none; }
  .hq-val { font-weight: 700; color: var(--fg); flex: none; }
  .hq-val.ok { color: var(--ok); }
  .hq-val.warn { color: var(--warn); }
  .hq-val.bad { color: var(--bad); }
  .hq-cd { color: var(--dim); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; }
  .live { width: 7px; height: 7px; border-radius: 50%; background: var(--empty); flex: none; }
  .live.on { background: var(--ok); }
  .live.err { background: var(--bad); }
  .hmodel {
    flex: 1; min-width: 0; font-size: 12px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600; line-height: 1.2;
    border-radius: 999px; padding: 2px 7px; white-space: nowrap;
    border: 1px solid var(--line); color: var(--dim);
    background: var(--card);
  }
  .pill.click { cursor: pointer; }
  .pill.pool-a { color: var(--pool-a); border-color: color-mix(in srgb, var(--pool-a) 45%, transparent); background: color-mix(in srgb, var(--pool-a) 12%, transparent); }
  .pill.pool-b { color: var(--pool-b); border-color: color-mix(in srgb, var(--pool-b) 45%, transparent); background: color-mix(in srgb, var(--pool-b) 12%, transparent); }
  .pill.pool-c { color: var(--pool-c); border-color: color-mix(in srgb, var(--pool-c) 45%, transparent); background: color-mix(in srgb, var(--pool-c) 12%, transparent); }
  .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 12%, transparent); }
  .pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: color-mix(in srgb, var(--bad) 12%, transparent); }

  button {
    font: inherit; font-size: 11.5px; color: var(--dim); cursor: pointer; white-space: nowrap;
    background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px;
  }
  button:hover { color: var(--fg); border-color: var(--dim); }
  button.primary {
    color: #fff; background: var(--pool-a); border-color: var(--pool-a); font-weight: 600;
  }
  button.primary:hover { filter: brightness(1.08); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }

  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
  .tab {
    display: inline-flex; align-items: center; justify-content: center; gap: 3px;
    padding: 4px 3px; font-size: 11.5px; font-weight: 500;
    border-radius: 6px; border: 1px solid transparent; color: var(--dim);
    background: transparent;
  }
  .tab:hover { color: var(--fg); background: var(--card); border-color: transparent; }
  .tab.active {
    color: var(--fg); font-weight: 600;
    background: var(--card-hi); border-color: var(--line);
  }
  .tdot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

  main { padding: 10px 12px 20px; display: flex; flex-direction: column; gap: 10px; }

  /* cards */
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 11px;
  }
  .card.active-pool-a { border-color: color-mix(in srgb, var(--pool-a) 60%, transparent); background: color-mix(in srgb, var(--pool-a) 7%, transparent); }
  .card.active-pool-b { border-color: color-mix(in srgb, var(--pool-b) 60%, transparent); background: color-mix(in srgb, var(--pool-b) 7%, transparent); }
  .card.active-pool-c { border-color: color-mix(in srgb, var(--pool-c) 60%, transparent); background: color-mix(in srgb, var(--pool-c) 7%, transparent); }
  .ch { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
  .ctitle { font-size: 11.5px; font-weight: 700; letter-spacing: .03em; color: var(--fg); display: flex; align-items: center; gap: 6px; }
  .sub { font-size: 11.5px; color: var(--dim); }

  .bigrow { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin: 2px 0 6px; }
  .big { font-size: 20px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
  .big.ok { color: var(--ok); }
  .big.warn { color: var(--warn); }
  .big.bad { color: var(--bad); }

  /* progress bar */
  .bar-wrap { position: relative; height: 7px; border-radius: 999px; background: var(--track); overflow: visible; margin: 6px 0; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width .25s ease; min-width: 0; }
  .bar-tick {
    position: absolute; top: -2px; bottom: -2px; width: 2px;
    background: var(--warn); border-radius: 1px; pointer-events: none;
  }

  .meta-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--dim); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .chip {
    font-size: 11px; color: var(--dim); background: color-mix(in srgb, var(--fg) 4%, transparent);
    border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px;
  }
  .chip strong { color: var(--fg); font-weight: 600; }

  .callout {
    font-size: 11.5px; line-height: 1.45; border-radius: 8px; padding: 7px 9px;
    border: 1px solid var(--line); background: var(--card); color: var(--dim);
  }
  .callout.warn { border-color: color-mix(in srgb, var(--warn) 50%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); color: var(--fg); }
  .callout.bad { border-color: color-mix(in srgb, var(--bad) 50%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); color: var(--fg); }
  .callout.info { border-color: color-mix(in srgb, var(--pool-a) 45%, transparent); background: color-mix(in srgb, var(--pool-a) 8%, transparent); color: var(--fg); }

  /* pool item inside overview */
  .pool-mini {
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px;
    background: color-mix(in srgb, var(--fg) 2%, transparent);
  }
  .pool-mini + .pool-mini { margin-top: 7px; }
  .pool-mini.active-pool-a { border-color: color-mix(in srgb, var(--pool-a) 65%, transparent); background: color-mix(in srgb, var(--pool-a) 9%, transparent); }
  .pool-mini.active-pool-b { border-color: color-mix(in srgb, var(--pool-b) 65%, transparent); background: color-mix(in srgb, var(--pool-b) 9%, transparent); }
  .pool-mini.active-pool-c { border-color: color-mix(in srgb, var(--pool-c) 65%, transparent); background: color-mix(in srgb, var(--pool-c) 9%, transparent); }

  /* dual quota windows (5h + weekly) */
  .win-list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .win-mini .meta-row { font-size: 11px; }
  .bar-wrap.sm { height: 5px; margin: 3px 0 2px; }
  .win-box {
    border: 1px solid color-mix(in srgb, var(--line) 85%, transparent);
    border-radius: 7px; padding: 6px 8px;
    background: color-mix(in srgb, var(--bg) 45%, transparent);
  }
  .win-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; font-size: 11.5px; }
  .win-name { font-weight: 600; color: var(--fg); display: inline-flex; align-items: center; gap: 5px; }
  .win-pct { font-weight: 700; color: var(--fg); }
  .win-pct.warn { color: var(--warn); }
  .win-pct.bad { color: var(--bad); }
  .pill-row { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }

  /* stats grid & tables */
  .stat-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .stat-table th, .stat-table td { padding: 4px 4px; text-align: right; border-bottom: 1px solid color-mix(in srgb, var(--line) 65%, transparent); }
  .stat-table th:first-child, .stat-table td:first-child { text-align: left; }
  .stat-table th { font-weight: 600; color: var(--dim); font-size: 11px; }
  .stat-table tr:last-child td { border-bottom: none; }

  /* form */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 11px; color: var(--dim); }
  .field input, .field select {
    width: 100%; font: inherit; font-size: 12px; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px;
  }
  .form-actions { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .toast { font-size: 11.5px; color: var(--ok); }
  .toast.err { color: var(--bad); }

  /* event log & model list */
  .list { list-style: none; margin: 0; padding: 0; }
  .ev-item {
    display: grid; grid-template-columns: 52px 44px 1fr; gap: 6px; align-items: start;
    padding: 5px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent);
    font-size: 11.5px;
  }
  .ev-item:last-child { border-bottom: none; }
  .ev-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .ev-sub { font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .mini-badge {
    font-size: 10px; color: var(--dim); padding: 0 4px; border-radius: 4px;
    border: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
    background: color-mix(in srgb, var(--fg) 3%, transparent);
  }
  .tag {
    display: inline-block; text-align: center; font-size: 10px; font-weight: 700;
    border-radius: 4px; padding: 1px 3px; border: 1px solid var(--line);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tag.OK { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .tag.EOF, .tag.E429_RPM { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .tag.E429, .tag.ERR, .tag.WAF { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  .tag.WAF { background: color-mix(in srgb, var(--bad) 10%, transparent); }
  .tag.CAP { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .tag.E429_WEEKLY { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 55%, transparent); background: color-mix(in srgb, var(--bad) 12%, transparent); }
  .tag.CLIENT_ERR { color: var(--dim); border-color: var(--line); }
  .tag.RUNNING { color: var(--pool-a); border-color: color-mix(in srgb, var(--pool-a) 45%, transparent); }
  .flow-details { margin-top: 7px; font-size: 11px; color: var(--dim); }
  .flow-details summary { cursor: pointer; user-select: none; color: var(--dim); }
  .flow-details summary:hover { color: var(--fg); }

  /* rolling schedule & watermark band */
  .roll-head { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 7px; }
  .roll-kpi {
    border: 1px solid color-mix(in srgb, var(--line) 85%, transparent);
    border-radius: 7px; padding: 6px 8px;
    background: color-mix(in srgb, var(--bg) 45%, transparent);
  }
  .roll-kpi-lbl { font-size: 10.5px; color: var(--dim); }
  .roll-kpi-val { font-size: 13.5px; font-weight: 700; margin-top: 1px; color: var(--fg); }
  .roll-kpi-sub { font-size: 10.5px; color: var(--dim); margin-top: 1px; }
  .roll-list { display: flex; flex-direction: column; gap: 5px; margin-top: 7px; }
  .roll-row {
    display: grid; grid-template-columns: 74px 1fr auto; align-items: center; gap: 7px;
    font-size: 11px;
  }
  .rec-row {
    display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 7px;
    font-size: 11px;
  }
  .rec-sub {
    margin-top: 3px; font-size: 10.5px; color: var(--dim);
    display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap;
  }
  .rec-sub strong { color: var(--fg); font-weight: 600; }
  .rec-panel {
    margin-top: 7px; padding-top: 7px;
    border-top: 1px dashed color-mix(in srgb, var(--line) 85%, transparent);
  }
  .roll-time { color: var(--dim); white-space: nowrap; }
  .roll-bar { height: 7px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .roll-fill { height: 100%; border-radius: 999px; background: var(--ok); min-width: 3px; }
  .roll-fill.pool-a { background: var(--pool-a); }
  .roll-fill.pool-b { background: var(--pool-b); }
  .roll-fill.pool-c { background: var(--pool-c); }
  .roll-val { color: var(--fg); white-space: nowrap; text-align: right; }

  .band-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .band-box {
    border: 1px solid color-mix(in srgb, var(--line) 85%, transparent);
    border-radius: 7px; padding: 7px 8px;
    background: color-mix(in srgb, var(--bg) 45%, transparent);
  }
  .band-box.safe { border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .band-box.lock { border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .band-title { font-size: 10.5px; color: var(--dim); font-weight: 600; }
  .band-main { font-size: 14px; font-weight: 700; margin: 2px 0; color: var(--fg); }
  .band-sub { font-size: 10.5px; color: var(--dim); line-height: 1.35; }
  .pin-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap;
    padding: 6px 8px; margin-bottom: 8px; border-radius: 7px; font-size: 11px;
    border: 1px solid color-mix(in srgb, var(--line) 85%, transparent);
    background: color-mix(in srgb, var(--bg) 45%, transparent);
  }
  .pin-bar.pinned {
    border-color: color-mix(in srgb, var(--pool-a) 50%, transparent);
    background: color-mix(in srgb, var(--pool-a) 8%, transparent);
  }
  .pin-left { display: inline-flex; align-items: center; gap: 5px; color: var(--fg); font-weight: 600; }
  .pin-left input {
    width: 62px; padding: 2px 6px; font-size: 12px; font-weight: 600; text-align: right;
    border-radius: 5px; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  .pin-actions { display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .pin-actions button { padding: 3px 8px; font-size: 11px; }

  .tok-breakdown { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .manual-box.dimmed { opacity: .62; }

  .model-row {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 5px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
  }
  .model-row:last-child { border-bottom: none; }
  .model-left { min-width: 0; flex: 1; }
  .model-name { font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .tier {
    font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 4px;
    background: var(--card-hi); border: 1px solid var(--line); color: var(--fg);
  }
  .tier.IMG { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }

  /* context 100-dot grid & breakdown */
  .grid { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3.5px; max-width: 320px; margin: 6px 0 4px; }
  .dot { aspect-ratio: 1; border-radius: 50%; background: var(--empty); }
  .sec-sep { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }
  .h2 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 0 0 6px; display: flex; justify-content: space-between; }
  .h2 .hint { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .group + .group { margin-top: 7px; }
  .crow { display: grid; grid-template-columns: 10px 1fr auto 42px; align-items: center; gap: 7px; padding: 2px 0; font-size: 12px; }
  .crow .tok { text-align: right; }
  .crow .p { text-align: right; color: var(--dim); font-size: 11.5px; }
  .mark { width: 8px; height: 8px; border-radius: 50%; }
  .mark.sq { border-radius: 2px; }
  .mark.free { background: transparent; border: 1.5px solid var(--empty); }

  .files li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 3px 0; font-size: 12px; }
  .files .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files .dir { display: block; font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .files .tok { color: var(--dim); font-size: 11.5px; align-self: start; }

  .sum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-top: 6px; font-size: 11.5px; }
  .sum-item { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .sum-left { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .sum-left span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* prompt cache hit monitor */
  .cache-strip {
    margin-top: 7px; padding: 6px 8px; border-radius: 7px; cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--line) 85%, transparent);
    background: color-mix(in srgb, var(--bg) 42%, transparent);
  }
  .cache-strip:hover { border-color: var(--dim); background: var(--card-hi); }
  .cache-strip .meta-row { font-size: 11px; }
  .cache-bar { height: 4px; border-radius: 999px; background: var(--track); overflow: hidden; margin: 5px 0 4px; }
  .cache-bar-fill { height: 100%; border-radius: 999px; transition: width .25s ease; }
  .cache-spark {
    display: flex; align-items: flex-end; gap: 3px; height: 34px;
    padding: 4px 4px 3px; margin-top: 7px; border-radius: 7px;
    border: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
    background: color-mix(in srgb, var(--bg) 45%, transparent);
  }
  .cache-col {
    flex: 1; min-width: 4px; height: 100%; display: flex; align-items: flex-end;
    position: relative;
  }
  .cache-col.after-compact {
    margin-left: 2px; padding-left: 3px;
    border-left: 1px dashed color-mix(in srgb, var(--pool-a) 65%, transparent);
  }
  .cache-seg {
    width: 100%; border-radius: 2px 2px 1px 1px; min-height: 3px;
    transition: height .2s ease;
  }
  .cache-seg.high { background: var(--ok); }
  .cache-seg.mid { background: var(--warn); }
  .cache-seg.low { background: color-mix(in srgb, var(--warn) 78%, transparent); }
  .cache-seg.miss { background: var(--bad); }
  .cache-seg.cold { background: var(--pool-a); opacity: .82; }
  .cache-legend {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    flex-wrap: wrap; margin-top: 5px; font-size: 10.5px; color: var(--dim);
  }
  .cache-legend-items { display: inline-flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .cache-dot { display: inline-block; width: 6px; height: 6px; border-radius: 2px; margin-right: 3px; vertical-align: middle; }
  .up-warn { color: var(--warn); }

  .link-btn {
    background: none; border: none; padding: 0; color: var(--pool-a); font-size: 11.5px; cursor: pointer;
  }
  .link-btn:hover { text-decoration: underline; color: var(--pool-a); }

  .empty { margin: 28px 8px; text-align: center; color: var(--dim); font-size: 12px; }
  footer { margin-top: 4px; font-size: 11px; color: var(--dim); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <div class="hbar">
    <span id="live-dot" class="live" title="实时状态"></span>
    <span id="hdr-model" class="hmodel">加载中…</span>
    <span id="hdr-pool" class="pill click" style="display:none" title="查看模型配额池"></span>
    <button id="btn-refresh" title="强制刷新全部数据">刷新</button>
  </div>
  <div id="hdr-quota" class="hquota" style="display:none" title="当前模型所属池的双窗口额度（点击查看详情）"></div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="overview">总览</button>
    <button class="tab" data-tab="image">生图 <span id="tab-img-dot" class="tdot" style="display:none"></span></button>
    <button class="tab" data-tab="flow">Flow <span id="tab-flow-dot" class="tdot" style="display:none"></span></button>
    <button class="tab" data-tab="pools">池子</button>
    <button class="tab" data-tab="context">上下文</button>
  </nav>
</header>
<main id="view"><p class="empty">正在读取配额与上下文数据…</p></main>

<script>
(() => {
  const POLL_MS = 3000;
  const SEG_COLORS = ['var(--c-system)', 'var(--c-user)', 'var(--c-agent)', 'var(--c-tool)', 'var(--c-custom)'];
  const CAT_COLOR = {
    user: 'var(--c-user)', agent: 'var(--c-agent)', tool: 'var(--c-tool)',
    system_prompt: 'var(--c-system)', system_tools: 'var(--c-system)',
    system_overhead: 'var(--c-system)', system_messages: 'var(--c-sysmsg)',
    rules: 'var(--c-custom)', skills: 'var(--c-custom)', subagents: 'var(--c-custom)',
    legacy_workflows: 'var(--c-custom)', workflows: 'var(--c-custom)',
    plugins: 'var(--c-custom)', mcp_tools: 'var(--c-custom)',
  };
  const CAT_LABEL = {
    user: '用户消息', agent: '模型回复', tool: '工具调用',
    system_prompt: '系统提示词', system_tools: '系统工具定义',
    system_overhead: '系统开销', system_messages: '系统消息',
    rules: '规则 (Rules)', skills: '技能 (Skills)', subagents: '子代理',
    legacy_workflows: '旧工作流', workflows: '工作流',
    plugins: '插件', mcp_tools: 'MCP 工具',
  };
  const CTX_GROUPS = [
    { keys: ['user', 'agent', 'tool'], sq: false },
    { keys: ['system_prompt', 'system_tools', 'system_overhead', 'system_messages'], sq: true },
    { keys: ['rules', 'skills', 'subagents', 'legacy_workflows', 'workflows', 'plugins', 'mcp_tools'], sq: true },
  ];

  const state = {
    tab: 'overview',
    dash: null,
    workspace: '',
    clockOffsetSec: 0,
    lastKey: '',
    lastHdrQuotaKey: '',
    inFlight: false,
    toast: null,
    pinToast: null,
    calResetArmUntil: 0,
    flowSyncing: false,
    flowToast: null,
    flowSettingsToast: null,
  };

  const $ = (id) => document.getElementById(id);
  const nowSec = () => Math.floor(Date.now() / 1000) + state.clockOffsetSec;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));

  function fmtTok(n) {
    const v = Number(n) || 0;
    if (v >= 1e6) return `${(v / 1e6).toFixed(1)}M`;
    if (v >= 1e3) return `${(v / 1e3).toFixed(1)}k`;
    return String(Math.round(v));
  }

  function fmtClock(ts) {
    if (!ts || ts <= 0) return '--:--:--';
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString('zh-CN', { hour12: false });
  }

  function fmtHM(ts) {
    if (!ts || ts <= 0) return '--:--';
    const d = new Date(ts * 1000);
    const pad = (x) => String(x).padStart(2, '0');
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function fmtUsd(v) {
    const n = Number(v) || 0;
    if (n <= 0) return '$0.00';
    if (n < 0.1) return `$${n.toFixed(4)}`;
    return `$${n.toFixed(2)}`;
  }

  function fmtDateTime(ts) {
    if (!ts || ts <= 0) return '--';
    const d = new Date(ts * 1000);
    const pad = (x) => String(x).padStart(2, '0');
    return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function fmtMD(ts) {
    if (!ts || ts <= 0) return '--';
    const d = new Date(ts * 1000);
    const pad = (x) => String(x).padStart(2, '0');
    return `${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function fmtDuration(sec, zeroText = '已重置') {
    const s = Math.floor(Number(sec) || 0);
    if (s <= 0) return zeroText;
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    const r = s % 60;
    if (d > 0) return `${d}天${h}时`;
    if (h > 0) return `${h}时${String(m).padStart(2, '0')}分${String(r).padStart(2, '0')}秒`;
    if (m > 0) return `${m}分${String(r).padStart(2, '0')}秒`;
    return `${r}秒`;
  }

  function cdSpan(ts, zeroText = '已重置') {
    if (!ts || ts <= 0) return `<span class="num">${esc(zeroText)}</span>`;
    return `<span class="num" data-cd-ts="${Math.round(ts)}" data-cd-zero="${esc(zeroText)}">${esc(fmtDuration(ts - nowSec(), zeroText))}</span>`;
  }

  function fmtElapsed(sec) {
    const s = Math.max(0, Math.floor(Number(sec) || 0));
    if (s < 60) return `${s}秒前`;
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    const r = s % 60;
    if (d > 0) return `${d}天${h}时前`;
    if (h > 0) return `${h}时${String(m).padStart(2, '0')}分前`;
    return `${m}分${String(r).padStart(2, '0')}秒前`;
  }

  function elapsedTextWithHint(elapsedSec, hintCool) {
    const base = fmtElapsed(elapsedSec);
    if (!hintCool) return base;
    if (elapsedSec >= 360) return `${base} · 可能已冷却`;
    if (elapsedSec >= 270) return `${base} · 临近冷却`;
    return base;
  }

  function elapsedSpan(ts, hintCool = true) {
    if (!ts || ts <= 0) return '';
    const el = Math.max(0, nowSec() - ts);
    const warnCls = hintCool && el >= 270 ? ' up-warn' : '';
    return `<span class="num${warnCls}" data-up-ts="${Math.round(ts)}" data-up-cool="${hintCool ? '1' : '0'}">${esc(elapsedTextWithHint(el, hintCool))}</span>`;
  }

  function tickCountdowns() {
    const cur = nowSec();
    document.querySelectorAll('[data-cd-ts]').forEach((el) => {
      const ts = Number(el.dataset.cdTs || 0);
      const zero = el.dataset.cdZero || '已重置';
      if (ts > 0) el.textContent = fmtDuration(ts - cur, zero);
    });
    document.querySelectorAll('[data-up-ts]').forEach((el) => {
      const ts = Number(el.dataset.upTs || 0);
      const hintCool = el.dataset.upCool === '1';
      if (ts > 0) {
        const diff = Math.max(0, cur - ts);
        el.textContent = elapsedTextWithHint(diff, hintCool);
        el.classList.toggle('up-warn', hintCool && diff >= 270);
      }
    });
  }

  function cacheStatusMeta(cache) {
    if (!cache || !cache.has_data || !cache.latest) {
      return { pill: '', text: '暂无数据', color: 'var(--dim)' };
    }
    if (cache.compacted_pending) {
      return { pill: 'pool-a', text: '压缩待首轮', color: 'var(--pool-a)' };
    }
    const lat = cache.latest;
    if (lat.status === 'high') return { pill: 'ok', text: '高命中', color: 'var(--ok)' };
    if (lat.status === 'mid') return { pill: 'warn', text: '中命中', color: 'var(--warn)' };
    if (lat.status === 'low') return { pill: 'warn', text: '新增较多', color: 'var(--warn)' };
    if (lat.status === 'miss') return { pill: 'bad', text: '失效重建', color: 'var(--bad)' };
    if (lat.status === 'cold') {
      return { pill: 'pool-a', text: lat.after_compact ? '压缩首轮' : '冷启动', color: 'var(--pool-a)' };
    }
    return { pill: '', text: '正常', color: 'var(--dim)' };
  }

  function cacheTurnStatusLabel(t) {
    if (!t) return '';
    if (t.status === 'high') return '高命中';
    if (t.status === 'mid') return '中命中';
    if (t.status === 'low') return '新增较多（旧前缀保留）';
    if (t.status === 'miss') return '缓存失效重建';
    if (t.status === 'cold') return t.after_compact ? '压缩后首轮（冷启）' : '会话首轮（冷启）';
    return t.status || '';
  }

  function renderCacheOverviewStrip(cache) {
    if (!cache || !cache.has_data || !cache.latest) return '';
    const lat = cache.latest;
    const seg = cache.segment || {};
    const ses = cache.session || {};
    const cm = cacheStatusMeta(cache);
    const barPct = Math.max(0, Math.min(100, Number(lat.hit_rate_pct || 0)));
    const barColor = lat.status === 'miss' ? 'var(--bad)' : (lat.status === 'cold' ? 'var(--pool-a)' : cm.color);
    const scopeTxt = cache.has_compaction && seg.turns > 0
      ? `本段 ${Number(seg.hit_rate_pct || 0).toFixed(1)}% · 整场 ${Number(ses.hit_rate_pct || 0).toFixed(1)}%`
      : `累计 ${Number(ses.hit_rate_pct || 0).toFixed(1)}% (${ses.turns || 0}轮${ses.misses > 0 ? ` · ${ses.misses}失效` : ''})`;
    const elHtml = lat.ts > 0 ? elapsedSpan(lat.ts, !cache.compacted_pending) : '';
    return `<div class="cache-strip" data-jump="context" title="点击查看 Prompt 缓存逐轮命中轨迹">
      <div class="meta-row" style="margin-top:0">
        <span style="color:var(--fg);font-weight:600;display:inline-flex;align-items:center;gap:5px">
          <span>Prompt 缓存</span>
          <span class="pill ${cm.pill} num" style="font-size:10px;padding:1px 5px">${esc(cm.text)} ${Number(lat.hit_rate_pct || 0).toFixed(1)}%</span>
        </span>
        <span class="num">读 <strong style="color:var(--fg)">${fmtTok(lat.cache_read_tokens)}</strong> · 新 ${fmtTok(lat.uncached_input_tokens)}</span>
      </div>
      <div class="cache-bar"><div class="cache-bar-fill" style="width:${barPct}%;background:${barColor}"></div></div>
      <div class="meta-row">
        <span class="num">${esc(scopeTxt)}</span>
        <span>${elHtml}</span>
      </div>
    </div>`;
  }

  function renderCacheCard(cache) {
    if (!cache || !cache.has_data || !cache.latest) return '';
    const lat = cache.latest;
    const seg = cache.segment || {};
    const ses = cache.session || {};
    const recent = cache.recent || [];
    const cm = cacheStatusMeta(cache);
    const showSeg = Boolean(cache.has_compaction && seg.turns > 0);
    const elHtml = lat.ts > 0 ? elapsedSpan(lat.ts, !cache.compacted_pending) : '';
    const prefTxt = lat.prefix_retention_pct !== null && lat.prefix_retention_pct !== undefined
      ? ` · 前缀复用 ${Number(lat.prefix_retention_pct).toFixed(1)}%`
      : '';
    const totalTurns = Number(ses.turns || recent.length);
    const startTurnNo = Math.max(1, totalTurns - recent.length + 1);

    const barsHtml = recent.map((t, i) => {
      const turnNo = startTurnNo + i;
      const pctVal = Number(t.hit_rate_pct || 0);
      const minH = (t.status === 'miss' || t.status === 'cold') ? 22 : 12;
      const h = Math.max(minH, Math.min(100, Math.round(pctVal)));
      const pfx = t.prefix_retention_pct !== null && t.prefix_retention_pct !== undefined
        ? ` · 上轮前缀复用 ${Number(t.prefix_retention_pct).toFixed(1)}%`
        : '';
      const timeTxt = t.ts > 0 ? ` · ${fmtClock(t.ts)}` : '';
      const tip = `第 ${turnNo} 轮 · ${cacheTurnStatusLabel(t)} · 命中 ${pctVal.toFixed(1)}%（读 ${fmtTok(t.cache_read_tokens)} / 新 ${fmtTok(t.uncached_input_tokens)}）${pfx}${timeTxt}`;
      const cls = `cache-col${t.after_compact && i > 0 ? ' after-compact' : ''}`;
      return `<div class="${cls}" title="${esc(tip)}"><div class="cache-seg ${esc(t.status || 'high')}" style="height:${h}%"></div></div>`;
    }).join('');

    const rightBoxTitle = showSeg ? `本段压缩后 (${seg.turns}轮)` : `整场累计 (${ses.turns}轮)`;
    const rightBoxPct = showSeg ? Number(seg.hit_rate_pct || 0) : Number(ses.hit_rate_pct || 0);
    const rightBoxRead = showSeg ? seg.cache_read_tokens : ses.cache_read_tokens;
    const rightBoxMiss = showSeg ? (seg.misses || 0) : (ses.misses || 0);

    return `<section class="card">
      <div class="ch">
        <span class="ctitle">Prompt 缓存命中 <span class="pill ${cm.pill}">${esc(cm.text)}</span></span>
        <span class="sub">${elHtml || `${ses.turns} 轮记录`}</span>
      </div>
      <div class="roll-head" style="margin-bottom:6px">
        <div class="roll-kpi">
          <div class="roll-kpi-lbl">最新一轮命中率</div>
          <div class="roll-kpi-val num" style="color:${cm.color}">${Number(lat.hit_rate_pct || 0).toFixed(1)}%</div>
          <div class="roll-kpi-sub num">读 ${fmtTok(lat.cache_read_tokens)} / 新 ${fmtTok(lat.uncached_input_tokens)}${esc(prefTxt)}</div>
        </div>
        <div class="roll-kpi">
          <div class="roll-kpi-lbl">${esc(rightBoxTitle)}</div>
          <div class="roll-kpi-val num">${rightBoxPct.toFixed(1)}%</div>
          <div class="roll-kpi-sub num">读 ${fmtTok(rightBoxRead)} · ${rightBoxMiss > 0 ? `<span style="color:var(--bad)">${rightBoxMiss}次失效</span>` : '0次失效'}</div>
        </div>
      </div>
      ${showSeg ? `<div class="chips" style="margin-top:0;margin-bottom:4px">
        <span class="chip num">整场累计 <strong>${Number(ses.hit_rate_pct || 0).toFixed(1)}%</strong> (${ses.turns}轮)</span>
        <span class="chip num">累计缓存读 <strong>${fmtTok(ses.cache_read_tokens)}</strong></span>
        <span class="chip num">失效重建 <strong>${ses.misses || 0}次</strong></span>
      </div>` : ''}
      ${cache.compacted_pending ? `<div class="callout info" style="margin-top:6px">已执行 <span class="mono">/compact</span>，下条消息将基于压缩摘要重新冷启写入缓存。</div>` : ''}
      ${!cache.compacted_pending && lat.status === 'miss' ? `<div class="callout bad" style="margin-top:6px">上一轮发生缓存失效重建（新增写入 ${fmtTok(lat.uncached_input_tokens)} tok${lat.prefix_retention_pct !== null && lat.prefix_retention_pct !== undefined ? `，前缀仅保留 ${Number(lat.prefix_retention_pct).toFixed(1)}%` : ''}），继续对话下一轮起将恢复高命中。</div>` : ''}
      ${recent.length ? `
        <div class="cache-spark">${barsHtml}</div>
        <div class="cache-legend">
          <span class="cache-legend-items">
            <span><i class="cache-dot" style="background:var(--ok)"></i>≥80%</span>
            <span><i class="cache-dot" style="background:var(--warn)"></i>中/新增多</span>
            <span><i class="cache-dot" style="background:var(--bad)"></i>失效</span>
            <span><i class="cache-dot" style="background:var(--pool-a)"></i>冷启</span>
          </span>
          <span class="num">近 ${recent.length} 轮轨迹（悬停看明细）</span>
        </div>` : ''}
      <div class="sub" style="margin-top:6px;line-height:1.4">取自对话库原生 <span class="mono">model_usage</span>（缓存读 / 新增输入）；独立生图调用不走对话前缀缓存。</div>
    </section>`;
  }

  function healthCls(h) {
    if (h === 'locked' || h === 'critical') return 'bad';
    if (h === 'warning') return 'warn';
    return 'ok';
  }

  function barFillColor(h, accent) {
    if (h === 'locked' || h === 'critical') return 'var(--bad)';
    if (h === 'warning') return 'var(--warn)';
    return accent ? `var(--${accent})` : 'var(--ok)';
  }

  function imgStatusMeta(w5, anchor) {
    if (!w5) return { pill: '', text: '未知', big: '', mode: '' };
    if (w5.weekly_cooldown_active) {
      return { pill: 'bad', text: '周池 429 冷却', big: 'bad', mode: '官方周池 429 锁定' };
    }
    if (w5.cooldown_active || w5.health === 'locked') {
      return { pill: 'bad', text: '429 冷却中', big: 'bad', mode: '官方 429 锁定窗口' };
    }
    if (anchor?.exceeded_safe_peak || w5.exceeded_safe_peak) {
      return { pill: 'warn', text: '刷新安全峰', big: 'warn', mode: '连续 5h 时间滚轴' };
    }
    if (w5.health === 'critical') {
      return { pill: 'bad', text: '已达上限', big: 'bad', mode: '连续 5h 时间滚轴' };
    }
    if (anchor?.eof_warning || w5.eof_warning) {
      return { pill: 'warn', text: 'EOF 偏高', big: 'warn', mode: '连续 5h 时间滚轴' };
    }
    if (w5.health === 'warning') {
      const txt = anchor?.is_hard_ceiling === false ? '接近安全峰' : '接近预警线';
      return { pill: 'warn', text: txt, big: 'warn', mode: '连续 5h 时间滚轴' };
    }
    if (w5.mode === 'idle_full') {
      return { pill: 'ok', text: '空窗满血', big: 'ok', mode: '5h 滚轴已清空' };
    }
    return { pill: 'ok', text: '滚轴活跃', big: 'ok', mode: '连续 5h 时间滚轴' };
  }

  function eventTagInfo(kind) {
    if (kind === '429_WEEKLY') return { cls: 'E429_WEEKLY', text: '周429', tip: '7 天周配额耗尽（跨日冷却）' };
    if (kind === '429') return { cls: 'E429', text: '429', tip: '5h 配额耗尽 (QUOTA_EXHAUSTED)' };
    if (kind === '429_RPM') return { cls: 'E429_RPM', text: 'RPM', tip: '突发每分钟速率限流 (已与 5h 池剥离)' };
    if (kind === 'CLIENT_ERR') return { cls: 'CLIENT_ERR', text: '参数错', tip: '本地参数校验失败 (未发往服务端、不扣配额)' };
    if (kind === 'RUNNING') return { cls: 'RUNNING', text: '生成中', tip: '进行中' };
    return { cls: kind || 'ERR', text: kind || 'ERR', tip: kind || '' };
  }

  function weeklyRecSourceMeta(rec) {
    if (!rec) return { pill: '', text: '' };
    if (rec.source === 'snapshot') return { pill: 'ok', text: '快照实测' };
    if (rec.source === 'hybrid') return { pill: 'pool-a', text: '实测+估算' };
    if (rec.source === 'local_estimate') return { pill: 'warn', text: '7d冷启动估算' };
    if (rec.source === 'full') return { pill: 'ok', text: '满额' };
    return { pill: '', text: '官方参考' };
  }

  function renderPoolWeeklyRecoveryOverview(rec) {
    if (!rec || rec.source === 'full' || Number(rec.usedPct || 0) <= 0.05) return '';
    const sm = weeklyRecSourceMeta(rec);
    const obs = rec.observedRecovery || {};
    let leftHtml = '';
    if (obs.isActive) {
      const ratePart = obs.ratePctPerHour > 0 ? ` +${obs.ratePctPerHour}%/h` : '';
      leftHtml = `<span style="color:var(--ok);font-weight:600">回血中${ratePart}</span>${rec.recoverNext24hPct >= 0.1 ? ` · 24h预计 +${rec.recoverNext24hPct.toFixed(1)}%` : ''}`;
    } else if (Number(rec.recoverNext24hPct || 0) >= 0.1) {
      leftHtml = `24h周回血 <strong>+${Number(rec.recoverNext24hPct).toFixed(1)}%</strong>${Number(rec.recoverNext48hPct || 0) > Number(rec.recoverNext24hPct || 0) + 0.05 ? ` · 48h +${Number(rec.recoverNext48hPct).toFixed(1)}%` : ''}`;
    } else if (rec.nextRecoverTs > 0) {
      leftHtml = `下批周回血 <strong>${fmtMD(rec.nextRecoverTs)}</strong> (+${Number(rec.nextRecoverPct || 0).toFixed(1)}%)`;
    } else {
      leftHtml = '周回血追踪中';
    }
    const rightTxt = obs.recovered24hPct >= 0.1
      ? `24h已回 +${Number(obs.recovered24hPct).toFixed(1)}% · ${sm.text}`
      : sm.text;
    const tip = `${rec.sourceLabel || ''}：${rec.note || ''}`;
    return `<div class="rec-sub num" title="${esc(tip)}">
      <span>${leftHtml}</span>
      <span class="dim">${esc(rightTxt)}</span>

  function gridCells(segs, limit) {
    const N = 100;
    const c = (segs || []).map((t) => (t && limit ? Math.max(1, Math.floor((t / limit) * N)) : 0));
    const sum = c.reduce((a, b) => a + b, 0);
    if (sum > N) {
      const f = N / sum;
      for (let i = 0; i < c.length; i++) c[i] = Math.floor(c[i] * f);
    }
    const out = [];
    c.forEach((n, i) => { for (let k = 0; k < n; k++) out.push(SEG_COLORS[i]); });
    while (out.length < N) out.push(null);
    return out;
  }

  function splitPath(p) {
    const i = Math.max(p.lastIndexOf('/'), p.lastIndexOf('\\'));
    return i < 0 ? [p, ''] : [p.slice(i + 1), p.slice(0, i + 1)];
  }

  function poolWindowsList(p) {
    if (Array.isArray(p?.windows) && p.windows.length) return p.windows;
    const out = [];
    if (p?.fiveHour) out.push(p.fiveHour);
    if (p?.weekly) out.push(p.weekly);
    if (!out.length && p && p.remainingPct !== null && p.remainingPct !== undefined) {
      out.push({
        window: 'quota',
        label: '当前额度',
        shortLabel: '余',
        remainingPct: p.remainingPct,
        usedPct: p.usedPct,
        resetTs: p.resetTs || 0,
        isFull: p.remainingPct >= 99.99,
        health: p.health || 'ok',
      });
    }
    return out;
  }

  function winResetHtml(w, compact = false) {
