<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配额与上下文</title>
<script src="/preload.js"></script>
<style>
  :root {
    --bg: var(--background, #16181d);
    --fg: var(--foreground, #e4e7ec);
    --dim: var(--muted-foreground, #9aa0a6);
    --line: var(--border, rgba(127, 127, 127, .24));
    --card: color-mix(in srgb, var(--fg) 4%, transparent);
    --card-hi: color-mix(in srgb, var(--fg) 7%, transparent);
    --track: color-mix(in srgb, var(--dim) 20%, transparent);
    --empty: color-mix(in srgb, var(--dim) 28%, transparent);
    --pool-a: #4c8df6;
    --pool-b: #b07ef6;
    --pool-c: #38bdf8;
    --ok: #34a853;
    --warn: #f9ab00;
    --bad: #f2645a;
    --c-system: #9aa0a6;
    --c-user: #a8c7fa;
    --c-agent: #4c8df6;
    --c-tool: #f9ab00;
    --c-custom: #c58af9;
    --c-sysmsg: #f28b82;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 12.5px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  ::-webkit-scrollbar-button { display: none; }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--dim) 32%, transparent);
    border: 3px solid transparent;
    border-radius: 999px;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--dim) 55%, transparent); }

  .num { font-variant-numeric: tabular-nums; }
  .dim { color: var(--dim); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* sticky header */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 10px 12px 8px;
  }
  .hbar { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .hquota {
    display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
    padding: 4px 8px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card);
    font-size: 11px; color: var(--dim);
  }
  .hquota:hover { border-color: var(--dim); background: var(--card-hi); }
  .hquota.pool-a { border-color: color-mix(in srgb, var(--pool-a) 42%, transparent); background: color-mix(in srgb, var(--pool-a) 8%, transparent); }
  .hquota.pool-b { border-color: color-mix(in srgb, var(--pool-b) 42%, transparent); background: color-mix(in srgb, var(--pool-b) 8%, transparent); }
  .hquota.pool-c { border-color: color-mix(in srgb, var(--pool-c) 42%, transparent); background: color-mix(in srgb, var(--pool-c) 8%, transparent); }
  .hq-item { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 4px; overflow: hidden; white-space: nowrap; }
  .hq-sep { width: 1px; height: 12px; background: var(--line); flex: none; }
  .hq-lbl { color: var(--dim); font-weight: 500; flex: none; }
  .hq-val { font-weight: 700; color: var(--fg); flex: none; }
  .hq-val.ok { color: var(--ok); }
  .hq-val.warn { color: var(--warn); }
  .hq-val.bad { color: var(--bad); }
  .hq-cd { color: var(--dim); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; }
  .live { width: 7px; height: 7px; border-radius: 50%; background: var(--empty); flex: none; }
  .live.on { background: var(--ok); }
  .live.err { background: var(--bad); }
  .hmodel {
    flex: 1; min-width: 0; font-size: 12px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 600; line-height: 1.2;
    border-radius: 999px; padding: 2px 7px; white-space: nowrap;
    border: 1px solid var(--line); color: var(--dim);
    background: var(--card);
  }
  .pill.click { cursor: pointer; }
  .pill.pool-a { color: var(--pool-a); border-color: color-mix(in srgb, var(--pool-a) 45%, transparent); background: color-mix(in srgb, var(--pool-a) 12%, transparent); }
  .pill.pool-b { color: var(--pool-b); border-color: color-mix(in srgb, var(--pool-b) 45%, transparent); background: color-mix(in srgb, var(--pool-b) 12%, transparent); }
  .pill.pool-c { color: var(--pool-c); border-color: color-mix(in srgb, var(--pool-c) 45%, transparent); background: color-mix(in srgb, var(--pool-c) 12%, transparent); }
  .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 12%, transparent); }
  .pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: color-mix(in srgb, var(--bad) 12%, transparent); }

  button {
    font: inherit; font-size: 11.5px; color: var(--dim); cursor: pointer; white-space: nowrap;
    background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px;
  }
  button:hover { color: var(--fg); border-color: var(--dim); }
  button.primary {
    color: #fff; background: var(--pool-a); border-color: var(--pool-a); font-weight: 600;
  }
  button.primary:hover { filter: brightness(1.08); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }

  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .tab {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    padding: 4px 6px; font-size: 12px; font-weight: 500;
    border-radius: 6px; border: 1px solid transparent; color: var(--dim);
    background: transparent;
  }
  .tab:hover { color: var(--fg); background: var(--card); border-color: transparent; }
  .tab.active {
    color: var(--fg); font-weight: 600;
    background: var(--card-hi); border-color: var(--line);
  }
  .tdot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

  main { padding: 10px 12px 20px; display: flex; flex-direction: column; gap: 10px; }

  /* cards */
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 11px;
  }
  .card.active-pool-a { border-color: color-mix(in srgb, var(--pool-a) 60%, transparent); background: color-mix(in srgb, var(--pool-a) 7%, transparent); }
  .card.active-pool-b { border-color: color-mix(in srgb, var(--pool-b) 60%, transparent); background: color-mix(in srgb, var(--pool-b) 7%, transparent); }
  .card.active-pool-c { border-color: color-mix(in srgb, var(--pool-c) 60%, transparent); background: color-mix(in srgb, var(--pool-c) 7%, transparent); }
  .ch { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
  .ctitle { font-size: 11.5px; font-weight: 700; letter-spacing: .03em; color: var(--fg); display: flex; align-items: center; gap: 6px; }
  .sub { font-size: 11.5px; color: var(--dim); }

  .bigrow { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin: 2px 0 6px; }
  .big { font-size: 20px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
  .big.ok { color: var(--ok); }
  .big.warn { color: var(--warn); }
  .big.bad { color: var(--bad); }

  /* progress bar */
  .bar-wrap { position: relative; height: 7px; border-radius: 999px; background: var(--track); overflow: visible; margin: 6px 0; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width .25s ease; min-width: 0; }
  .bar-tick {
    position: absolute; top: -2px; bottom: -2px; width: 2px;
    background: var(--warn); border-radius: 1px; pointer-events: none;
  }

  .meta-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--dim); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .chip {
    font-size: 11px; color: var(--dim); background: color-mix(in srgb, var(--fg) 4%, transparent);
    border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px;
  }
  .chip strong { color: var(--fg); font-weight: 600; }

  .callout {
    font-size: 11.5px; line-height: 1.45; border-radius: 8px; padding: 7px 9px;
    border: 1px solid var(--line); background: var(--card); color: var(--dim);
  }
  .callout.warn { border-color: color-mix(in srgb, var(--warn) 50%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); color: var(--fg); }
  .callout.bad { border-color: color-mix(in srgb, var(--bad) 50%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); color: var(--fg); }
  .callout.info { border-color: color-mix(in srgb, var(--pool-a) 45%, transparent); background: color-mix(in srgb, var(--pool-a) 8%, transparent); color: var(--fg); }

  /* pool item inside overview */
  .pool-mini {
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px;
    background: color-mix(in srgb, var(--fg) 2%, transparent);
  }
  .pool-mini + .pool-mini { margin-top: 7px; }
  .pool-mini.active-pool-a { border-color: color-mix(in srgb, var(--pool-a) 65%, transparent); background: color-mix(in srgb, var(--pool-a) 9%, transparent); }
  .pool-mini.active-pool-b { border-color: color-mix(in srgb, var(--pool-b) 65%, transparent); background: color-mix(in srgb, var(--pool-b) 9%, transparent); }
  .pool-mini.active-pool-c { border-color: color-mix(in srgb, var(--pool-c) 65%, transparent); background: color-mix(in srgb, var(--pool-c) 9%, transparent); }

  /* dual quota windows (5h + weekly) */
  .win-list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .win-mini .meta-row { font-size: 11px; }
  .bar-wrap.sm { height: 5px; margin: 3px 0 2px; }
  .win-box {
    border: 1px solid color-mix(in srgb, var(--line) 85%, transparent);
    border-radius: 7px; padding: 6px 8px;
    background: color-mix(in srgb, var(--bg) 45%, transparent);
  }
  .win-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; font-size: 11.5px; }
  .win-name { font-weight: 600; color: var(--fg); display: inline-flex; align-items: center; gap: 5px; }
  .win-pct { font-weight: 700; color: var(--fg); }
  .win-pct.warn { color: var(--warn); }
  .win-pct.bad { color: var(--bad); }
  .pill-row { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }

  /* stats grid & tables */
  .stat-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .stat-table th, .stat-table td { padding: 4px 4px; text-align: right; border-bottom: 1px solid color-mix(in srgb, var(--line) 65%, transparent); }
  .stat-table th:first-child, .stat-table td:first-child { text-align: left; }
  .stat-table th { font-weight: 600; color: var(--dim); font-size: 11px; }
  .stat-table tr:last-child td { border-bottom: none; }

  /* form */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 11px; color: var(--dim); }
  .field input, .field select {
    width: 100%; font: inherit; font-size: 12px; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px;
  }
  .form-actions { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .toast { font-size: 11.5px; color: var(--ok); }
  .toast.err { color: var(--bad); }

  /* event log & model list */
  .list { list-style: none; margin: 0; padding: 0; }
  .ev-item {
    display: grid; grid-template-columns: 52px 44px 1fr; gap: 6px; align-items: start;
    padding: 5px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent);
    font-size: 11.5px;
  }
  .ev-item:last-child { border-bottom: none; }
  .ev-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .ev-sub { font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .mini-badge {
    font-size: 10px; color: var(--dim); padding: 0 4px; border-radius: 4px;
    border: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
    background: color-mix(in srgb, var(--fg) 3%, transparent);
  }
  .tag {
    display: inline-block; text-align: center; font-size: 10px; font-weight: 700;
    border-radius: 4px; padding: 1px 3px; border: 1px solid var(--line);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tag.OK { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .tag.EOF, .tag.E429_RPM { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .tag.E429, .tag.ERR { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  .tag.CLIENT_ERR { color: var(--dim); border-color: var(--line); }
  .tag.RUNNING { color: var(--pool-a); border-color: color-mix(in srgb, var(--pool-a) 45%, transparent); }

  /* rolling schedule & watermark band */
  .roll-head { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 7px; }
  .roll-kpi {
    border: 1px solid color-mix(in srgb, var(--line) 85%, transparent);
    border-radius: 7px; padding: 6px 8px;
    background: color-mix(in srgb, var(--bg) 45%, transparent);
  }
  .roll-kpi-lbl { font-size: 10.5px; color: var(--dim); }
  .roll-kpi-val { font-size: 13.5px; font-weight: 700; margin-top: 1px; color: var(--fg); }
  .roll-kpi-sub { font-size: 10.5px; color: var(--dim); margin-top: 1px; }
  .roll-list { display: flex; flex-direction: column; gap: 5px; margin-top: 7px; }
  .roll-row {
    display: grid; grid-template-columns: 74px 1fr auto; align-items: center; gap: 7px;
    font-size: 11px;
  }
  .roll-time { color: var(--dim); white-space: nowrap; }
  .roll-bar { height: 7px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .roll-fill { height: 100%; border-radius: 999px; background: var(--ok); min-width: 3px; }
  .roll-val { color: var(--fg); white-space: nowrap; text-align: right; }

  .band-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .band-box {
    border: 1px solid color-mix(in srgb, var(--line) 85%, transparent);
    border-radius: 7px; padding: 7px 8px;
    background: color-mix(in srgb, var(--bg) 45%, transparent);
  }
  .band-box.safe { border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .band-box.lock { border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .band-title { font-size: 10.5px; color: var(--dim); font-weight: 600; }
  .band-main { font-size: 14px; font-weight: 700; margin: 2px 0; color: var(--fg); }
  .band-sub { font-size: 10.5px; color: var(--dim); line-height: 1.35; }

  .tok-breakdown { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .manual-box.dimmed { opacity: .62; }

  .model-row {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 5px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
  }
  .model-row:last-child { border-bottom: none; }
  .model-left { min-width: 0; flex: 1; }
  .model-name { font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .tier {
    font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 4px;
    background: var(--card-hi); border: 1px solid var(--line); color: var(--fg);
  }
  .tier.IMG { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }

  /* context 100-dot grid & breakdown */
  .grid { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3.5px; max-width: 320px; margin: 6px 0 4px; }
  .dot { aspect-ratio: 1; border-radius: 50%; background: var(--empty); }
  .sec-sep { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }
  .h2 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 0 0 6px; display: flex; justify-content: space-between; }
  .h2 .hint { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .group + .group { margin-top: 7px; }
  .crow { display: grid; grid-template-columns: 10px 1fr auto 42px; align-items: center; gap: 7px; padding: 2px 0; font-size: 12px; }
  .crow .tok { text-align: right; }
  .crow .p { text-align: right; color: var(--dim); font-size: 11.5px; }
  .mark { width: 8px; height: 8px; border-radius: 50%; }
  .mark.sq { border-radius: 2px; }
  .mark.free { background: transparent; border: 1.5px solid var(--empty); }

  .files li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 3px 0; font-size: 12px; }
  .files .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files .dir { display: block; font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .files .tok { color: var(--dim); font-size: 11.5px; align-self: start; }

  .sum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-top: 6px; font-size: 11.5px; }
  .sum-item { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .sum-left { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .sum-left span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* prompt cache hit monitor */
  .cache-strip {
    margin-top: 7px; padding: 6px 8px; border-radius: 7px; cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--line) 85%, transparent);
    background: color-mix(in srgb, var(--bg) 42%, transparent);
  }
  .cache-strip:hover { border-color: var(--dim); background: var(--card-hi); }
  .cache-strip .meta-row { font-size: 11px; }
  .cache-bar { height: 4px; border-radius: 999px; background: var(--track); overflow: hidden; margin: 5px 0 4px; }
  .cache-bar-fill { height: 100%; border-radius: 999px; transition: width .25s ease; }
  .cache-spark {
    display: flex; align-items: flex-end; gap: 3px; height: 34px;
    padding: 4px 4px 3px; margin-top: 7px; border-radius: 7px;
    border: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
    background: color-mix(in srgb, var(--bg) 45%, transparent);
  }
  .cache-col {
    flex: 1; min-width: 4px; height: 100%; display: flex; align-items: flex-end;
    position: relative;
  }
  .cache-col.after-compact {
    margin-left: 2px; padding-left: 3px;
    border-left: 1px dashed color-mix(in srgb, var(--pool-a) 65%, transparent);
  }
  .cache-seg {
    width: 100%; border-radius: 2px 2px 1px 1px; min-height: 3px;
    transition: height .2s ease;
  }
  .cache-seg.high { background: var(--ok); }
  .cache-seg.mid { background: var(--warn); }
  .cache-seg.low { background: color-mix(in srgb, var(--warn) 78%, transparent); }
  .cache-seg.miss { background: var(--bad); }
  .cache-seg.cold { background: var(--pool-a); opacity: .82; }
  .cache-legend {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    flex-wrap: wrap; margin-top: 5px; font-size: 10.5px; color: var(--dim);
  }
  .cache-legend-items { display: inline-flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .cache-dot { display: inline-block; width: 6px; height: 6px; border-radius: 2px; margin-right: 3px; vertical-align: middle; }
  .up-warn { color: var(--warn); }

  .link-btn {
    background: none; border: none; padding: 0; color: var(--pool-a); font-size: 11.5px; cursor: pointer;
  }
  .link-btn:hover { text-decoration: underline; color: var(--pool-a); }

  .empty { margin: 28px 8px; text-align: center; color: var(--dim); font-size: 12px; }
  footer { margin-top: 4px; font-size: 11px; color: var(--dim); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <div class="hbar">
    <span id="live-dot" class="live" title="实时状态"></span>
    <span id="hdr-model" class="hmodel">加载中…</span>
    <span id="hdr-pool" class="pill click" style="display:none" title="查看模型配额池"></span>
    <button id="btn-refresh" title="强制刷新全部数据">刷新</button>
  </div>
  <div id="hdr-quota" class="hquota" style="display:none" title="当前模型所属池的双窗口额度（点击查看详情）"></div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="overview">总览</button>
    <button class="tab" data-tab="image">生图 <span id="tab-img-dot" class="tdot" style="display:none"></span></button>
    <button class="tab" data-tab="pools">池子</button>
    <button class="tab" data-tab="context">上下文</button>
  </nav>
</header>
<main id="view"><p class="empty">正在读取配额与上下文数据…</p></main>

<script>
(() => {
  const POLL_MS = 3000;
  const SEG_COLORS = ['var(--c-system)', 'var(--c-user)', 'var(--c-agent)', 'var(--c-tool)', 'var(--c-custom)'];
  const CAT_COLOR = {
    user: 'var(--c-user)', agent: 'var(--c-agent)', tool: 'var(--c-tool)',
    system_prompt: 'var(--c-system)', system_tools: 'var(--c-system)',
    system_overhead: 'var(--c-system)', system_messages: 'var(--c-sysmsg)',
    rules: 'var(--c-custom)', skills: 'var(--c-custom)', subagents: 'var(--c-custom)',
    legacy_workflows: 'var(--c-custom)', workflows: 'var(--c-custom)',
    plugins: 'var(--c-custom)', mcp_tools: 'var(--c-custom)',
  };
  const CAT_LABEL = {
    user: '用户消息', agent: '模型回复', tool: '工具调用',
    system_prompt: '系统提示词', system_tools: '系统工具定义',
    system_overhead: '系统开销', system_messages: '系统消息',
    rules: '规则 (Rules)', skills: '技能 (Skills)', subagents: '子代理',
    legacy_workflows: '旧工作流', workflows: '工作流',
    plugins: '插件', mcp_tools: 'MCP 工具',
  };
  const CTX_GROUPS = [
    { keys: ['user', 'agent', 'tool'], sq: false },
    { keys: ['system_prompt', 'system_tools', 'system_overhead', 'system_messages'], sq: true },
    { keys: ['rules', 'skills', 'subagents', 'legacy_workflows', 'workflows', 'plugins', 'mcp_tools'], sq: true },
  ];

  const state = {
    tab: 'overview',
    dash: null,
    workspace: '',
    clockOffsetSec: 0,
    lastKey: '',
    lastHdrQuotaKey: '',
    inFlight: false,
    toast: null,
  };

  const $ = (id) => document.getElementById(id);
  const nowSec = () => Math.floor(Date.now() / 1000) + state.clockOffsetSec;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));

  function fmtTok(n) {
    const v = Number(n) || 0;
    if (v >= 1e6) return `${(v / 1e6).toFixed(1)}M`;
    if (v >= 1e3) return `${(v / 1e3).toFixed(1)}k`;
    return String(Math.round(v));
  }

  function fmtClock(ts) {
    if (!ts || ts <= 0) return '--:--:--';
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString('zh-CN', { hour12: false });
  }

  function fmtHM(ts) {
    if (!ts || ts <= 0) return '--:--';
    const d = new Date(ts * 1000);
    const pad = (x) => String(x).padStart(2, '0');
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function fmtUsd(v) {
    const n = Number(v) || 0;
    if (n <= 0) return '$0.00';
    if (n < 0.1) return `$${n.toFixed(4)}`;
    return `$${n.toFixed(2)}`;
  }

  function fmtDateTime(ts) {
    if (!ts || ts <= 0) return '--';
    const d = new Date(ts * 1000);
    const pad = (x) => String(x).padStart(2, '0');
    return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function fmtDuration(sec, zeroText = '已重置') {
    const s = Math.floor(Number(sec) || 0);
    if (s <= 0) return zeroText;
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    const r = s % 60;
    if (d > 0) return `${d}天${h}时`;
    if (h > 0) return `${h}时${String(m).padStart(2, '0')}分${String(r).padStart(2, '0')}秒`;
    if (m > 0) return `${m}分${String(r).padStart(2, '0')}秒`;
    return `${r}秒`;
  }

  function cdSpan(ts, zeroText = '已重置') {
    if (!ts || ts <= 0) return `<span class="num">${esc(zeroText)}</span>`;
    return `<span class="num" data-cd-ts="${Math.round(ts)}" data-cd-zero="${esc(zeroText)}">${esc(fmtDuration(ts - nowSec(), zeroText))}</span>`;
  }

  function fmtElapsed(sec) {
    const s = Math.max(0, Math.floor(Number(sec) || 0));
    if (s < 60) return `${s}秒前`;
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    const r = s % 60;
    if (d > 0) return `${d}天${h}时前`;
    if (h > 0) return `${h}时${String(m).padStart(2, '0')}分前`;
    return `${m}分${String(r).padStart(2, '0')}秒前`;
  }

  function elapsedTextWithHint(elapsedSec, hintCool) {
    const base = fmtElapsed(elapsedSec);
    if (!hintCool) return base;
    if (elapsedSec >= 360) return `${base} · 可能已冷却`;
    if (elapsedSec >= 270) return `${base} · 临近冷却`;
    return base;
  }

  function elapsedSpan(ts, hintCool = true) {
    if (!ts || ts <= 0) return '';
    const el = Math.max(0, nowSec() - ts);
    const warnCls = hintCool && el >= 270 ? ' up-warn' : '';
    return `<span class="num${warnCls}" data-up-ts="${Math.round(ts)}" data-up-cool="${hintCool ? '1' : '0'}">${esc(elapsedTextWithHint(el, hintCool))}</span>`;
  }

  function tickCountdowns() {
    const cur = nowSec();
    document.querySelectorAll('[data-cd-ts]').forEach((el) => {
      const ts = Number(el.dataset.cdTs || 0);
      const zero = el.dataset.cdZero || '已重置';
      if (ts > 0) el.textContent = fmtDuration(ts - cur, zero);
    });
    document.querySelectorAll('[data-up-ts]').forEach((el) => {
      const ts = Number(el.dataset.upTs || 0);
      const hintCool = el.dataset.upCool === '1';
      if (ts > 0) {
        const diff = Math.max(0, cur - ts);
        el.textContent = elapsedTextWithHint(diff, hintCool);
        el.classList.toggle('up-warn', hintCool && diff >= 270);
      }
    });
  }

  function cacheStatusMeta(cache) {
    if (!cache || !cache.has_data || !cache.latest) {
      return { pill: '', text: '暂无数据', color: 'var(--dim)' };
    }
    if (cache.compacted_pending) {
      return { pill: 'pool-a', text: '压缩待首轮', color: 'var(--pool-a)' };
    }
    const lat = cache.latest;
    if (lat.status === 'high') return { pill: 'ok', text: '高命中', color: 'var(--ok)' };
    if (lat.status === 'mid') return { pill: 'warn', text: '中命中', color: 'var(--warn)' };
    if (lat.status === 'low') return { pill: 'warn', text: '新增较多', color: 'var(--warn)' };
    if (lat.status === 'miss') return { pill: 'bad', text: '失效重建', color: 'var(--bad)' };
    if (lat.status === 'cold') {
      return { pill: 'pool-a', text: lat.after_compact ? '压缩首轮' : '冷启动', color: 'var(--pool-a)' };
    }
    return { pill: '', text: '正常', color: 'var(--dim)' };
  }

  function cacheTurnStatusLabel(t) {
    if (!t) return '';
    if (t.status === 'high') return '高命中';
    if (t.status === 'mid') return '中命中';
    if (t.status === 'low') return '新增较多（旧前缀保留）';
    if (t.status === 'miss') return '缓存失效重建';
    if (t.status === 'cold') return t.after_compact ? '压缩后首轮（冷启）' : '会话首轮（冷启）';
    return t.status || '';
  }

  function renderCacheOverviewStrip(cache) {
    if (!cache || !cache.has_data || !cache.latest) return '';
    const lat = cache.latest;
    const seg = cache.segment || {};
    const ses = cache.session || {};
    const cm = cacheStatusMeta(cache);
    const barPct = Math.max(0, Math.min(100, Number(lat.hit_rate_pct || 0)));
    const barColor = lat.status === 'miss' ? 'var(--bad)' : (lat.status === 'cold' ? 'var(--pool-a)' : cm.color);
    const scopeTxt = cache.has_compaction && seg.turns > 0
      ? `本段 ${Number(seg.hit_rate_pct || 0).toFixed(1)}% · 整场 ${Number(ses.hit_rate_pct || 0).toFixed(1)}%`
      : `累计 ${Number(ses.hit_rate_pct || 0).toFixed(1)}% (${ses.turns || 0}轮${ses.misses > 0 ? ` · ${ses.misses}失效` : ''})`;
    const elHtml = lat.ts > 0 ? elapsedSpan(lat.ts, !cache.compacted_pending) : '';
    return `<div class="cache-strip" data-jump="context" title="点击查看 Prompt 缓存逐轮命中轨迹">
      <div class="meta-row" style="margin-top:0">
        <span style="color:var(--fg);font-weight:600;display:inline-flex;align-items:center;gap:5px">
          <span>Prompt 缓存</span>
          <span class="pill ${cm.pill} num" style="font-size:10px;padding:1px 5px">${esc(cm.text)} ${Number(lat.hit_rate_pct || 0).toFixed(1)}%</span>
        </span>
        <span class="num">读 <strong style="color:var(--fg)">${fmtTok(lat.cache_read_tokens)}</strong> · 新 ${fmtTok(lat.uncached_input_tokens)}</span>
      </div>
      <div class="cache-bar"><div class="cache-bar-fill" style="width:${barPct}%;background:${barColor}"></div></div>
      <div class="meta-row">
        <span class="num">${esc(scopeTxt)}</span>
        <span>${elHtml}</span>
      </div>
    </div>`;
  }

  function renderCacheCard(cache) {
    if (!cache || !cache.has_data || !cache.latest) return '';
    const lat = cache.latest;
    const seg = cache.segment || {};
    const ses = cache.session || {};
    const recent = cache.recent || [];
    const cm = cacheStatusMeta(cache);
    const showSeg = Boolean(cache.has_compaction && seg.turns > 0);
    const elHtml = lat.ts > 0 ? elapsedSpan(lat.ts, !cache.compacted_pending) : '';
    const prefTxt = lat.prefix_retention_pct !== null && lat.prefix_retention_pct !== undefined
      ? ` · 前缀复用 ${Number(lat.prefix_retention_pct).toFixed(1)}%`
      : '';
    const totalTurns = Number(ses.turns || recent.length);
    const startTurnNo = Math.max(1, totalTurns - recent.length + 1);

    const barsHtml = recent.map((t, i) => {
      const turnNo = startTurnNo + i;
      const pctVal = Number(t.hit_rate_pct || 0);
      const minH = (t.status === 'miss' || t.status === 'cold') ? 22 : 12;
      const h = Math.max(minH, Math.min(100, Math.round(pctVal)));
      const pfx = t.prefix_retention_pct !== null && t.prefix_retention_pct !== undefined
        ? ` · 上轮前缀复用 ${Number(t.prefix_retention_pct).toFixed(1)}%`
        : '';
      const timeTxt = t.ts > 0 ? ` · ${fmtClock(t.ts)}` : '';
      const tip = `第 ${turnNo} 轮 · ${cacheTurnStatusLabel(t)} · 命中 ${pctVal.toFixed(1)}%（读 ${fmtTok(t.cache_read_tokens)} / 新 ${fmtTok(t.uncached_input_tokens)}）${pfx}${timeTxt}`;
      const cls = `cache-col${t.after_compact && i > 0 ? ' after-compact' : ''}`;
      return `<div class="${cls}" title="${esc(tip)}"><div class="cache-seg ${esc(t.status || 'high')}" style="height:${h}%"></div></div>`;
    }).join('');

    const rightBoxTitle = showSeg ? `本段压缩后 (${seg.turns}轮)` : `整场累计 (${ses.turns}轮)`;
    const rightBoxPct = showSeg ? Number(seg.hit_rate_pct || 0) : Number(ses.hit_rate_pct || 0);
    const rightBoxRead = showSeg ? seg.cache_read_tokens : ses.cache_read_tokens;
    const rightBoxMiss = showSeg ? (seg.misses || 0) : (ses.misses || 0);

    return `<section class="card">
      <div class="ch">
        <span class="ctitle">Prompt 缓存命中 <span class="pill ${cm.pill}">${esc(cm.text)}</span></span>
        <span class="sub">${elHtml || `${ses.turns} 轮记录`}</span>
      </div>
      <div class="roll-head" style="margin-bottom:6px">
        <div class="roll-kpi">
          <div class="roll-kpi-lbl">最新一轮命中率</div>
          <div class="roll-kpi-val num" style="color:${cm.color}">${Number(lat.hit_rate_pct || 0).toFixed(1)}%</div>
          <div class="roll-kpi-sub num">读 ${fmtTok(lat.cache_read_tokens)} / 新 ${fmtTok(lat.uncached_input_tokens)}${esc(prefTxt)}</div>
        </div>
        <div class="roll-kpi">
          <div class="roll-kpi-lbl">${esc(rightBoxTitle)}</div>
          <div class="roll-kpi-val num">${rightBoxPct.toFixed(1)}%</div>
          <div class="roll-kpi-sub num">读 ${fmtTok(rightBoxRead)} · ${rightBoxMiss > 0 ? `<span style="color:var(--bad)">${rightBoxMiss}次失效</span>` : '0次失效'}</div>
        </div>
      </div>
      ${showSeg ? `<div class="chips" style="margin-top:0;margin-bottom:4px">
        <span class="chip num">整场累计 <strong>${Number(ses.hit_rate_pct || 0).toFixed(1)}%</strong> (${ses.turns}轮)</span>
        <span class="chip num">累计缓存读 <strong>${fmtTok(ses.cache_read_tokens)}</strong></span>
        <span class="chip num">失效重建 <strong>${ses.misses || 0}次</strong></span>
      </div>` : ''}
      ${cache.compacted_pending ? `<div class="callout info" style="margin-top:6px">已执行 <span class="mono">/compact</span>，下条消息将基于压缩摘要重新冷启写入缓存。</div>` : ''}
      ${!cache.compacted_pending && lat.status === 'miss' ? `<div class="callout bad" style="margin-top:6px">上一轮发生缓存失效重建（新增写入 ${fmtTok(lat.uncached_input_tokens)} tok${lat.prefix_retention_pct !== null && lat.prefix_retention_pct !== undefined ? `，前缀仅保留 ${Number(lat.prefix_retention_pct).toFixed(1)}%` : ''}），继续对话下一轮起将恢复高命中。</div>` : ''}
      ${recent.length ? `
        <div class="cache-spark">${barsHtml}</div>
        <div class="cache-legend">
          <span class="cache-legend-items">
            <span><i class="cache-dot" style="background:var(--ok)"></i>≥80%</span>
            <span><i class="cache-dot" style="background:var(--warn)"></i>中/新增多</span>
            <span><i class="cache-dot" style="background:var(--bad)"></i>失效</span>
            <span><i class="cache-dot" style="background:var(--pool-a)"></i>冷启</span>
          </span>
          <span class="num">近 ${recent.length} 轮轨迹（悬停看明细）</span>
        </div>` : ''}
      <div class="sub" style="margin-top:6px;line-height:1.4">取自对话库原生 <span class="mono">model_usage</span>（缓存读 / 新增输入）；独立生图调用不走对话前缀缓存。</div>
    </section>`;
  }

  function healthCls(h) {
    if (h === 'locked' || h === 'critical') return 'bad';
    if (h === 'warning') return 'warn';
    return 'ok';
  }

  function barFillColor(h, accent) {
    if (h === 'locked' || h === 'critical') return 'var(--bad)';
    if (h === 'warning') return 'var(--warn)';
    return accent ? `var(--${accent})` : 'var(--ok)';
  }

  function imgStatusMeta(w5, anchor) {
    if (!w5) return { pill: '', text: '未知', big: '', mode: '' };
    if (w5.cooldown_active || w5.health === 'locked') {
      return { pill: 'bad', text: '429 冷却中', big: 'bad', mode: '官方 429 锁定窗口' };
    }
    if (anchor?.exceeded_safe_peak || w5.exceeded_safe_peak) {
      return { pill: 'warn', text: '刷新安全峰', big: 'warn', mode: '连续 5h 时间滚轴' };
    }
    if (w5.health === 'critical') {
      return { pill: 'bad', text: '已达上限', big: 'bad', mode: '连续 5h 时间滚轴' };
    }
    if (anchor?.eof_warning || w5.eof_warning) {
      return { pill: 'warn', text: 'EOF 偏高', big: 'warn', mode: '连续 5h 时间滚轴' };
    }
    if (w5.health === 'warning') {
      const txt = anchor?.is_hard_ceiling === false ? '接近安全峰' : '接近预警线';
      return { pill: 'warn', text: txt, big: 'warn', mode: '连续 5h 时间滚轴' };
    }
    if (w5.mode === 'idle_full') {
      return { pill: 'ok', text: '空窗满血', big: 'ok', mode: '5h 滚轴已清空' };
    }
    return { pill: 'ok', text: '滚轴活跃', big: 'ok', mode: '连续 5h 时间滚轴' };
  }

  function eventTagInfo(kind) {
    if (kind === '429') return { cls: 'E429', text: '429', tip: '5h 配额耗尽 (QUOTA_EXHAUSTED)' };
    if (kind === '429_RPM') return { cls: 'E429_RPM', text: 'RPM', tip: '突发每分钟速率限流 (已与 5h 池剥离)' };
    if (kind === 'CLIENT_ERR') return { cls: 'CLIENT_ERR', text: '参数错', tip: '本地参数校验失败 (未发往服务端、不扣配额)' };
    if (kind === 'RUNNING') return { cls: 'RUNNING', text: '生成中', tip: '进行中' };
    return { cls: kind || 'ERR', text: kind || 'ERR', tip: kind || '' };
  }

  function gridCells(segs, limit) {
    const N = 100;
    const c = (segs || []).map((t) => (t && limit ? Math.max(1, Math.floor((t / limit) * N)) : 0));
    const sum = c.reduce((a, b) => a + b, 0);
    if (sum > N) {
      const f = N / sum;
      for (let i = 0; i < c.length; i++) c[i] = Math.floor(c[i] * f);
    }
    const out = [];
    c.forEach((n, i) => { for (let k = 0; k < n; k++) out.push(SEG_COLORS[i]); });
    while (out.length < N) out.push(null);
    return out;
  }

  function splitPath(p) {
    const i = Math.max(p.lastIndexOf('/'), p.lastIndexOf('\\'));
    return i < 0 ? [p, ''] : [p.slice(i + 1), p.slice(0, i + 1)];
  }

  function poolWindowsList(p) {
    if (Array.isArray(p?.windows) && p.windows.length) return p.windows;
    const out = [];
    if (p?.fiveHour) out.push(p.fiveHour);
    if (p?.weekly) out.push(p.weekly);
    if (!out.length && p && p.remainingPct !== null && p.remainingPct !== undefined) {
      out.push({
        window: 'quota',
        label: '当前额度',
        shortLabel: '余',
        remainingPct: p.remainingPct,
        usedPct: p.usedPct,
        resetTs: p.resetTs || 0,
        isFull: p.remainingPct >= 99.99,
        health: p.health || 'ok',
      });
    }
    return out;
  }

  function winResetHtml(w, compact = false) {
    if (!w) return '';
    if (w.isFull) {
      const tip = w.resetTs ? ` title="满额未消耗（参考时间 ${esc(fmtDateTime(w.resetTs))}）"` : '';
      return `<span class="dim"${tip}>${compact ? '满额' : '满额（尚无消耗）'}</span>`;
    }
    if (w.resetTs > 0) {
      if (compact) return cdSpan(w.resetTs);
      return `重置 ${fmtDateTime(w.resetTs)} (${cdSpan(w.resetTs)})`;
    }
    return `<span class="dim">${compact ? '未计窗' : '尚无重置计时'}</span>`;
  }

  function updateHeader(d) {
    const dot = $('live-dot');
    const mdl = $('hdr-model');
    const pill = $('hdr-pool');
    const hq = $('hdr-quota');
    const tabDot = $('tab-img-dot');

    if (!d) return;
    dot.className = 'live on';

    const ctx = d.context;
    if (ctx && !ctx.error && ctx.model) {
      mdl.textContent = ctx.model;
      mdl.title = ctx.model_id ? `${ctx.model} (${ctx.model_id})` : ctx.model;
    } else if (ctx && ctx.error === 'no-conversation') {
      mdl.textContent = '未关联具体对话';
      mdl.title = '';
    } else {
      mdl.textContent = '配额与上下文';
      mdl.title = '';
    }

    const ap = d.pools && d.pools.activePool;
    if (ap) {
      const wins = poolWindowsList(ap);
      const pctStr = ap.remainingPct !== null ? `${ap.remainingPct.toFixed(1)}%` : '--';
      pill.textContent = wins.length ? ap.shortLabel : `${ap.shortLabel} · ${pctStr}`;
      pill.className = `pill click ${ap.accent || ''}`;
      pill.style.display = '';

      const hqKey = JSON.stringify([
        ap.key, ap.accent,
        wins.map((w) => [w.window, w.remainingPct, w.resetTs, w.isFull, w.health]),
      ]);
      if (wins.length) {
        hq.style.display = '';
        hq.className = `hquota ${ap.accent || ''}`;
        if (hqKey !== state.lastHdrQuotaKey) {
          state.lastHdrQuotaKey = hqKey;
          hq.innerHTML = wins.map((w, idx) => {
            const valCls = w.health === 'critical' ? 'bad' : w.health === 'warning' ? 'warn' : '';
            const pctTxt = w.remainingPct !== null ? `${w.remainingPct.toFixed(1)}%` : '--';
            const cdHtml = w.isFull
              ? '<span class="hq-cd">满额</span>'
              : (w.resetTs > 0 ? `<span class="hq-cd">· ${cdSpan(w.resetTs)}</span>` : '');
            return `${idx > 0 ? '<span class="hq-sep"></span>' : ''}<span class="hq-item" title="${esc(w.label)}：余 ${pctTxt}${w.resetTs && !w.isFull ? ` · 重置 ${fmtDateTime(w.resetTs)}` : ''}">
              <span class="hq-lbl">${esc(w.shortLabel)}</span>
              <span class="hq-val num ${valCls}">${pctTxt}</span>
              ${cdHtml}
            </span>`;
          }).join('');
          tickCountdowns();
        }
      } else {
        hq.style.display = 'none';
        state.lastHdrQuotaKey = '';
      }
    } else {
      pill.style.display = 'none';
      hq.style.display = 'none';
      state.lastHdrQuotaKey = '';
    }

    const w5 = d.imageQuota && !d.imageQuota.error ? d.imageQuota.window_5h : null;
    if (w5) {
      tabDot.style.display = '';
      const cls = healthCls(w5.health);
      tabDot.style.background = cls === 'bad' ? 'var(--bad)' : cls === 'warn' ? 'var(--warn)' : 'var(--ok)';
    } else {
      tabDot.style.display = 'none';
    }
  }

  function renderOverview(d) {
    const parts = [];
    const iq = d.imageQuota;
    const w5 = iq && !iq.error ? iq.window_5h : null;

    // 1. Image Quota Summary Card
    if (!w5) {
      parts.push(`<section class="card">
        <div class="ch"><span class="ctitle">生图配额 (5h 滚轴)</span><span class="pill bad">读取失败</span></div>
        <div class="sub">${esc(iq?.message || '无法读取本地生图记录')}</div>
      </section>`);
    } else {
      const anc = iq.anchor || {};
      const avg = iq.per_image_avg || {};
      const wrAvg = avg.with_refs || {};
      const rs = iq.rolling_schedule || {};
      const meta = imgStatusMeta(w5, anc);
      const refCalls = anc.ref_calls || w5.hard_cap || 60;
      const refTokens = anc.ref_tokens || 0;
      const softCalls = anc.soft_calls || w5.soft_cap || 54;
      const tickPct = refCalls > 0 ? Math.min(100, (softCalls / refCalls) * 100) : 85;
      const ledgers = iq.workspace_ledgers || [];
      const tokActive = Number(w5.tokens_total || 0);
      const wrTok = Number(anc.avg_with_refs_tokens || wrAvg.avg_tokens_total || avg.avg_tokens_total || 3880);
      const wrRem = Number(anc.est_remaining_imgs_with_refs ?? 0);
      const wrRemExact = Number(anc.est_remaining_imgs_with_refs_exact ?? wrRem);
      const byRefRem = anc.est_remaining_imgs_by_refs || {};
      const callsPct = Number(anc.calls_pct ?? w5.calls_pct ?? 0);
      const tokensPct = Number(anc.tokens_pct ?? w5.tokens_pct ?? 0);
      const pctBasis = anc.used_pct_basis || w5.used_pct_basis || 'calls';
      const remCalls = Number(anc.remaining_calls ?? w5.remaining_est ?? 0);
      const m30 = rs.recover_next_30m || { calls: 0, tokens_total: 0, est_imgs_with_refs: 0 };

      let mainVal = '';
      if (w5.cooldown_active) {
        mainVal = `<div class="bigrow">
          <div class="big bad num">冷却 ${cdSpan(w5.next_recover_ts || w5.window_end, '已解封')}</div>
          <span class="sub num">解封 ${fmtClock(w5.next_recover_ts || w5.window_end)}</span>
        </div>`;
      } else {
        let rightHint = `带垫图预估余 ~${wrRem} 张`;
        if (anc.is_hard_ceiling === false && anc.exceeded_safe_peak && wrRem === 0) {
          rightHint = remCalls > 0 ? `已破安全峰 · 仍余 ${remCalls}次` : '已破安全峰 · 未触429';
        } else if (pctBasis === 'calls' && (callsPct - tokensPct) >= 8 && remCalls < wrRem) {
          rightHint = `次余 ${remCalls} · Tok余 ~${wrRem}张`;
        }
        const rightTip = `${anc.label || ''}：预估上限 ${refCalls} 次 (${callsPct.toFixed(1)}%) / ${fmtTok(refTokens)} tok (${tokensPct.toFixed(1)}%)；剩余 ${fmtTok(anc.remaining_tokens || 0)} tok（按带垫图均 ${fmtTok(wrTok)} 约 ${wrRemExact} 张，次数余 ${remCalls} 次）`;
        mainVal = `<div class="bigrow">
          <div class="big ${meta.big} num">${w5.metric_used} <span class="dim" style="font-size:12.5px;font-weight:500">次 · ${fmtTok(tokActive)} tok</span></div>
          <span class="sub num" style="color:var(--fg);font-weight:600" title="${esc(rightTip)}">${esc(rightHint)}</span>
        </div>`;
      }

      const fbWrTxt = rs.first_batch?.est_imgs_with_refs > 0 ? ` / ~${rs.first_batch.est_imgs_with_refs}张` : '';
      const nextRecoverHtml = w5.cooldown_active
        ? `预计解封 ${fmtHM(w5.next_recover_ts || w5.window_end)}`
        : (w5.next_recover_ts > 0
          ? `下批回血 ${cdSpan(w5.next_recover_ts, '即将释放')}${rs.first_batch?.calls ? ` (+${rs.first_batch.calls}次${fbWrTxt})` : ''}`
          : '当前 5h 滚轴已清空');
      const fullClearHtml = w5.full_clear_ts > 0
        ? `<span title="预估上限 ${refCalls}次 / ${fmtTok(refTokens)} tok；最后一条在窗调用将于 ${esc(fmtDateTime(w5.full_clear_ts))} 滚出">上限 ${refCalls}次/${fmtTok(refTokens)} · ${fmtHM(w5.full_clear_ts)}清空</span>`
        : esc(anc.label || meta.mode);
      const pctChipHtml = !w5.cooldown_active && w5.metric_used > 0
        ? `<span class="chip num" title="进度条取次数(${callsPct.toFixed(1)}%)与Token(${tokensPct.toFixed(1)}%)中的较高值：${w5.used_pct}%">占比 ${pctBasis === 'tokens' ? `<strong>Tok${Math.round(tokensPct)}%</strong>/次${Math.round(callsPct)}%` : `<strong>次${Math.round(callsPct)}%</strong>/Tok${Math.round(tokensPct)}%`}</span>`
        : '';

      parts.push(`<section class="card">
        <div class="ch">
          <span class="ctitle">生图配额 · 5h 滚轴 <span class="pill ${meta.pill}">${meta.text}</span></span>
          <button class="link-btn" data-jump="image">详情 →</button>
        </div>
        ${mainVal}
        <div class="bar-wrap" title="${esc(anc.label || '')}：进度条 ${w5.used_pct}%（${pctBasis === 'tokens' ? 'Token主导' : pctBasis === 'locked' ? '冷却锁定' : '次数主导'}）· 次数 ${w5.metric_used}/${refCalls} (${callsPct.toFixed(1)}%) · Token ${fmtTok(tokActive)}/${fmtTok(refTokens)} (${tokensPct.toFixed(1)}%)">
          <div class="bar-fill" style="width:${Math.min(100, w5.used_pct || 0)}%;background:${barFillColor(w5.health)}"></div>
          ${anc.is_hard_ceiling !== false ? `<div class="bar-tick" style="left:${tickPct.toFixed(1)}%" title="预警线 ${softCalls} 次"></div>` : ''}
        </div>
        <div class="meta-row">
          <span class="num">${nextRecoverHtml}</span>
          <span class="num">${fullClearHtml}</span>
        </div>
        <div class="chips">
          ${pctChipHtml}
          <span class="chip num" title="近 30 天 ${wrAvg.sample_count || 0} 次带垫图（≥1参，均 ${wrAvg.avg_refs ?? 1} 张参考图）实测均值">带垫图均 <strong>~${fmtTok(wrTok)}</strong></span>
          ${!w5.cooldown_active && byRefRem['2'] !== undefined ? `<span class="chip num" title="按 2 张参考图实测均图 Token 换算">2参余 <strong>~${byRefRem['2']}张</strong></span>` : ''}
          ${m30.calls > 0 ? `<span class="chip num" title="未来 30 分钟滚轴将释放 ${m30.calls} 次 / ${fmtTok(m30.tokens_total)} tok">30分回血 <strong>+${m30.est_imgs_with_refs || m30.calls}张</strong></span>` : ''}
          <span class="chip num">窗内 <strong>${w5.ok}成/${w5.eof}EOF</strong>${w5.est_usd > 0 ? ` · ${fmtUsd(w5.est_usd)}` : ''}</span>
          ${ledgers.length ? `<span class="chip">账本 <strong>${ledgers.length}集</strong></span>` : ''}
        </div>
        ${w5.eof_warning ? `<div class="callout warn" style="margin-top:6px">近 5h EOF 率 ${w5.eof_rate_pct}%（${w5.eof} 次），断连重试可能放大隐性配额消耗。</div>` : ''}
      </section>`);
    }

    // 2. Model Quota Pools Summary Card
    const poolsObj = d.pools || {};
    const pools = poolsObj.pools || [];
    let poolsBody = '';
    if (poolsObj.routingAdvice) {
      const advCls = poolsObj.routingAdvice.level === 'critical' ? 'bad' : 'warn';
      poolsBody += `<div class="callout ${advCls}" style="margin-bottom:7px">${esc(poolsObj.routingAdvice.text)}</div>`;
    }
    if (!pools.length) {
      poolsBody += `<div class="sub">${esc(poolsObj.error || '暂未获取到模型池数据，请点击右上角刷新。')}</div>`;
    } else {
      poolsBody += pools.map((p) => {
        const isActive = p.key === poolsObj.activePoolKey;
        const activeCls = isActive ? `active-${p.accent}` : '';
        const wins = poolWindowsList(p);
        const winsHtml = wins.map((w) => {
          const wpct = w.remainingPct !== null ? w.remainingPct : 0;
          const pctCls = w.health === 'critical' ? 'bad' : w.health === 'warning' ? 'warn' : '';
          const resetTip = w.isFull
            ? '满额（尚无消耗）'
            : (w.resetTs ? `重置时间 ${fmtDateTime(w.resetTs)}` : '尚无重置计时');
          return `<div class="win-mini" title="${esc(w.label)}：余 ${w.remainingPct !== null ? `${w.remainingPct.toFixed(1)}%` : '--'} · ${esc(resetTip)}">
            <div class="meta-row">
              <span style="color:var(--fg);font-weight:500">${esc(w.label)}</span>
              <span class="num">
                <strong class="win-pct ${pctCls}">${w.remainingPct !== null ? `${w.remainingPct.toFixed(1)}%` : '--'}</strong>
                <span class="dim" style="margin-left:5px">· ${winResetHtml(w, true)}</span>
              </span>
            </div>
            <div class="bar-wrap sm">
              <div class="bar-fill" style="width:${Math.max(0, Math.min(100, wpct))}%;background:${barFillColor(w.health, p.accent)}"></div>
            </div>
          </div>`;
        }).join('');
        return `<div class="pool-mini ${activeCls}">
          <div class="meta-row" style="margin-bottom:2px">
            <span style="color:var(--fg);font-weight:600">${esc(p.label)} ${isActive ? `<span class="pill ${p.accent}" style="margin-left:3px">当前对话</span>` : ''}</span>
            <span class="dim">${p.familyCount ? `${p.familyCount} 模型族` : ''}</span>
          </div>
          <div class="win-list">${winsHtml || '<div class="sub">暂无窗口配额数据</div>'}</div>
        </div>`;
      }).join('');
    }
    parts.push(`<section class="card">
      <div class="ch">
        <span class="ctitle">当前模型配额池 ${poolsObj.stale ? '<span class="pill warn">缓存</span>' : ''}</span>
        <button class="link-btn" data-jump="pools">详情 →</button>
      </div>
      ${poolsBody}
    </section>`);

    // 3. Current Context Summary Card
    const ctx = d.context;
    if (!ctx || ctx.error) {
      const msg = ctx?.error === 'no-conversation'
        ? '在具体对话窗口中打开本侧边栏即可实时监控该对话上下文。'
        : ctx?.error === 'no-database'
          ? '新对话尚无落盘记录，发送首条消息后自动显示。'
          : (ctx?.message || '暂无法读取当前上下文。');
      parts.push(`<section class="card">
        <div class="ch"><span class="ctitle">当前上下文</span><button class="link-btn" data-jump="context">详情 →</button></div>
        <div class="sub">${esc(msg)}</div>
      </section>`);
    } else {
      const budget = Number(ctx.request_budget_tokens) || 0;
      const nearBudget = budget > 0 && ctx.used_tokens >= budget * 0.8;
      const cells = gridCells(ctx.grid_segments, ctx.limit_tokens);
      const topCats = [...(ctx.categories || [])]
        .filter((c) => c.tokens > 0)
        .sort((a, b) => b.tokens - a.tokens)
        .slice(0, 4);
      parts.push(`<section class="card">
        <div class="ch">
          <span class="ctitle">当前上下文 ${ctx.compacted ? '<span class="pill warn">已压缩</span>' : ''}</span>
          <button class="link-btn" data-jump="context">完整明细 →</button>
        </div>
        <div class="bigrow">
          <div class="big num" style="font-size:17px">${fmtTok(ctx.used_tokens)} <span class="dim" style="font-size:12.5px;font-weight:500">/ ${ctx.limit_tokens ? fmtTok(ctx.limit_tokens) : '?'}</span></div>
          <span class="pill ${nearBudget ? 'warn' : ''}">${ctx.limit_tokens ? `${ctx.used_pct.toFixed(1)}%` : '--'}${nearBudget ? ` · 接近单次预算 ${fmtTok(budget)}` : ''}</span>
        </div>
        <div class="grid">${cells.map((col) => `<span class="dot"${col ? ` style="background:${col}"` : ''}></span>`).join('')}</div>
        ${renderCacheOverviewStrip(ctx.cache)}
        ${topCats.length ? `<div class="sum-grid">${topCats.map((c) => `
          <div class="sum-item">
            <span class="sum-left"><span class="mark" style="background:${CAT_COLOR[c.key] || 'var(--dim)'}"></span><span>${esc(CAT_LABEL[c.key] || c.name)}</span></span>
            <span class="num dim">${fmtTok(c.tokens)}</span>
          </div>`).join('')}</div>` : ''}
      </section>`);
    }

    return parts.join('');
  }

  function renderImage(d) {
    const iq = d.imageQuota;
    if (!iq || iq.error) {
      return `<section class="card"><div class="ch"><span class="ctitle">生图配额详情</span></div>
        <div class="callout bad">${esc(iq?.message || '读取本地对话记录失败')}</div></section>`;
    }
    const w5 = iq.window_5h;
    const w24 = iq.window_24h || {};
    const w7 = iq.window_7d || {};
    const cal = iq.calibration || {};
    const rs = iq.rolling_schedule || {};
    const avg = iq.per_image_avg || {};
    const wrAvg = avg.with_refs || {};
    const anc = iq.anchor || {};
    const peak = cal.observed_safe_peak || {};
    const meta = imgStatusMeta(w5, anc);
    const refCalls = anc.ref_calls || w5.hard_cap || 60;
    const refTokens = anc.ref_tokens || 0;
    const softCalls = anc.soft_calls || w5.soft_cap || 54;
    const tickPct = refCalls > 0 ? Math.min(100, (softCalls / refCalls) * 100) : 85;
    const wrTok = Number(anc.avg_with_refs_tokens || wrAvg.avg_tokens_total || avg.avg_tokens_total || 3880);
    const wrRem = Number(anc.est_remaining_imgs_with_refs ?? 0);
    const wrRemExact = Number(anc.est_remaining_imgs_with_refs_exact ?? wrRem);
    const byRefRem = anc.est_remaining_imgs_by_refs || {};
    const callsPct = Number(anc.calls_pct ?? w5.calls_pct ?? 0);
    const tokensPct = Number(anc.tokens_pct ?? w5.tokens_pct ?? 0);
    const remCalls = Number(anc.remaining_calls ?? w5.remaining_est ?? 0);
    const tokBarPct = w5.cooldown_active ? 100 : Math.min(100, tokensPct);
    const callsBarPct = w5.cooldown_active ? 100 : Math.min(100, callsPct);
    const tokBarHealth = w5.cooldown_active
      ? 'locked'
      : (anc.is_hard_ceiling !== false && tokensPct >= 100 ? 'critical' : (tokensPct >= 88 ? 'warning' : 'ok'));
    const callsBarHealth = w5.cooldown_active
      ? 'locked'
      : (anc.is_hard_ceiling !== false && callsPct >= 100 ? 'critical' : (callsPct >= 88 ? 'warning' : 'ok'));
    const parts = [];

    // 1. 5h rolling occupancy & Token breakdown card
    const anchorRight = (anc.is_hard_ceiling === false && anc.exceeded_safe_peak && wrRem === 0)
      ? (remCalls > 0 ? `破峰中 · 次数余 ${remCalls}` : '破峰中 · 未触429')
      : `带垫图余 ~${wrRem} 张 (Tok ${tokensPct.toFixed(0)}%)`;
    const byRefChips = ['1', '2', '3+', '0']
      .filter((k) => byRefRem[k] !== undefined)
      .map((k) => `<span class="chip num">${k === '0' ? '无参' : `${k}参`} <strong>~${byRefRem[k]}张</strong></span>`)
      .join('');
    parts.push(`<section class="card">
      <div class="ch">
        <span class="ctitle">5h 连续滚轴占用 <span class="pill ${meta.pill}">${meta.text}</span></span>
        <span class="sub mono">${esc(iq.model || 'gemini-3.1-flash-image')}</span>
      </div>
      ${w5.cooldown_active
        ? `<div class="bigrow"><div class="big bad num">剩余冷却 ${cdSpan(w5.next_recover_ts || w5.window_end, '已解封')}</div><span class="sub num">解封 ${fmtDateTime(w5.next_recover_ts || w5.window_end)}</span></div>`
        : `<div class="bigrow"><div class="big ${meta.big} num">${w5.metric_used} 次 · ${fmtTok(w5.tokens_total)} tok</div><span class="sub num" style="color:var(--fg);font-weight:600" title="预估上限 ${refCalls} 次 (${callsPct.toFixed(1)}%) / ${fmtTok(refTokens)} tok (${tokensPct.toFixed(1)}%)；剩余 ${fmtTok(anc.remaining_tokens || 0)} tok">${esc(anchorRight)}</span></div>`}
      <div class="win-list" style="margin-top:6px">
        <div class="win-mini" title="Token 占用：${fmtTok(w5.tokens_total)} / ${fmtTok(refTokens)} tok (${tokensPct.toFixed(1)}%)">
          <div class="meta-row" style="margin-top:0">
            <span style="color:var(--fg);font-weight:500">Token 占用</span>
            <span class="num"><strong>${fmtTok(w5.tokens_total)}</strong> / ${fmtTok(refTokens)} <span class="dim">(${tokensPct.toFixed(1)}%)</span></span>
          </div>
          <div class="bar-wrap sm">
            <div class="bar-fill" style="width:${tokBarPct}%;background:${barFillColor(tokBarHealth)}"></div>
          </div>
        </div>
        <div class="win-mini" title="次数占用：${w5.metric_used} / ${refCalls} 次 (${callsPct.toFixed(1)}%)">
          <div class="meta-row" style="margin-top:0">
            <span style="color:var(--fg);font-weight:500">次数占用</span>
            <span class="num"><strong>${w5.metric_used}</strong> / ${refCalls} 次 <span class="dim">(${callsPct.toFixed(1)}%)</span></span>
          </div>
          <div class="bar-wrap sm">
            <div class="bar-fill" style="width:${callsBarPct}%;background:${barFillColor(callsBarHealth)}"></div>
            ${anc.is_hard_ceiling !== false ? `<div class="bar-tick" style="left:${tickPct.toFixed(1)}%" title="预警线 ${softCalls} 次"></div>` : ''}
          </div>
        </div>
      </div>
      <div class="meta-row">
        <span>预估上限：<strong>${refCalls}次 / ${fmtTok(refTokens)} tok</strong></span>
        <span class="num">${w5.oldest_ts > 0 ? `在窗 ${fmtHM(w5.oldest_ts)} → ${fmtHM(w5.newest_ts)}` : '当前 5h 无在窗调用'}</span>
      </div>
      ${!w5.cooldown_active ? `<div class="callout" style="margin-top:7px;background:color-mix(in srgb,var(--accent) 8%,transparent);border-color:color-mix(in srgb,var(--accent) 28%,transparent)">
        <div class="meta-row" style="margin-top:0">
          <span style="color:var(--fg);font-weight:600">按带垫图均图（${fmtTok(wrTok)} tok）预估余 <strong class="num" style="color:var(--accent);font-size:13px">~${wrRem} 张</strong> <span class="dim num">(${wrRemExact}张)</span></span>
          <span class="num dim">余 ${fmtTok(anc.remaining_tokens || 0)} tok</span>
        </div>
        ${byRefChips ? `<div class="chips" style="margin-top:5px">${byRefChips}</div>` : ''}
      </div>` : ''}
      <div class="tok-breakdown">
        <span class="chip num">Prompt <strong>${fmtTok(w5.prompt_tokens)}</strong></span>
        <span class="chip num">参考图 <strong>${fmtTok(w5.input_image_tokens)}</strong> (${w5.ref_images || 0}张)</span>
        <span class="chip num">1K出图 <strong>${fmtTok(w5.output_image_tokens)}</strong></span>
        <span class="chip num" title="不含最小内部思考的确定性 Token 为 ${fmtTok(w5.tokens_raw)}">思考估 <strong>~${fmtTok(w5.thinking_tokens)}</strong></span>
        <span class="chip num">API等效 <strong>${fmtUsd(w5.est_usd)}</strong></span>
      </div>
      ${(anc.notes || []).length ? `<div class="sub" style="margin-top:6px;line-height:1.45">${anc.notes.map((n) => esc(n)).join('；')}。</div>` : ''}
      ${w5.last_429_msg ? `<div class="callout ${w5.cooldown_active ? 'bad' : 'warn'}" style="margin-top:7px">
        <div style="font-weight:600;margin-bottom:2px">最近官方 5h 429 记录（${fmtDateTime(w5.last_429_at)}）</div>
        <div class="mono" style="font-size:11px;word-break:break-all">${esc(w5.last_429_msg)}</div>
      </div>` : ''}
    </section>`);

    // 2. Rolling recovery schedule (30-min clock-aligned buckets)
    const buckets = rs.buckets || [];
    const maxBucketCalls = Math.max(1, ...buckets.map((b) => Number(b.calls) || 0));
    const fb = rs.first_batch;
    const m30 = rs.recover_next_30m || { calls: 0, tokens_total: 0, est_imgs_with_refs: 0 };
    const m1h = rs.recover_next_1h || { calls: 0, tokens_total: 0, est_imgs_with_refs: 0 };
    const m2h = rs.recover_next_2h || { calls: 0, tokens_total: 0, est_imgs_with_refs: 0 };
    parts.push(`<section class="card">
      <div class="ch">
        <span class="ctitle">时间滚轴 · 分段回血时间表</span>
        <span class="sub num">${buckets.length ? `共 ${rs.total_calls} 次待滚出` : '无排队释放'}</span>
      </div>
      ${buckets.length ? `
        <div class="roll-head">
          <div class="roll-kpi">
            <div class="roll-kpi-lbl">${w5.cooldown_active ? '预计解封 / 下批回血' : '下批回血倒计时'}</div>
            <div class="roll-kpi-val num" style="color:${w5.cooldown_active ? 'var(--bad)' : 'var(--ok)'}">${cdSpan(w5.next_recover_ts, '即将释放')}</div>
            <div class="roll-kpi-sub num">${fmtClock(w5.next_recover_ts)}${fb ? ` · 先释 +${fb.calls}次 (${fmtTok(fb.tokens_total)}${fb.est_imgs_with_refs > 0 ? ` ≈+${fb.est_imgs_with_refs}张` : ''})` : ''}</div>
          </div>
          <div class="roll-kpi">
            <div class="roll-kpi-lbl">完全清空倒计时</div>
            <div class="roll-kpi-val num">${cdSpan(w5.full_clear_ts, '已清空')}</div>
            <div class="roll-kpi-sub num">${fmtDateTime(w5.full_clear_ts)} 全量归零</div>
          </div>
        </div>
        <div class="chips" style="margin-top:0">
          <span class="chip num" title="释放 ${m30.calls} 次 / ${fmtTok(m30.tokens_total)} tok">30分内 <strong>+${m30.calls}次</strong> (${m30.est_imgs_with_refs > 0 ? `≈+${m30.est_imgs_with_refs}张` : fmtTok(m30.tokens_total)})</span>
          <span class="chip num" title="释放 ${m1h.calls} 次 / ${fmtTok(m1h.tokens_total)} tok">1小时内 <strong>+${m1h.calls}次</strong> (${m1h.est_imgs_with_refs > 0 ? `≈+${m1h.est_imgs_with_refs}张` : fmtTok(m1h.tokens_total)})</span>
          <span class="chip num" title="释放 ${m2h.calls} 次 / ${fmtTok(m2h.tokens_total)} tok">2小时内 <strong>+${m2h.calls}次</strong> (${m2h.est_imgs_with_refs > 0 ? `≈+${m2h.est_imgs_with_refs}张` : fmtTok(m2h.tokens_total)})</span>
        </div>
        <div class="roll-list">${buckets.map((b) => {
          const pctW = Math.max(6, Math.round((b.calls / maxBucketCalls) * 100));
          const wrPart = b.est_imgs_with_refs > 0 ? `（约合 +${b.est_imgs_with_refs} 张带垫图）` : '';
          const tip = `${fmtClock(b.first_free_ts)}–${fmtClock(b.last_free_ts)}：释放 ${b.calls} 次（${b.ok}成/${b.eof}EOF/${b.err}错），约 ${fmtTok(b.tokens_total)} tok${wrPart}，累计已释放 ${b.cum_calls}/${rs.total_calls} (${b.cum_pct}%)`;
          return `<div class="roll-row num" title="${esc(tip)}">
            <span class="roll-time">${fmtHM(b.bucket_start_ts)}–${fmtHM(b.bucket_end_ts)}</span>
            <div class="roll-bar"><div class="roll-fill" style="width:${pctW}%"></div></div>
            <span class="roll-val"><strong>+${b.calls}次</strong> · ${fmtTok(b.tokens_total)} <span class="dim">(${b.cum_pct}%)</span></span>
          </div>`;
        }).join('')}</div>
      ` : `<div class="sub">当前 5 小时滚动窗口已完全清空，暂无待释出调用。每次生图都会在发起满 5 小时后自动滚出释放。</div>`}
    </section>`);

    // 3. Self-learning watermark band & per-image token profile
    const latestLock = cal.latest_lock;
    const hasCleanLock = (cal.clean_lock_count || 0) > 0;
    const lockMain = hasCleanLock
      ? `${cal.clean_avg_attempts_at_lock} 次 · ${fmtTok(cal.clean_avg_tokens_at_lock)}`
      : (latestLock ? `${latestLock.attempts} 次 (${latestLock.eof_rate_pct}% EOF)` : '暂无 5h 429');
    const lockSub = hasCleanLock
      ? `基于 ${cal.clean_lock_count} 次干净锁自动校准（均值 ${cal.clean_avg_ok_at_lock} 成功）`
      : (latestLock
        ? `仅高 EOF 噪声锁（${latestLock.ok}成/${latestLock.eof}EOF），未作硬上限`
        : '近 30 天未触发 5h 配额耗尽，仅依赖安全峰值推算');
    const byRefs = avg.by_refs || [];
    const safeSub = anc.ref_tokens_source === 'calls_x_with_refs'
      ? `实测0-429峰 ${fmtTok(anc.safe_lower_tokens || peak.max_tokens_total || 0)} · 最高成功 ${peak.max_ok || 0} 次`
      : `最高成功 ${peak.max_ok || 0} 次${peak.max_tokens_at ? ` · 峰值 ${fmtDateTime(peak.max_tokens_at)}` : ''}`;
    parts.push(`<section class="card">
      <div class="ch">
        <span class="ctitle">自学习水位带 & 均图 Token</span>
        <span class="sub num">30d 样本 ${avg.sample_count || 0} 次</span>
      </div>
      <div class="band-grid">
        <div class="band-box safe">
          <div class="band-title">${anc.ref_tokens_source === 'calls_x_with_refs' ? '预估上限 (已证次数×带垫图)' : '已证安全下界 (30d 无 429)'}</div>
          <div class="band-main num">${refCalls} 次 · ${fmtTok(refTokens)}</div>
          <div class="band-sub num">${esc(safeSub)}</div>
        </div>
        <div class="band-box lock">
          <div class="band-title">实测 5h 429 上界 (30d)</div>
          <div class="band-main num">${esc(lockMain)}</div>
          <div class="band-sub">${esc(lockSub)}${cal.rpm_burst_count ? ` · 另剥离 ${cal.rpm_burst_count} 次瞬时 RPM` : ''}</div>
        </div>
      </div>
      ${byRefs.length ? `<table class="stat-table num">
        <thead><tr><th>参考图</th><th>样本</th><th>均Prompt</th><th>均含思考Tok</th><th>API等效</th></tr></thead>
        <tbody>
          <tr style="font-weight:600">
            <td>总均值 (${avg.avg_refs}张)</td>
            <td>${avg.sample_count}</td>
            <td>${fmtTok(avg.avg_prompt_tokens)}</td>
            <td>${fmtTok(avg.avg_tokens_total)}</td>
            <td>${fmtUsd(avg.avg_est_usd)}</td>
          </tr>
          ${wrAvg.sample_count > 0 ? `<tr style="font-weight:600;background:color-mix(in srgb,var(--accent) 10%,transparent)" title="用于预估剩余可出图张数（占全部生图 ${wrAvg.share_pct}%）">
            <td style="color:var(--accent)">带垫图均 (${wrAvg.avg_refs}张)</td>
            <td>${wrAvg.sample_count}</td>
            <td>${fmtTok(wrAvg.avg_prompt_tokens)}</td>
            <td style="color:var(--accent)">${fmtTok(wrAvg.avg_tokens_total)}</td>
            <td>${fmtUsd(wrAvg.avg_est_usd)}</td>
          </tr>` : ''}
          ${byRefs.map((g) => `<tr>
            <td>${esc(g.label)} 张参考图</td>
            <td>${g.count}</td>
            <td>${fmtTok(g.avg_prompt_tokens)}</td>
            <td>${fmtTok(g.avg_tokens_total)}</td>
            <td>${fmtUsd(g.avg_est_usd)}</td>
          </tr>`).join('')}
        </tbody>
      </table>` : `<div class="sub">暂无足够生图样本，默认估算单图 ~${fmtTok(avg.avg_tokens_total || 1850)} tok（${fmtUsd(avg.avg_est_usd || 0.0682)}）。</div>`}
      <div class="sub" style="margin-top:6px;line-height:1.4">公式（Nano Banana 2 · 1K）：出图固定 1,120 tok（$0.0672，占 API 成本 ${avg.output_cost_share_pct ?? 97.6}%）+ 参考图 1,120 tok/张 + Prompt 文本 + 最小思考估 ~250 tok/次。</div>
    </section>`);

    // 4. 5h / 24h / 7d stats table
    const rows = [
      ['5h 滚轴', w5],
      ['近 24h', w24],
      ['近 7 天', w7],
    ];
    parts.push(`<section class="card">
      <div class="ch"><span class="ctitle">多周期生图统计</span><span class="sub">含参考图与 Token 估算</span></div>
      <table class="stat-table num">
        <thead><tr><th>周期</th><th>成功</th><th>EOF</th><th>429</th><th>参考图</th><th>估算Tok</th><th>尝试</th></tr></thead>
        <tbody>${rows.map(([lbl, b]) => {
          const tip = `失败 ${b.err ?? 0} · RPM限流 ${b.rpm_limited ?? 0} · 参数错 ${b.client_err ?? 0} · EOF率 ${b.eof_rate_pct ?? 0}% · 不含思考 ${fmtTok(b.tokens_raw)} · API等效 ${fmtUsd(b.est_usd)}`;
          return `<tr title="${esc(tip)}">
            <td>${lbl}</td>
            <td style="color:var(--ok)">${b.ok ?? 0}</td>
            <td style="color:${(b.eof || 0) > 0 ? 'var(--warn)' : 'var(--dim)'}">${b.eof ?? 0}</td>
            <td style="color:${(b.rate_limited || 0) > 0 ? 'var(--bad)' : 'var(--dim)'}">${b.rate_limited ?? 0}</td>
            <td>${b.ref_images ?? 0}</td>
            <td>${fmtTok(b.tokens_total)}</td>
            <td><strong>${b.attempts ?? 0}</strong></td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </section>`);

    // 5. Settings form (Auto watermark band vs Manual threshold)
    const s = d.settings || { anchorMode: 'auto', softCap: 54, hardCap: 60, tokenCap: 0, countMode: 'attempts' };
    const isManual = s.anchorMode === 'manual';
    parts.push(`<section class="card">
      <div class="ch"><span class="ctitle">锚定模式与计数口径</span><span class="sub">持久化保存</span></div>
      <form id="settings-form">
        <div class="form-grid">
          <div class="field full">
            <label for="inp-anchor">配额锚定模式</label>
            <select id="inp-anchor" name="anchorMode">
              <option value="auto"${!isManual ? ' selected' : ''}>自学习水位带（推荐，无需填总数）</option>
              <option value="manual"${isManual ? ' selected' : ''}>手动阈值模式（自定义次/Token 上限）</option>
            </select>
          </div>
          <div class="field full">
            <label for="inp-mode">计数口径</label>
            <select id="inp-mode" name="countMode">
              <option value="attempts"${s.countMode === 'attempts' ? ' selected' : ''}>含 EOF / 异常全部尝试（推荐，防断流偷扣额度）</option>
              <option value="ok_only"${s.countMode === 'ok_only' ? ' selected' : ''}>仅计成功出图次数</option>
            </select>
          </div>
          <div id="manual-fields" class="field full manual-box${isManual ? '' : ' dimmed'}">
            <div class="form-grid" style="margin-top:0">
              <div class="field">
                <label for="inp-soft">软上限预警 (次)</label>
                <input id="inp-soft" name="softCap" type="number" min="1" max="2000" value="${s.softCap}">
              </div>
              <div class="field">
                <label for="inp-hard">硬上限估计 (次)</label>
                <input id="inp-hard" name="hardCap" type="number" min="1" max="2000" value="${s.hardCap}">
              </div>
              <div class="field full">
                <label for="inp-tokcap">可选 5h Token 上限（0 = 按次数×带垫图均图折算，当前参考 ~${fmtTok(refTokens)}）</label>
                <input id="inp-tokcap" name="tokenCap" type="number" min="0" max="50000000" step="1000" value="${s.tokenCap || 0}">
              </div>
            </div>
            ${!isManual ? '<div class="sub" style="margin-top:4px">当前为自学习模式，上述手动数值仅在切至「手动阈值」或样本不足 10 次时生效。</div>' : ''}
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="primary">保存设置</button>
          <button type="button" id="btn-reset-auto">恢复自动锚定</button>
          <span id="save-toast" class="toast ${state.toast?.err ? 'err' : ''}">${esc(state.toast?.msg || '')}</span>
        </div>
      </form>
    </section>`);

    // 6. Workspace ledgers
    const ledgers = iq.workspace_ledgers || [];
    parts.push(`<section class="card">
      <div class="ch"><span class="ctitle">工作区生产账本联动</span><span class="sub mono">api_call_ledger.json</span></div>
      ${ledgers.length ? ledgers.map((l) => `
        <div class="pool-mini" style="margin-top:6px">
          <div class="meta-row">
            <span style="color:var(--fg);font-weight:600">${esc(l.episode_label)}</span>
            <span class="sub num">${l.global_cooldown_remaining_sec > 0 ? `全局冷却 ${cdSpan(l.global_cooldown_until)}` : `更新 ${fmtDateTime(l.updated_at)}`}</span>
          </div>
          <div class="sub mono" style="font-size:10.5px;margin:2px 0 4px">${esc(l.path)}</div>
          ${(l.windows || []).map((w) => `<div class="meta-row num" style="padding:2px 0">
            <span>窗 ${esc(w.window)}：<strong>${w.used_calls}</strong>/${w.hard_cap}${w.pending_calls ? ` (+${w.pending_calls}在途)` : ''}</span>
            <span>余 ${w.remaining_calls}${w.cooldown_remaining_sec > 0 ? ` · 冷却 ${cdSpan(w.cooldown_until)}` : ''}</span>
          </div>`).join('') || '<div class="sub">暂无已登记窗口</div>'}
        </div>`).join('')
      : `<div class="sub">当前工作区未发现 <span class="mono">api_call_ledger.json</span> 账本文件（可选联动）。</div>`}
    </section>`);

    // 7. Recent events
    const evs = iq.recent_events || [];
    parts.push(`<section class="card">
      <div class="ch"><span class="ctitle">最近生图事件 (最新 20 条)</span><span class="sub num">扫描 ${iq.scan_meta?.active_dbs ?? 0} 库</span></div>
      ${evs.length ? `<ul class="list">${evs.map((e) => {
        const ti = eventTagInfo(e.kind);
        const title = e.image_name || e.prompt_preview || '(未命名图像)';
        const detail = e.error_summary || e.prompt_preview || '';
        const badges = [];
        if (Number(e.n_refs) > 0) badges.push(`<span class="mini-badge num">${e.n_refs}参</span>`);
        if (Number(e.tokens_total) > 0) badges.push(`<span class="mini-badge num" title="Prompt ${e.prompt_tokens || 0} + 参考图 ${e.input_image_tokens || 0} + 1K出图 ${e.output_image_tokens || 0} + 思考估 ${e.thinking_tokens || 0}">${fmtTok(e.tokens_total)} tok</span>`);
        if (Number(e.duration_sec) > 0) badges.push(`<span class="mini-badge num">${e.duration_sec}s</span>`);
        return `<li class="ev-item">
          <span class="dim num" title="${esc(fmtDateTime(e.ts))}">${fmtClock(e.ts)}</span>
          <span class="tag ${esc(ti.cls)}" title="${esc(ti.tip)}">${esc(ti.text)}</span>
          <div style="min-width:0">
            <div class="ev-name" title="${esc(title)}">${esc(title)}</div>
            ${badges.length ? `<div class="ev-meta">${badges.join('')}</div>` : ''}
            ${detail && detail !== title ? `<div class="ev-sub" title="${esc(detail)}">${esc(detail)}</div>` : ''}
          </div>
        </li>`;
      }).join('')}</ul>` : '<div class="sub">近 30 天无 generate_image 调用记录。</div>'}
    </section>`);

    return parts.join('');
  }

  function renderPools(d) {
    const poolsObj = d.pools || {};
    const pools = poolsObj.pools || [];
    const parts = [];

    if (poolsObj.routingAdvice) {
      const cls = poolsObj.routingAdvice.level === 'critical' ? 'bad' : 'warn';
      parts.push(`<div class="callout ${cls}">${esc(poolsObj.routingAdvice.text)}</div>`);
    }

    if (!pools.length) {
      parts.push(`<section class="card"><div class="ch"><span class="ctitle">模型配额池</span></div>
        <div class="sub">${esc(poolsObj.error || '暂未从 Language Server 获取到模型配额数据，请点击右上角刷新重试。')}</div></section>`);
    } else {
      for (const p of pools) {
        const isActive = p.key === poolsObj.activePoolKey;
        const activeCls = isActive ? `active-${p.accent}` : '';
        const wins = poolWindowsList(p);
        const pillsHtml = wins.length
          ? wins.map((w) => `<span class="pill ${healthCls(w.health)} num">${esc(w.shortLabel)} ${w.remainingPct !== null ? `${w.remainingPct.toFixed(1)}%` : '--'}</span>`).join('')
          : `<span class="pill ${healthCls(p.health)} num">${p.remainingPct !== null ? `余 ${p.remainingPct.toFixed(1)}%` : '--'}</span>`;
        const winBoxesHtml = wins.map((w) => {
          const wpct = w.remainingPct !== null ? w.remainingPct : 0;
          const pctCls = w.health === 'critical' ? 'bad' : w.health === 'warning' ? 'warn' : '';
          const isBottleneck = wins.length > 1 && p.bottleneckWindow === w.window && w.remainingPct !== null && w.remainingPct < 50;
          return `<div class="win-box">
            <div class="win-head">
              <span class="win-name">${esc(w.label)}${isBottleneck ? ' <span class="pill warn" style="font-size:10px;padding:1px 5px">当前瓶颈</span>' : ''}</span>
              <span class="num">
                <span class="win-pct ${pctCls}">余 ${w.remainingPct !== null ? `${w.remainingPct.toFixed(1)}%` : '--'}</span>
                ${w.usedPct !== null ? `<span class="dim" style="margin-left:5px;font-size:11px">已用 ${w.usedPct.toFixed(1)}%</span>` : ''}
              </span>
            </div>
            <div class="bar-wrap" style="margin:5px 0">
              <div class="bar-fill" style="width:${Math.max(0, Math.min(100, wpct))}%;background:${barFillColor(w.health, p.accent)}"></div>
            </div>
            <div class="meta-row">
              <span>${w.window === '5h' ? '5 小时平滑峰值窗口' : w.window === 'weekly' ? '7 天个人套餐总额度' : '周期额度'}</span>
              <span>${winResetHtml(w, false)}</span>
            </div>
          </div>`;
        }).join('');
        parts.push(`<section class="card ${activeCls}">
          <div class="ch">
            <span class="ctitle">${esc(p.label)} ${isActive ? `<span class="pill ${p.accent}">当前对话所在池</span>` : ''}</span>
            <span class="pill-row">${pillsHtml}</span>
          </div>
          <div class="sub">${esc(p.description || '')}${p.familyCount ? ` · ${p.familyCount} 模型族 (${p.modelCount} 档位)` : ''}</div>
          <div class="win-list" style="margin:8px 0 6px">${winBoxesHtml || '<div class="sub">暂未获取到窗口额度明细</div>'}</div>
          ${!p.hasDualWindows && poolsObj.quotaSummaryAvailable === false ? '<div class="sub" style="margin-bottom:4px">注：RetrieveUserQuotaSummary 暂不可用，当前仅展示单窗口回退数据。</div>' : ''}
          <div class="sec-sep" style="margin-top:6px;padding-top:6px">
            ${(() => {
              const rowHtml = (m) => `<div class="model-row">
                <div class="model-left">
                  <div class="model-name">
                    ${m.tier ? `<span class="tier ${m.tier === 'IMG' ? 'IMG' : ''}">${esc(m.tier)}</span>` : ''}
                    <span>${esc(m.family)}</span>
                    ${m.variantsCount > 1 ? `<span class="dim" style="font-size:11px">×${m.variantsCount}</span>` : ''}
                  </div>
                  ${m.role ? `<div class="ev-sub">${esc(m.role)}</div>` : ''}
                </div>
                <div class="num dim" style="font-size:11.5px;text-align:right;white-space:nowrap">
                  ${p.hasMixedQuotas && m.remainingPct !== null ? `<div style="color:var(--fg);font-weight:600">${m.remainingPct.toFixed(1)}%</div>` : ''}
                  ${m.maxTokens ? `<div>${fmtTok(m.maxTokens)}</div>` : ''}
                </div>
              </div>`;
              const all = p.models || [];
              const isPrimary = (m) => Boolean(m.tier) && !/(-sonar|-tiered|orchestrator|worker-agy)/i.test(m.id || '') && !/^orchestrator\b/i.test(m.family || '');
              const primary = all.filter(isPrimary);
              const extra = all.filter((m) => !isPrimary(m));
              if (primary.length && extra.length) {
                return primary.map(rowHtml).join('') +
                  `<details style="margin-top:4px"><summary class="sub" style="cursor:pointer;padding:4px 0;user-select:none">展开其余 ${extra.length} 个内部/兼容模型</summary>${extra.map(rowHtml).join('')}</details>`;
              }
              return all.map(rowHtml).join('');
            })()}
          </div>
        </section>`);
      }
    }

    if (poolsObj.imageModelPoolNote) {
      parts.push(`<div class="callout info">${esc(poolsObj.imageModelPoolNote)}</div>`);
    }
    return parts.join('');
  }

  function renderFileList(title, hint, items) {
    if (!items || !items.length) return '';
    return `<section class="card">
      <div class="h2"><span>${esc(title)}</span><span class="hint">${esc(hint)}</span></div>
      <ul class="list files">${items.map((it) => {
        const [name, dir] = splitPath(it.path || '');
        const tok = Number(it.tokens) > 0 ? `<span class="tok num">${fmtTok(it.tokens)}</span>` : '<span></span>';
        return `<li><div class="name" title="${esc(it.path || '')}">${esc(name)}${dir ? `<span class="dir">${esc(dir)}</span>` : ''}</div>${tok}</li>`;
      }).join('')}</ul>
    </section>`;
  }

  function renderContext(d) {
    const ctx = d.context;
    if (!ctx || ctx.error) {
      const msg = ctx?.error === 'no-conversation'
        ? '在具体对话中打开本面板，即可查看实时上下文占用明细。'
        : ctx?.error === 'no-database'
          ? '新对话尚无落盘数据，发送首条消息后自动更新。'
          : (ctx?.message || '读取上下文报告失败。');
      return `<p class="empty">${esc(msg)}</p>`;
    }

    const parts = [];
    const budget = Number(ctx.request_budget_tokens) || 0;
    const nearBudget = budget > 0 && ctx.used_tokens >= budget * 0.8;
    const cells = gridCells(ctx.grid_segments, ctx.limit_tokens);

    const byKey = new Map((ctx.categories || []).map((c) => [c.key, c]));
    const groupsHtml = CTX_GROUPS.map((g) => {
      const items = g.keys.map((k) => byKey.get(k)).filter(Boolean);
      if (!items.length) return '';
      return `<div class="group">${items.map((c) => `<div class="crow">
        <span class="mark${g.sq ? ' sq' : ''}" style="background:${CAT_COLOR[c.key] || 'var(--dim)'}"></span>
        <span>${esc(CAT_LABEL[c.key] || c.name)}</span>
        <span class="tok num">${fmtTok(c.tokens)}</span>
        <span class="p num">${Number(c.pct || 0).toFixed(1)}%</span>
      </div>`).join('')}</div>`;
    }).join('');

    const freePct = ctx.limit_tokens ? ((ctx.free_tokens / ctx.limit_tokens) * 100).toFixed(1) : '0.0';
    parts.push(`<section class="card">
      <div class="ch">
        <span class="ctitle">${esc(ctx.model || '当前上下文')}</span>
        <button id="btn-copy-ctx" type="button">复制文本</button>
      </div>
      <div class="bigrow">
        <div class="big num" style="font-size:18px">${fmtTok(ctx.used_tokens)} <span class="dim" style="font-size:12.5px;font-weight:500">/ ${ctx.limit_tokens ? fmtTok(ctx.limit_tokens) : '?'} tokens</span></div>
        <span class="pill ${nearBudget ? 'warn' : ''}">${ctx.limit_tokens ? `${ctx.used_pct.toFixed(1)}%` : '--'}</span>
      </div>
      ${nearBudget ? `<div class="callout warn" style="margin-bottom:6px">接近单次请求预算（${fmtTok(budget)} tokens），建议及时执行 <span class="mono">/compact</span> 瘦身。</div>` : ''}
      <div class="grid">${cells.map((col) => `<span class="dot"${col ? ` style="background:${col}"` : ''}></span>`).join('')}</div>
      <div class="sec-sep">
        <div class="h2"><span>${esc(ctx.heading || '分类占用明细')}</span></div>
        ${groupsHtml}
        <div class="group">
          <div class="crow">
            <span class="mark free"></span>
            <span class="dim">剩余可用空间</span>
            <span class="tok num dim">${fmtTok(ctx.free_tokens)}</span>
            <span class="p num">${freePct}%</span>
          </div>
          ${ctx.checkpoint_buffer > 0 ? `<div class="crow">
            <span class="mark sq" style="background:var(--empty)"></span>
            <span class="dim">检查点缓冲（不计入占用）</span>
            <span class="tok num dim">${fmtTok(ctx.checkpoint_buffer)}</span>
            <span class="p"></span>
          </div>` : ''}
        </div>
      </div>
