      const budget = Number(ctx.request_budget_tokens) || 0;
      const nearBudget = budget > 0 && ctx.used_tokens >= budget * 0.8;
      const cells = gridCells(ctx.grid_segments, ctx.limit_tokens);
      const topCats = [...(ctx.categories || [])]
        .filter((c) => c.tokens > 0)
        .sort((a, b) => b.tokens - a.tokens)
        .slice(0, 4);
      parts.push(`<section class="card">
        <div class="ch">
          <span class="ctitle">当前上下文 ${ctx.compacted ? '<span class="pill warn">已压缩</span>' : ''}</span>
          <button class="link-btn" data-jump="context">完整明细 →</button>
        </div>
        <div class="bigrow">
          <div class="big num" style="font-size:17px">${fmtTok(ctx.used_tokens)} <span class="dim" style="font-size:12.5px;font-weight:500">/ ${ctx.limit_tokens ? fmtTok(ctx.limit_tokens) : '?'}</span></div>
          <span class="pill ${nearBudget ? 'warn' : ''}">${ctx.limit_tokens ? `${ctx.used_pct.toFixed(1)}%` : '--'}${nearBudget ? ` · 接近单次预算 ${fmtTok(budget)}` : ''}</span>
        </div>
        <div class="grid">${cells.map((col) => `<span class="dot"${col ? ` style="background:${col}"` : ''}></span>`).join('')}</div>
        ${renderCacheOverviewStrip(ctx.cache)}
        ${topCats.length ? `<div class="sum-grid">${topCats.map((c) => `
          <div class="sum-item">
            <span class="sum-left"><span class="mark" style="background:${CAT_COLOR[c.key] || 'var(--dim)'}"></span><span>${esc(CAT_LABEL[c.key] || c.name)}</span></span>
            <span class="num dim">${fmtTok(c.tokens)}</span>
          </div>`).join('')}</div>` : ''}
      </section>`);
    }

    return parts.join('');
  }

  function renderImage(d) {
    const iq = d.imageQuota;
    if (!iq || iq.error) {
      return `<section class="card"><div class="ch"><span class="ctitle">生图配额详情</span></div>
        <div class="callout bad">${esc(iq?.message || '读取本地对话记录失败')}</div></section>`;
    }
    const w5 = iq.window_5h;
    const w24 = iq.window_24h || {};
    const w7 = iq.window_7d || {};
    const cal = iq.calibration || {};
    const rs = iq.rolling_schedule || {};
    const avg = iq.per_image_avg || {};
    const wrAvg = avg.with_refs || {};
    const anc = iq.anchor || {};
    const peak = cal.observed_safe_peak || {};
    const meta = imgStatusMeta(w5, anc);
    const refCalls = anc.ref_calls || w5.hard_cap || 60;
    const refTokens = anc.ref_tokens || 0;
    const softCalls = anc.soft_calls || w5.soft_cap || 54;
    const tickPct = refCalls > 0 ? Math.min(100, (softCalls / refCalls) * 100) : 85;
    const wrTok = Number(anc.avg_with_refs_tokens || wrAvg.avg_tokens_total || avg.avg_tokens_total || 3880);
    const wrRem = Number(anc.est_remaining_imgs_with_refs ?? 0);
    const wrRemExact = Number(anc.est_remaining_imgs_with_refs_exact ?? wrRem);
    const byRefRem = anc.est_remaining_imgs_by_refs || {};
    const callsPct = Number(anc.calls_pct ?? w5.calls_pct ?? 0);
    const tokensPct = Number(anc.tokens_pct ?? w5.tokens_pct ?? 0);
    const remCalls = Number(anc.remaining_calls ?? w5.remaining_est ?? 0);
    const tokBarPct = w5.cooldown_active ? 100 : Math.min(100, tokensPct);
    const callsBarPct = w5.cooldown_active ? 100 : Math.min(100, callsPct);
    const tokBarHealth = w5.cooldown_active
      ? 'locked'
      : (anc.is_hard_ceiling !== false && tokensPct >= 100 ? 'critical' : (tokensPct >= 88 ? 'warning' : 'ok'));
    const callsBarHealth = w5.cooldown_active
      ? 'locked'
      : (anc.is_hard_ceiling !== false && callsPct >= 100 ? 'critical' : (callsPct >= 88 ? 'warning' : 'ok'));
    const parts = [];

    // 1. 5h rolling occupancy & Token breakdown card
    const anchorRight = (anc.is_hard_ceiling === false && anc.exceeded_safe_peak && wrRem === 0)
      ? (remCalls > 0 ? `破峰中 · 次数余 ${remCalls}` : '破峰中 · 未触429')
      : `带垫图余 ~${wrRem} 张 (Tok ${tokensPct.toFixed(0)}%)`;
    const byRefChips = ['1', '2', '3+', '0']
      .filter((k) => byRefRem[k] !== undefined)
      .map((k) => `<span class="chip num">${k === '0' ? '无参' : `${k}参`} <strong>~${byRefRem[k]}张</strong></span>`)
      .join('');
    parts.push(`<section class="card">
      <div class="ch">
        <span class="ctitle">5h 连续滚轴占用 <span class="pill ${meta.pill}">${meta.text}</span></span>
        <span class="sub mono">${esc(iq.model || 'gemini-3.1-flash-image')}</span>
      </div>
      ${w5.cooldown_active
        ? `<div class="bigrow"><div class="big bad num">剩余冷却 ${cdSpan(w5.next_recover_ts || w5.window_end, '已解封')}</div><span class="sub num">解封 ${fmtDateTime(w5.next_recover_ts || w5.window_end)}</span></div>`
        : `<div class="bigrow"><div class="big ${meta.big} num">${w5.metric_used} 次 · ${fmtTok(w5.tokens_total)} tok</div><span class="sub num" style="color:var(--fg);font-weight:600" title="预估上限 ${refCalls} 次 (${callsPct.toFixed(1)}%) / ${fmtTok(refTokens)} tok (${tokensPct.toFixed(1)}%)；剩余 ${fmtTok(anc.remaining_tokens || 0)} tok">${esc(anchorRight)}</span></div>`}
      <div class="win-list" style="margin-top:6px">
        <div class="win-mini" title="Token 占用：${fmtTok(w5.tokens_total)} / ${fmtTok(refTokens)} tok (${tokensPct.toFixed(1)}%)">
          <div class="meta-row" style="margin-top:0">
            <span style="color:var(--fg);font-weight:500">Token 占用</span>
            <span class="num"><strong>${fmtTok(w5.tokens_total)}</strong> / ${fmtTok(refTokens)} <span class="dim">(${tokensPct.toFixed(1)}%)</span></span>
          </div>
          <div class="bar-wrap sm">
            <div class="bar-fill" style="width:${tokBarPct}%;background:${barFillColor(tokBarHealth)}"></div>
          </div>
        </div>
        <div class="win-mini" title="次数占用：${w5.metric_used} / ${refCalls} 次 (${callsPct.toFixed(1)}%)">
          <div class="meta-row" style="margin-top:0">
            <span style="color:var(--fg);font-weight:500">次数占用</span>
            <span class="num"><strong>${w5.metric_used}</strong> / ${refCalls} 次 <span class="dim">(${callsPct.toFixed(1)}%)</span></span>
          </div>
          <div class="bar-wrap sm">
            <div class="bar-fill" style="width:${callsBarPct}%;background:${barFillColor(callsBarHealth)}"></div>
            ${anc.is_hard_ceiling !== false ? `<div class="bar-tick" style="left:${tickPct.toFixed(1)}%" title="预警线 ${softCalls} 次"></div>` : ''}
          </div>
        </div>
      </div>
      <div class="meta-row">
        <span>预估上限：<strong>${refCalls}次 / ${fmtTok(refTokens)} tok</strong></span>
        <span class="num">${w5.oldest_ts > 0 ? `在窗 ${fmtHM(w5.oldest_ts)} → ${fmtHM(w5.newest_ts)}` : '当前 5h 无在窗调用'}</span>
      </div>
      ${!w5.cooldown_active ? `<div class="callout" style="margin-top:7px;background:color-mix(in srgb,var(--accent) 8%,transparent);border-color:color-mix(in srgb,var(--accent) 28%,transparent)">
        <div class="meta-row" style="margin-top:0">
          <span style="color:var(--fg);font-weight:600">按带垫图均图（${fmtTok(wrTok)} tok）预估余 <strong class="num" style="color:var(--accent);font-size:13px">~${wrRem} 张</strong> <span class="dim num">(${wrRemExact}张)</span></span>
          <span class="num dim">余 ${fmtTok(anc.remaining_tokens || 0)} tok</span>
        </div>
        ${byRefChips ? `<div class="chips" style="margin-top:5px">${byRefChips}</div>` : ''}
      </div>` : ''}
      <div class="tok-breakdown">
        <span class="chip num">Prompt <strong>${fmtTok(w5.prompt_tokens)}</strong></span>
        <span class="chip num">参考图 <strong>${fmtTok(w5.input_image_tokens)}</strong> (${w5.ref_images || 0}张)</span>
        <span class="chip num">1K出图 <strong>${fmtTok(w5.output_image_tokens)}</strong></span>
        <span class="chip num" title="不含最小内部思考的确定性 Token 为 ${fmtTok(w5.tokens_raw)}">思考估 <strong>~${fmtTok(w5.thinking_tokens)}</strong></span>
        <span class="chip num">API等效 <strong>${fmtUsd(w5.est_usd)}</strong></span>
      </div>
      ${(anc.notes || []).length ? `<div class="sub" style="margin-top:6px;line-height:1.45">${anc.notes.map((n) => esc(n)).join('；')}。</div>` : ''}
      ${w5.last_429_msg ? `<div class="callout ${w5.cooldown_active ? 'bad' : 'warn'}" style="margin-top:7px">
        <div style="font-weight:600;margin-bottom:2px">最近官方 5h 429 记录（${fmtDateTime(w5.last_429_at)}）</div>
        <div class="mono" style="font-size:11px;word-break:break-all">${esc(w5.last_429_msg)}</div>
      </div>` : ''}
    </section>`);

    // 2. Rolling recovery schedule (30-min clock-aligned buckets)
    const buckets = rs.buckets || [];
    const maxBucketCalls = Math.max(1, ...buckets.map((b) => Number(b.calls) || 0));
    const fb = rs.first_batch;
    const m30 = rs.recover_next_30m || { calls: 0, tokens_total: 0, est_imgs_with_refs: 0 };
    const m1h = rs.recover_next_1h || { calls: 0, tokens_total: 0, est_imgs_with_refs: 0 };
    const m2h = rs.recover_next_2h || { calls: 0, tokens_total: 0, est_imgs_with_refs: 0 };
    parts.push(`<section class="card">
      <div class="ch">
        <span class="ctitle">5h 时间滚轴 · 分段回血时间表</span>
        <span class="sub num">${buckets.length ? `共 ${rs.total_calls} 次待滚出` : '无排队释放'}</span>
      </div>
      ${buckets.length ? `
        <div class="roll-head">
          <div class="roll-kpi">
            <div class="roll-kpi-lbl">${w5.cooldown_active ? '预计解封 / 下批回血' : '下批回血倒计时'}</div>
            <div class="roll-kpi-val num" style="color:${w5.cooldown_active ? 'var(--bad)' : 'var(--ok)'}">${cdSpan(w5.next_recover_ts, '即将释放')}</div>
            <div class="roll-kpi-sub num">${fmtClock(w5.next_recover_ts)}${fb ? ` · 先释 +${fb.calls}次 (${fmtTok(fb.tokens_total)}${fb.est_imgs_with_refs > 0 ? ` ≈+${fb.est_imgs_with_refs}张` : ''})` : ''}</div>
          </div>
          <div class="roll-kpi">
            <div class="roll-kpi-lbl">完全清空倒计时</div>
            <div class="roll-kpi-val num">${cdSpan(w5.full_clear_ts, '已清空')}</div>
            <div class="roll-kpi-sub num">${fmtDateTime(w5.full_clear_ts)} 全量归零</div>
          </div>
        </div>
        <div class="chips" style="margin-top:0">
          <span class="chip num" title="释放 ${m30.calls} 次 / ${fmtTok(m30.tokens_total)} tok">30分内 <strong>+${m30.calls}次</strong> (${m30.est_imgs_with_refs > 0 ? `≈+${m30.est_imgs_with_refs}张` : fmtTok(m30.tokens_total)})</span>
          <span class="chip num" title="释放 ${m1h.calls} 次 / ${fmtTok(m1h.tokens_total)} tok">1小时内 <strong>+${m1h.calls}次</strong> (${m1h.est_imgs_with_refs > 0 ? `≈+${m1h.est_imgs_with_refs}张` : fmtTok(m1h.tokens_total)})</span>
          <span class="chip num" title="释放 ${m2h.calls} 次 / ${fmtTok(m2h.tokens_total)} tok">2小时内 <strong>+${m2h.calls}次</strong> (${m2h.est_imgs_with_refs > 0 ? `≈+${m2h.est_imgs_with_refs}张` : fmtTok(m2h.tokens_total)})</span>
        </div>
        <div class="roll-list">${buckets.map((b) => {
          const pctW = Math.max(6, Math.round((b.calls / maxBucketCalls) * 100));
          const wrPart = b.est_imgs_with_refs > 0 ? `（约合 +${b.est_imgs_with_refs} 张带垫图）` : '';
          const tip = `${fmtClock(b.first_free_ts)}–${fmtClock(b.last_free_ts)}：释放 ${b.calls} 次（${b.ok}成/${b.eof}EOF/${b.err}错），约 ${fmtTok(b.tokens_total)} tok${wrPart}，累计已释放 ${b.cum_calls}/${rs.total_calls} (${b.cum_pct}%)`;
          return `<div class="roll-row num" title="${esc(tip)}">
            <span class="roll-time">${fmtHM(b.bucket_start_ts)}–${fmtHM(b.bucket_end_ts)}</span>
            <div class="roll-bar"><div class="roll-fill" style="width:${pctW}%"></div></div>
            <span class="roll-val"><strong>+${b.calls}次</strong> · ${fmtTok(b.tokens_total)} <span class="dim">(${b.cum_pct}%)</span></span>
          </div>`;
        }).join('')}</div>
      ` : `<div class="sub">当前 5 小时滚动窗口已完全清空，暂无待释出调用。每次生图都会在发起满 5 小时后自动滚出释放。</div>`}
    </section>`);

    // 2b. 7-day weekly rolling schedule (day-aligned) & weekly 429 tracking
    const wrs = iq.weekly_rolling_schedule || {};
    const wBuckets = wrs.buckets || [];
    const maxWBucketCalls = Math.max(1, ...wBuckets.map((b) => Number(b.calls) || 0));
    const wfb = wrs.first_batch;
    const wm24 = wrs.recover_next_24h || { calls: 0, tokens_total: 0, est_imgs_with_refs: 0 };
    const wm48 = wrs.recover_next_48h || { calls: 0, tokens_total: 0, est_imgs_with_refs: 0 };
    const wm72 = wrs.recover_next_72h || { calls: 0, tokens_total: 0, est_imgs_with_refs: 0 };
    const peak7d = cal.observed_7d_safe_peak || {};
    parts.push(`<section class="card">
      <div class="ch">
        <span class="ctitle">7 天周滚轴 · 按日回血时间表 ${wrs.cooldown_active ? '<span class="pill bad">周池冷却</span>' : ''}</span>
        <span class="sub num">${wBuckets.length ? `近7天 ${wrs.total_calls} 次 (${fmtTok(wrs.total_tokens_total)})` : '7天无占用'}</span>
      </div>
      ${wBuckets.length ? `
        <div class="roll-head">
          <div class="roll-kpi">
            <div class="roll-kpi-lbl">${wrs.cooldown_active ? '预计周解封 / 下批回血' : '下批周滚出倒计时'}</div>
            <div class="roll-kpi-val num" style="color:${wrs.cooldown_active ? 'var(--bad)' : 'var(--ok)'}">${cdSpan(wrs.next_recover_ts, '即将释放')}</div>
            <div class="roll-kpi-sub num">${fmtDateTime(wrs.next_recover_ts)}${wfb ? ` · 先释 +${wfb.calls}次 (${fmtTok(wfb.tokens_total)})` : ''}</div>
          </div>
          <div class="roll-kpi">
            <div class="roll-kpi-lbl">7 天完全清空</div>
            <div class="roll-kpi-val num">${cdSpan(wrs.full_clear_ts, '已清空')}</div>
            <div class="roll-kpi-sub num">${fmtDateTime(wrs.full_clear_ts)} 全量滚出</div>
          </div>
        </div>
        <div class="chips" style="margin-top:0">
          <span class="chip num" title="未来 24 小时滚出 ${wm24.calls} 次 / ${fmtTok(wm24.tokens_total)} tok">24h内 <strong>+${wm24.calls}次</strong></span>
          <span class="chip num" title="未来 48 小时滚出 ${wm48.calls} 次 / ${fmtTok(wm48.tokens_total)} tok">48h内 <strong>+${wm48.calls}次</strong></span>
          <span class="chip num" title="未来 72 小时滚出 ${wm72.calls} 次 / ${fmtTok(wm72.tokens_total)} tok">72h内 <strong>+${wm72.calls}次</strong></span>
          ${peak7d.max_attempts > 0 ? `<span class="chip num" title="近 30 天内实测无周池 429 的最高 7 天滚动峰">30d安全周峰 <strong>${peak7d.max_attempts}次</strong></span>` : ''}
          ${cal.weekly_lock_count > 0 ? `<span class="chip num" style="border-color:color-mix(in srgb,var(--bad) 45%,transparent)">周429均值 <strong>${cal.avg_attempts_at_weekly_lock}次</strong></span>` : ''}
        </div>
        <div class="roll-list">${wBuckets.map((b) => {
          const pctW = Math.max(6, Math.round((b.calls / maxWBucketCalls) * 100));
          const wrPart = b.est_imgs_with_refs > 0 ? `（约合 +${b.est_imgs_with_refs} 张带垫图）` : '';
          const tip = `${b.date_key} (${fmtHM(b.first_free_ts)}–${fmtHM(b.last_free_ts)})：滚出释放 ${b.calls} 次（${b.ok}成/${b.eof}EOF/${b.err}错），约 ${fmtTok(b.tokens_total)} tok${wrPart}，累计已释放 ${b.cum_calls}/${wrs.total_calls} (${b.cum_pct}%)`;
          return `<div class="rec-row num" title="${esc(tip)}">
            <span class="roll-time">${esc(b.label)}</span>
            <div class="roll-bar"><div class="roll-fill pool-a" style="width:${pctW}%"></div></div>
            <span class="roll-val"><strong>+${b.calls}次</strong> · ${fmtTok(b.tokens_total)} <span class="dim">(${b.cum_pct}%)</span></span>
          </div>`;
        }).join('')}</div>
      ` : `<div class="sub">近 7 天暂无生图调用记录，每次生图都会在发起满 7 天后从周池自动滚出释放。</div>`}
      ${wrs.last_weekly_429_msg ? `<div class="callout ${wrs.cooldown_active ? 'bad' : 'warn'}" style="margin-top:7px">
        <div style="font-weight:600;margin-bottom:2px">最近官方周池 429 记录（${fmtDateTime(wrs.last_weekly_429_at)}）</div>
        <div class="mono" style="font-size:11px;word-break:break-all">${esc(wrs.last_weekly_429_msg)}</div>
      </div>` : ''}
    </section>`);

    // 3. Self-learning watermark band & per-image token profile
    const latestLock = cal.latest_lock;
    const hasCleanLock = (cal.clean_lock_count || 0) > 0;
    const lockMain = hasCleanLock
      ? `${cal.clean_avg_attempts_at_lock} 次 · ${fmtTok(cal.clean_avg_tokens_at_lock)}`
      : (latestLock
        ? (latestLock.is_truncated
          ? `${latestLock.attempts} 次 (不完整窗口)`
          : `${latestLock.attempts} 次 (${latestLock.eof_rate_pct}% EOF)`)
        : '暂无 5h 429');
    const lockSub = hasCleanLock
      ? `基于 ${cal.clean_lock_count} 次干净锁自动校准（均值 ${cal.clean_avg_ok_at_lock} 成功）`
      : (latestLock
        ? (latestLock.is_truncated
          ? `窗口开头缺失 ${Math.round((latestLock.start_gap_sec || 0) / 60)} 分钟（旧对话清理/跨端调用），未作硬上限`
          : `仅高 EOF 噪声锁（${latestLock.ok}成/${latestLock.eof}EOF），未作硬上限`)
        : '近 30 天未触发 5h 配额耗尽，仅依赖安全峰值推算');
    const byRefs = avg.by_refs || [];
    const pinnedPeak = cal.pinned_peak || null;
    const pinnedCalls = Number(anc.pinned_calls || pinnedPeak?.calls || 0);
    const isPinned = pinnedCalls >= 1 && anc.mode !== 'manual';
    const persistedTag = isPinned
      ? ' · 已固定锁定'
      : (cal.persisted_safe_peak_used ? ' · 永久账本保护' : '');
    const safeTitle = isPinned
      ? '已固定峰值上限 (永久锁定)'
      : (anc.ref_tokens_source === 'calls_x_with_refs' ? '预估上限 (已证次数×带垫图)' : '已证安全下界 (30d 无 429)');
    const safeSub = isPinned
      ? `当前实测 0-429 峰 ${anc.safe_lower_calls || peak.max_attempts || 0} 次 · 按带垫图均图折算${persistedTag}`
      : (anc.ref_tokens_source === 'calls_x_with_refs'
        ? `实测0-429峰 ${fmtTok(anc.safe_lower_tokens || peak.max_tokens_total || 0)} · 最高成功 ${peak.max_ok || 0} 次${persistedTag}`
        : `最高成功 ${peak.max_ok || 0} 次${peak.max_tokens_at ? ` · 峰值 ${fmtDateTime(peak.max_tokens_at)}` : ''}${persistedTag}`);
    const higherObsCalls = Number(anc.safe_lower_calls || peak.max_attempts || 0);
    parts.push(`<section class="card">
      <div class="ch">
        <span class="ctitle">自学习水位带 & 均图 Token ${isPinned ? `<span class="pill pool-a num">固定 ${pinnedCalls}次</span>` : ''}</span>
        <span class="sub num">30d 样本 ${avg.sample_count || 0} 次</span>
      </div>
      <div class="band-grid">
        <div class="band-box safe">
          <div class="band-title">${esc(safeTitle)}</div>
          <div class="band-main num">${refCalls} 次 · ${fmtTok(refTokens)}</div>
          <div class="band-sub num">${esc(safeSub)}</div>
        </div>
        <div class="band-box lock">
          <div class="band-title">实测 5h 429 上界 (30d)</div>
          <div class="band-main num">${esc(lockMain)}</div>
          <div class="band-sub">${esc(lockSub)}${cal.rpm_burst_count ? ` · 另剥离 ${cal.rpm_burst_count} 次瞬时 RPM` : ''}</div>
        </div>
      </div>
      <form id="pin-peak-form" class="pin-bar${isPinned ? ' pinned' : ''}">
        <label class="pin-left" for="inp-pin-calls">
          <span>${isPinned ? '峰值已固定' : '峰值固定'}</span>
          <input id="inp-pin-calls" name="calls" class="num" type="number" min="1" max="5000" value="${isPinned ? pinnedCalls : refCalls}" title="输入要固定的 5h 生图峰值张数（如 100），固定后永不回退">
          <span class="dim" style="font-weight:500">次</span>
        </label>
        <div class="pin-actions">
          <button type="submit" class="primary">${isPinned ? '更新固定' : '固定峰值'}</button>
          ${isPinned && higherObsCalls > pinnedCalls ? `<button type="button" id="btn-pin-observed" data-calls="${higherObsCalls}">用实测 ${higherObsCalls}</button>` : ''}
          ${isPinned ? '<button type="button" id="btn-unpin-peak">取消固定</button>' : ''}
        </div>
      </form>
      ${state.pinToast ? `<div class="sub" style="margin:-3px 0 7px;color:${state.pinToast.err ? 'var(--bad)' : 'var(--ok)'}">${esc(state.pinToast.msg)}</div>` : ''}
      ${byRefs.length ? `<table class="stat-table num">
        <thead><tr><th>参考图</th><th>样本</th><th>均Prompt</th><th>均含思考Tok</th><th>API等效</th></tr></thead>
        <tbody>
          <tr style="font-weight:600">
            <td>总均值 (${avg.avg_refs}张)</td>
            <td>${avg.sample_count}</td>
            <td>${fmtTok(avg.avg_prompt_tokens)}</td>
            <td>${fmtTok(avg.avg_tokens_total)}</td>
            <td>${fmtUsd(avg.avg_est_usd)}</td>
          </tr>
          ${wrAvg.sample_count > 0 ? `<tr style="font-weight:600;background:color-mix(in srgb,var(--accent) 10%,transparent)" title="用于预估剩余可出图张数（占全部生图 ${wrAvg.share_pct}%）">
            <td style="color:var(--accent)">带垫图均 (${wrAvg.avg_refs}张)</td>
            <td>${wrAvg.sample_count}</td>
            <td>${fmtTok(wrAvg.avg_prompt_tokens)}</td>
            <td style="color:var(--accent)">${fmtTok(wrAvg.avg_tokens_total)}</td>
            <td>${fmtUsd(wrAvg.avg_est_usd)}</td>
          </tr>` : ''}
          ${byRefs.map((g) => `<tr>
            <td>${esc(g.label)} 张参考图</td>
            <td>${g.count}</td>
            <td>${fmtTok(g.avg_prompt_tokens)}</td>
            <td>${fmtTok(g.avg_tokens_total)}</td>
            <td>${fmtUsd(g.avg_est_usd)}</td>
          </tr>`).join('')}
        </tbody>
      </table>` : `<div class="sub">暂无足够生图样本，默认估算单图 ~${fmtTok(avg.avg_tokens_total || 1850)} tok（${fmtUsd(avg.avg_est_usd || 0.0682)}）。</div>`}
      <div class="sub" style="margin-top:6px;line-height:1.4">公式（Nano Banana 2 · 1K）：出图固定 1,120 tok（$0.0672，占 API 成本 ${avg.output_cost_share_pct ?? 97.6}%）+ 参考图 1,120 tok/张 + Prompt 文本 + 最小思考估 ~250 tok/次。</div>
    </section>`);

    // 4. 5h / 24h / 7d stats table
    const rows = [
      ['5h 滚轴', w5],
      ['近 24h', w24],
      ['近 7 天', w7],
    ];
    parts.push(`<section class="card">
      <div class="ch"><span class="ctitle">多周期生图统计</span><span class="sub">含参考图与 Token 估算</span></div>
      <table class="stat-table num">
        <thead><tr><th>周期</th><th>成功</th><th>EOF</th><th>429</th><th>参考图</th><th>估算Tok</th><th>尝试</th></tr></thead>
        <tbody>${rows.map(([lbl, b]) => {
          const cnt429 = (b.rate_limited || 0) + (b.weekly_rate_limited || 0);
          const tip = `失败 ${b.err ?? 0} · 5h-429 ${b.rate_limited ?? 0} · 周429 ${b.weekly_rate_limited ?? 0} · RPM限流 ${b.rpm_limited ?? 0} · 参数错 ${b.client_err ?? 0} · EOF率 ${b.eof_rate_pct ?? 0}% · 不含思考 ${fmtTok(b.tokens_raw)} · API等效 ${fmtUsd(b.est_usd)}`;
          return `<tr title="${esc(tip)}">
            <td>${lbl}</td>
            <td style="color:var(--ok)">${b.ok ?? 0}</td>
            <td style="color:${(b.eof || 0) > 0 ? 'var(--warn)' : 'var(--dim)'}">${b.eof ?? 0}</td>
            <td style="color:${cnt429 > 0 ? 'var(--bad)' : 'var(--dim)'}">${cnt429}</td>
            <td>${b.ref_images ?? 0}</td>
            <td>${fmtTok(b.tokens_total)}</td>
            <td><strong>${b.attempts ?? 0}</strong></td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </section>`);

    // 5. Settings form (Auto watermark band vs Manual threshold)
    const s = d.settings || { anchorMode: 'auto', softCap: 54, hardCap: 60, tokenCap: 0, countMode: 'attempts' };
    const isManual = s.anchorMode === 'manual';
    parts.push(`<section class="card">
      <div class="ch"><span class="ctitle">锚定模式与计数口径</span><span class="sub">持久化保存</span></div>
      <form id="settings-form">
        <div class="form-grid">
          <div class="field full">
            <label for="inp-anchor">配额锚定模式</label>
            <select id="inp-anchor" name="anchorMode">
              <option value="auto"${!isManual ? ' selected' : ''}>自学习水位带（推荐，无需填总数）</option>
              <option value="manual"${isManual ? ' selected' : ''}>手动阈值模式（自定义次/Token 上限）</option>
            </select>
          </div>
          <div class="field full">
            <label for="inp-mode">计数口径</label>
            <select id="inp-mode" name="countMode">
              <option value="attempts"${s.countMode === 'attempts' ? ' selected' : ''}>含 EOF / 异常全部尝试（推荐，防断流偷扣额度）</option>
              <option value="ok_only"${s.countMode === 'ok_only' ? ' selected' : ''}>仅计成功出图次数</option>
            </select>
          </div>
          <div id="manual-fields" class="field full manual-box${isManual ? '' : ' dimmed'}">
            <div class="form-grid" style="margin-top:0">
              <div class="field">
                <label for="inp-soft">软上限预警 (次)</label>
                <input id="inp-soft" name="softCap" type="number" min="1" max="2000" value="${s.softCap}">
              </div>
              <div class="field">
                <label for="inp-hard">硬上限估计 (次)</label>
                <input id="inp-hard" name="hardCap" type="number" min="1" max="2000" value="${s.hardCap}">
              </div>
              <div class="field full">
                <label for="inp-tokcap">可选 5h Token 上限（0 = 按次数×带垫图均图折算，当前参考 ~${fmtTok(refTokens)}）</label>
                <input id="inp-tokcap" name="tokenCap" type="number" min="0" max="50000000" step="1000" value="${s.tokenCap || 0}">
              </div>
            </div>
            ${!isManual ? '<div class="sub" style="margin-top:4px">当前为自学习模式，上述手动数值仅在切至「手动阈值」或样本不足 10 次时生效。</div>' : ''}
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="primary">保存设置</button>
          <button type="button" id="btn-reset-auto">恢复自动锚定</button>
          <button type="button" id="btn-reset-cal" title="仅在更换套餐或配额下调时重置永久校准账本（双击确认）">${Date.now() < state.calResetArmUntil ? '确认重置峰值？' : '重置自学习峰值'}</button>
          <span id="save-toast" class="toast ${state.toast?.err ? 'err' : ''}">${esc(state.toast?.msg || '')}</span>
        </div>
      </form>
    </section>`);

    // 6. Workspace ledgers
    const ledgers = iq.workspace_ledgers || [];
    parts.push(`<section class="card">
      <div class="ch"><span class="ctitle">工作区生产账本联动</span><span class="sub mono">api_call_ledger.json</span></div>
      ${ledgers.length ? ledgers.map((l) => `
        <div class="pool-mini" style="margin-top:6px">
          <div class="meta-row">
            <span style="color:var(--fg);font-weight:600">${esc(l.episode_label)}</span>
            <span class="sub num">${l.global_cooldown_remaining_sec > 0 ? `全局冷却 ${cdSpan(l.global_cooldown_until)}` : `更新 ${fmtDateTime(l.updated_at)}`}</span>
          </div>
          <div class="sub mono" style="font-size:10.5px;margin:2px 0 4px">${esc(l.path)}</div>
          ${(l.windows || []).map((w) => `<div class="meta-row num" style="padding:2px 0">
            <span>窗 ${esc(w.window)}：<strong>${w.used_calls}</strong>/${w.hard_cap}${w.pending_calls ? ` (+${w.pending_calls}在途)` : ''}</span>
            <span>余 ${w.remaining_calls}${w.cooldown_remaining_sec > 0 ? ` · 冷却 ${cdSpan(w.cooldown_until)}` : ''}</span>
          </div>`).join('') || '<div class="sub">暂无已登记窗口</div>'}
        </div>`).join('')
      : `<div class="sub">当前工作区未发现可选的 <span class="mono">api_call_ledger.json</span> 账本文件。</div>`}
    </section>`);

    // 7. Recent events
    const evs = iq.recent_events || [];
    const archDbs = Number(iq.scan_meta?.archived_dbs || 0);
    parts.push(`<section class="card">
      <div class="ch"><span class="ctitle">最近生图事件 (最新 20 条)</span><span class="sub num">扫描 ${iq.scan_meta?.active_dbs ?? 0} 库${archDbs > 0 ? ` + ${archDbs} 归档` : ''}</span></div>
      ${evs.length ? `<ul class="list">${evs.map((e) => {
        const ti = eventTagInfo(e.kind);
        const title = e.image_name || e.prompt_preview || '(未命名图像)';
        const detail = e.error_summary || e.prompt_preview || '';
        const badges = [];
        if (Number(e.n_refs) > 0) badges.push(`<span class="mini-badge num">${e.n_refs}参</span>`);
        if (Number(e.tokens_total) > 0) badges.push(`<span class="mini-badge num" title="Prompt ${e.prompt_tokens || 0} + 参考图 ${e.input_image_tokens || 0} + 1K出图 ${e.output_image_tokens || 0} + 思考估 ${e.thinking_tokens || 0}">${fmtTok(e.tokens_total)} tok</span>`);
        if (Number(e.duration_sec) > 0) badges.push(`<span class="mini-badge num">${e.duration_sec}s</span>`);
        return `<li class="ev-item">
          <span class="dim num" title="${esc(fmtDateTime(e.ts))}">${fmtClock(e.ts)}</span>
          <span class="tag ${esc(ti.cls)}" title="${esc(ti.tip)}">${esc(ti.text)}</span>
          <div style="min-width:0">
            <div class="ev-name" title="${esc(title)}">${esc(title)}</div>
            ${badges.length ? `<div class="ev-meta">${badges.join('')}</div>` : ''}
            ${detail && detail !== title ? `<div class="ev-sub" title="${esc(detail)}">${esc(detail)}</div>` : ''}
          </div>
        </li>`;
      }).join('')}</ul>` : '<div class="sub">近 30 天无 generate_image 调用记录。</div>'}
    </section>`);

    return parts.join('');
  }

  function fmtCredits(v) {
    if (v === null || v === undefined || Number.isNaN(Number(v))) return '--';
    const n = Number(v);
    return Number.isInteger(n) ? n.toLocaleString('en-US') : n.toFixed(1);
  }

  function flowStatusMeta(fq) {
    if (!fq || !fq.available) return { pill: '', big: '', text: '未检测' };
    if (fq.health === 'locked') {
      const manual = fq.breaker?.requires_manual_reset;
      return { pill: 'bad', big: 'bad', text: manual ? '人工熔断' : '限流冷却' };
    }
    if (fq.health === 'critical') return { pill: 'bad', big: 'bad', text: fq.status_label || '已达上限' };
    if (fq.health === 'warning') return { pill: 'warn', big: 'warn', text: fq.status_label || '逼近上限' };
    return { pill: fq.credits?.synced ? 'ok' : '', big: fq.credits?.synced ? 'ok' : '', text: fq.status_label || '正常' };
  }

  function renderFlowOverviewCard(fq) {
    if (!fq || fq.error) {
      return `<section class="card">
        <div class="ch"><span class="ctitle">Flow 生视频配额</span><span class="pill bad">读取失败</span></div>
        <div class="sub">${esc(fq?.message || '无法读取本地 Flow 账本与记录')}</div>
      </section>`;
    }
    if (!fq.available) {
      return `<section class="card">
        <div class="ch"><span class="ctitle">Flow 生视频配额 <span class="pill">未安装</span></span><button class="link-btn" data-jump="flow">配置 →</button></div>
        <div class="sub">未检测到 <span class="mono">gflow-cli</span> 或本地 Flow 账本，安装并登录后即可实时监控。</div>
      </section>`;
    }
    const cr = fq.credits || {};
    const rl = fq.rolling || {};
    const br = fq.breaker || {};
    const meta = flowStatusMeta(fq);
    const models = fq.model_estimates || [];
    const veo = models.find((m) => m.id === 'veo_3_1_lite') || models[0];
    const omni = models.find((m) => m.id === 'omni_1_2_flash') || models[1];
    const bnPct = Math.min(100, Number(rl.bottleneck_pct || 0));
    const bnHealth = br.open ? 'locked' : (bnPct >= 100 ? 'critical' : (bnPct >= 80 ? 'warning' : 'ok'));
    const syncBtnTxt = state.flowSyncing ? '同步中…' : (cr.synced ? '同步积分' : '同步真实积分');

    let bigHtml = '';
    if (cr.synced && cr.estimated_total !== null) {
      const approx = Number(cr.spent_since_sync || 0) > 0 ? '≈ ' : '';
      const veoTxt = veo && veo.est_segments !== null ? `Veo Lite ~${veo.est_segments}段` : `净可用 ${fmtCredits(cr.spendable)}`;
      bigHtml = `<div class="bigrow">
        <div class="big ${cr.below_floor ? 'bad' : meta.big} num">${approx}${fmtCredits(cr.estimated_total)} <span class="dim" style="font-size:12.5px;font-weight:500">积分</span></div>
        <span class="sub num" style="color:var(--fg);font-weight:600" title="已扣安全底线 ${fmtCredits(cr.reserve_floor)} 积分，净可用 ${fmtCredits(cr.spendable)} 积分">${esc(veoTxt)}</span>
      </div>`;
    } else {
      bigHtml = `<div class="bigrow">
        <div class="big dim" style="font-size:16px">余额未同步</div>
        <button class="primary" data-flow-sync="1" ${state.flowSyncing ? 'disabled' : ''}>${esc(syncBtnTxt)}</button>
      </div>`;
    }

    const nextSlotHtml = rl.hour_used > 0 && rl.hour_next_recover_ts > 0
      ? `1h 下槽回血 ${cdSpan(rl.hour_next_recover_ts, '即将释放')}`
      : (rl.day_used > 0 && rl.day_next_recover_ts > 0
        ? `24h 滚轴回血 ${cdSpan(rl.day_next_recover_ts, '即将释放')}`
        : '1h / 24h 防限流滚轴空闲');
    const syncMeta = cr.synced && cr.synced_at
      ? `同步于 ${fmtHM(cr.synced_at)}${cr.spent_since_sync > 0 ? ` · 新扣 ${fmtCredits(cr.spent_since_sync)}` : ''}`
      : (cr.default_profile ? `账号 ${cr.default_profile}` : '点击同步获取余额');

    const breakerHtml = br.open
      ? `<div class="callout bad" style="margin-top:6px">${br.requires_manual_reset
        ? `人工熔断锁定：${esc(br.reason || '需人工验证并执行 reset-breaker')}`
        : `限流熔断冷却中：${cdSpan(br.until_ts, '已解封')}（${esc(br.reason || '请等待冷却')}）`}</div>`
      : '';

    return `<section class="card">
      <div class="ch">
        <span class="ctitle">Flow 生视频 · 积分与防限流 <span class="pill ${meta.pill}">${esc(meta.text)}</span></span>
        <span class="pill-row">
          ${cr.synced ? `<button data-flow-sync="1" style="padding:1px 6px;font-size:10.5px" ${state.flowSyncing ? 'disabled' : ''} title="手动触发 gflow 读取真实余额（约 8–10s，绝不后台自动轮询）">${esc(syncBtnTxt)}</button>` : ''}
          <button class="link-btn" data-jump="flow">详情 →</button>
        </span>
      </div>
      ${bigHtml}
      <div class="bar-wrap" title="防限流水位取 1h频次(${rl.hour_pct}%) / 24h频次(${rl.day_pct}%) / 24h积分(${rl.day_credits_pct}%) 最高值">
        <div class="bar-fill" style="width:${bnPct}%;background:${barFillColor(bnHealth, 'pool-c')}"></div>
      </div>
      <div class="meta-row">
        <span class="num">${nextSlotHtml}</span>
        <span class="num">${esc(syncMeta)}</span>
      </div>
      <div class="chips">
        <span class="chip num">1h <strong>${rl.hour_used}/${rl.hour_limit}次</strong></span>
        <span class="chip num">24h <strong>${rl.day_used}/${rl.day_limit}次</strong></span>
        <span class="chip num">24h积分 <strong>${fmtCredits(rl.day_credits_used)}/${fmtCredits(rl.day_credits_limit)}</strong></span>
        ${omni && omni.est_segments !== null ? `<span class="chip num">Omni 1.2 <strong>~${omni.est_segments}段</strong></span>` : ''}
        ${(fq.usage?.window_7d?.total || 0) > 0 ? `<span class="chip num">7天 <strong>${fq.usage.window_7d.total}条</strong></span>` : ''}
      </div>
      ${breakerHtml}
    </section>`;
  }

  function renderFlowSchedule(buckets, label) {
    if (!buckets || !buckets.length) return '';
    const maxCnt = Math.max(1, ...buckets.map((b) => Number(b.count || 0)));
    return `<div class="rec-panel">
      <div class="sub" style="margin-bottom:4px;font-weight:600;color:var(--fg)">${esc(label)}</div>
      <div class="roll-list">${buckets.map((b) => {
        const pct = Math.max(6, Math.round((Number(b.count || 0) / maxCnt) * 100));
        const crTxt = Number(b.credits || 0) > 0 ? ` / +${fmtCredits(b.credits)}分` : '';
        return `<div class="roll-row">
          <span class="roll-time num">${fmtHM(b.recover_ts)} (${cdSpan(b.recover_ts, '释放')})</span>
          <div class="roll-bar"><div class="roll-fill pool-c" style="width:${pct}%"></div></div>
          <span class="roll-val num">+${b.count}次${crTxt}</span>
        </div>`;
      }).join('')}</div>
    </div>`;
  }

  function renderFlow(d) {
    const fq = d.flowQuota;
    if (!fq || fq.error) {
      return `<section class="card"><div class="ch"><span class="ctitle">Flow 生视频配额</span></div>
        <div class="callout bad">${esc(fq?.message || '读取 Flow 数据失败')}</div></section>`;
    }
    if (!fq.available) {
      return `<section class="card">
        <div class="ch"><span class="ctitle">Flow 生视频配额 <span class="pill">未检测到</span></span></div>
        <div class="callout info">未在本机检测到 <span class="mono">gflow-cli</span>、本地 <span class="mono">gflow.db</span> 或滚动防限流账本。<br>安装 <span class="mono">gflow-cli</span> 并执行 <span class="mono">gflow auth login</span> 登录 Google Flow 后，即可在此实时查看账号积分、模型可生段数与 1h/24h 防限流水位。</div>
      </section>`;
    }

    const cr = fq.credits || {};
    const rl = fq.rolling || {};
    const br = fq.breaker || {};
    const pol = fq.policy || {};
    const usage = fq.usage || {};
    const ds = fq.data_sources || {};
    const meta = flowStatusMeta(fq);
    const parts = [];

    // 1. Credits & Model Capacity Card
    const syncBtnTxt = state.flowSyncing ? '同步中(约10s)…' : '同步真实积分';
    const profilesHtml = (cr.profiles || []).map((p) => {
      const cTxt = p.credits !== null && p.credits !== undefined ? ` · ${fmtCredits(p.credits)} 积分` : '';
      const ckTxt = p.cookies_present || p.authenticated ? 'Cookie 正常' : '未登录';
      return `<span class="chip num" title="${esc(p.email || p.profile)}">${esc(p.profile)}${p.is_default ? ' (默认)' : ''}: <strong>${esc(ckTxt)}${esc(cTxt)}</strong></span>`;
    }).join('');

    const modelsHtml = (fq.model_estimates || []).map((m) => {
      const segTxt = m.est_segments !== null ? `<strong>~${m.est_segments} 段</strong>` : '<span class="dim">同步后计算</span>';
      const statTxt = (m.recent_30d_ok + m.recent_30d_fail) > 0
        ? `${m.recent_30d_ok}成/${m.recent_30d_fail}败`
        : '<span class="dim">--</span>';
      return `<tr>
        <td><div style="font-weight:600">${esc(m.label)}</div><div class="dim" style="font-size:10px">${m.max_duration}s · ≤${m.ref_cap}参</div></td>
        <td class="num">~${fmtCredits(m.unit_credits)}</td>
        <td class="num">${segTxt}</td>
        <td class="num">${statTxt}</td>
      </tr>`;
    }).join('');

    const retiringHtml = (fq.retiring_models || []).length
      ? `<details class="flow-details">
          <summary>即将退役模型参考（2026-12-05 下线，生产禁用）</summary>
          <table class="stat-table" style="margin-top:4px">
            <thead><tr><th>模型</th><th>参考单价</th><th>可生估算</th><th>退役日期</th></tr></thead>
            <tbody>${fq.retiring_models.map((m) => `<tr>
              <td class="dim">${esc(m.label)}</td>
              <td class="num dim">~${fmtCredits(m.unit_credits)}</td>
              <td class="num dim">${m.est_segments !== null ? `~${m.est_segments}段` : '--'}</td>
              <td class="num dim">${esc(m.retires_on || '--')}</td>
            </tr>`).join('')}</tbody>
          </table>
        </details>`
      : '';

    parts.push(`<section class="card">
      <div class="ch">
        <span class="ctitle">Google Flow 积分余额 <span class="pill ${meta.pill}">${esc(meta.text)}</span></span>
        <button class="primary" data-flow-sync="1" ${state.flowSyncing ? 'disabled' : ''} title="手动执行 gflow credits list --json（零扣费，代理下约耗时 8–10 秒）">${esc(syncBtnTxt)}</button>
      </div>
      ${cr.synced && cr.estimated_total !== null
        ? `<div class="bigrow">
            <div class="big ${cr.below_floor ? 'bad' : meta.big} num">${cr.spent_since_sync > 0 ? '≈ ' : ''}${fmtCredits(cr.estimated_total)} <span class="dim" style="font-size:12.5px;font-weight:500">积分</span></div>
            <span class="sub num">净可用 <strong style="color:var(--fg)">${fmtCredits(cr.spendable)}</strong>（底线 ${fmtCredits(cr.reserve_floor)}）</span>
          </div>
          <div class="meta-row">
            <span class="num">上次同步：${fmtDateTime(cr.synced_at)}（${fmtCredits(cr.synced_total)} 积分）</span>
            <span class="num">${cr.spent_since_sync > 0 ? `同步后账本新扣 -${fmtCredits(cr.spent_since_sync)}` : '与上次同步一致'}</span>
          </div>`
        : `<div class="callout info" style="margin:4px 0 6px">尚未同步过 Flow 实时积分。为避免后台高频唤起浏览器触发风控，余额采用<strong>手动按需同步</strong>，同步后将根据本地账本自动实时扣减估算。</div>`}
      ${state.flowToast ? `<div class="toast ${state.flowToast.err ? 'err' : ''}" style="margin-top:5px">${esc(state.flowToast.msg)}</div>` : ''}
      ${cr.last_error && !state.flowToast ? `<div class="callout warn" style="margin-top:6px">上次同步提示（${fmtHM(cr.last_error_at)}）：${esc(cr.last_error)}</div>` : ''}
      ${cr.profile_busy ? `<div class="callout warn" style="margin-top:6px">检测到活跃 Profile 锁：${esc(cr.busy_detail)}（同步会自动避让防抢锁）。</div>` : ''}
      ${br.open ? `<div class="callout bad" style="margin-top:6px"><strong>${br.requires_manual_reset ? '人工熔断已锁定' : '限流熔断冷却中'}</strong>：${esc(br.reason || '已阻断自动生视频')}${br.requires_manual_reset ? '<br><span class="dim">请先在浏览器核验 Flow 账号状态，确认正常后执行 reset-breaker 解锁。</span>' : `（剩余 ${cdSpan(br.until_ts, '已解封')}）`}</div>` : ''}
      ${profilesHtml ? `<div class="chips">${profilesHtml}</div>` : ''}
      <div class="sec-sep">
        <div class="h2"><span>主力视频模型可生估算</span><span class="hint">已扣安全底线 · 1080p超分免费</span></div>
        <table class="stat-table">
          <thead><tr><th>模型</th><th>参考积分</th><th>净可生</th><th>近30天</th></tr></thead>
          <tbody>${modelsHtml}</tbody>
        </table>
        ${retiringHtml}
      </div>
    </section>`);

    // 2. Rolling Anti-Throttle Card (1h / 24h / 24h Credits)
    const barRow = (title, usedTxt, pct, extraRight) => {
      const p = Math.min(100, Number(pct || 0));
      const h = p >= 100 ? 'critical' : (p >= 80 ? 'warning' : 'ok');
      return `<div class="win-box">
        <div class="win-head">
          <span class="win-name">${esc(title)}</span>
          <span class="num"><strong class="win-pct ${h === 'critical' ? 'bad' : h === 'warning' ? 'warn' : ''}">${esc(usedTxt)}</strong> <span class="dim">(${Number(pct || 0).toFixed(0)}%)</span></span>
        </div>
        <div class="bar-wrap sm"><div class="bar-fill" style="width:${p}%;background:${barFillColor(h, 'pool-c')}"></div></div>
        <div class="meta-row"><span>${extraRight}</span></div>
      </div>`;
    };
    const gapHtml = rl.min_gap_wait_sec > 0
      ? `<span class="pill warn num">间隔冷却 ${cdSpan(rl.min_gap_ready_ts, '就绪')}</span>`
      : `<span class="pill ok">间隔就绪 (${pol.min_gap_sec}s)</span>`;

    parts.push(`<section class="card">
      <div class="ch">
        <span class="ctitle">防风控滚动水位 · ${ds.rate_limit_source === 'ledger' ? '全局账本' : ds.rate_limit_source === 'gflow_db' ? 'gflow.db' : '暂无记录'}</span>
        ${gapHtml}
      </div>
      <div class="win-list">
        ${barRow('1 小时滚动频次', `${rl.hour_used} / ${rl.hour_limit} 次`, rl.hour_pct, rl.hour_used > 0 ? `最早一笔释放：${cdSpan(rl.hour_next_recover_ts, '即将释放')} · ${fmtHM(rl.hour_full_clear_ts)} 清空` : '当前 1h 窗无占用')}
        ${barRow('24 小时滚动频次', `${rl.day_used} / ${rl.day_limit} 次`, rl.day_pct, rl.day_used > 0 ? `最早一笔释放：${cdSpan(rl.day_next_recover_ts, '即将释放')}（${fmtDateTime(rl.day_next_recover_ts)}）` : '当前 24h 窗无占用')}
        ${barRow('24 小时滚动积分', `${fmtCredits(rl.day_credits_used)} / ${fmtCredits(rl.day_credits_limit)} 积分`, rl.day_credits_pct, `余 ${fmtCredits(rl.day_credits_remaining)} 积分预算`)}
      </div>
      ${rl.untracked_db_24h > 0 ? `<div class="callout warn" style="margin-top:6px">本地 <span class="mono">gflow.db</span> 近 24h 额外记录了 <strong>+${rl.untracked_db_24h}</strong> 次未入账本的直调/MCP 生成，请注意实际风控频次。</div>` : ''}
      ${renderFlowSchedule(rl.hour_schedule, '1h 槽位回血时间表')}
      ${renderFlowSchedule(rl.day_schedule, '24h 滚轴回血预告')}
    </section>`);

    // 3. 7d / 30d Usage & Risk Summary
    const w24 = usage.window_24h || {};
    const w7 = usage.window_7d || {};
    const w30 = usage.window_30d || {};
    const byMod = usage.by_model_30d || [];
    parts.push(`<section class="card">
      <div class="ch"><span class="ctitle">近 7 天 / 30 天生视频统计</span><span class="sub">只读 gflow.db</span></div>
      <div class="roll-head">
        <div class="roll-kpi">
          <div class="roll-kpi-lbl">近 7 天视频</div>
          <div class="roll-kpi-val num">${w7.total || 0} 条</div>
          <div class="roll-kpi-sub num">${w7.ok || 0} 成 / ${w7.failed || 0} 败 · WAF ${w7.waf || 0}</div>
        </div>
        <div class="roll-kpi">
          <div class="roll-kpi-lbl">近 30 天视频</div>
          <div class="roll-kpi-val num">${w30.total || 0} 条</div>
          <div class="roll-kpi-sub num">${w30.ok || 0} 成 / ${w30.failed || 0} 败 · 角色 ${w30.character_total || 0}</div>
        </div>
      </div>
      ${byMod.length ? `<table class="stat-table">
        <thead><tr><th>近 30 天模型</th><th>成功</th><th>失败</th><th>合计</th></tr></thead>
        <tbody>${byMod.map((m) => `<tr>
          <td>${esc(m.label)}</td>
          <td class="num">${m.ok}</td>
          <td class="num">${m.failed}</td>
          <td class="num"><strong>${m.total}</strong></td>
        </tr>`).join('')}</tbody>
      </table>` : '<div class="sub">近 30 天暂无视频生成记录。</div>'}
      ${(usage.recent_waf_errors || []).length ? `<div class="callout warn" style="margin-top:7px">最近 WAF/风控记录（${fmtDateTime(usage.recent_waf_errors[0].ts)}）：${esc(usage.recent_waf_errors[0].detail || usage.recent_waf_errors[0].error_type)}</div>` : ''}
    </section>`);

    // 4. Optional Workspace Run Progress
    const runs = fq.workspace_runs || [];
    if (runs.length) {
      parts.push(`<section class="card">
        <div class="ch"><span class="ctitle">工作区在制剧集 Flow 进度</span><span class="sub">${runs.length} 个</span></div>
        <table class="stat-table">
          <thead><tr><th>剧集</th><th>完成</th><th>待跑/败</th><th>已扣分</th></tr></thead>
          <tbody>${runs.map((r) => `<tr>
            <td title="${esc(r.path)}">${esc(r.episode)}</td>
            <td class="num"><strong>${r.completed}/${r.total}</strong></td>
            <td class="num">${r.counts.pending}/${r.counts.failed}${r.counts.uncertain ? ` (${r.counts.uncertain}待核)` : ''}</td>
            <td class="num">${fmtCredits(r.credits_used)}</td>
          </tr>`).join('')}</tbody>
        </table>
      </section>`);
    }

    // 5. Recent Events
    const evs = fq.recent_events || [];
    parts.push(`<section class="card">
      <div class="ch"><span class="ctitle">最近 Flow 记录</span><span class="sub">最新 ${evs.length} 条</span></div>
      ${evs.length ? `<ul class="list">${evs.map((e) => `<li class="ev-item">
        <span class="dim num" title="${esc(fmtDateTime(e.ts))}">${fmtClock(e.ts)}</span>
        <span class="tag ${esc(e.tag)}">${esc(e.tag)}</span>
        <div style="min-width:0">
          <div class="ev-name" title="${esc(e.title)}">${esc(e.title)}</div>
          <div class="ev-meta">
            <span class="mini-badge">${esc(e.action)}</span>
            ${Number(e.credits) > 0 ? `<span class="mini-badge num">-${fmtCredits(e.credits)}分</span>` : ''}
            ${e.outcome && e.outcome !== 'OK' ? `<span class="mini-badge">${esc(e.outcome)}</span>` : ''}
          </div>
        </div>
      </li>`).join('')}</ul>` : '<div class="sub">暂无 Flow 生成记录。</div>'}
    </section>`);

    // 6. Anti-Throttle Threshold Settings Form
    const s = d.settings || {};
    parts.push(`<section class="card">
      <div class="ch"><span class="ctitle">防限流警戒阈值设置</span><span class="sub">仅影响监控告警</span></div>
      <form id="flow-settings-form">
        <div class="form-grid">
          <div class="field"><label for="inp-f-hr">1h 频次上限</label><input id="inp-f-hr" name="flowMaxPerHour" type="number" min="1" max="200" value="${Number(s.flowMaxPerHour ?? 6)}"></div>
          <div class="field"><label for="inp-f-day">24h 频次上限</label><input id="inp-f-day" name="flowMaxPerDay" type="number" min="1" max="1000" value="${Number(s.flowMaxPerDay ?? 20)}"></div>
          <div class="field"><label for="inp-f-dcr">24h 积分预算</label><input id="inp-f-dcr" name="flowMaxDailyCredits" type="number" min="10" max="50000" value="${Number(s.flowMaxDailyCredits ?? 400)}"></div>
          <div class="field"><label for="inp-f-min">账号留存底线</label><input id="inp-f-min" name="flowMinCredits" type="number" min="0" max="10000" value="${Number(s.flowMinCredits ?? 100)}"></div>
          <div class="field full"><label for="inp-f-gap">最小调用间隔 (秒)</label><input id="inp-f-gap" name="flowMinGapSec" type="number" min="0" max="600" value="${Number(s.flowMinGapSec ?? 35)}"></div>
        </div>
        <div class="form-actions">
          <button class="primary" type="submit">保存阈值</button>
          <button type="button" id="btn-flow-reset-default">恢复默认</button>
          ${state.flowSettingsToast ? `<span class="toast ${state.flowSettingsToast.err ? 'err' : ''}">${esc(state.flowSettingsToast.msg)}</span>` : ''}
        </div>
      </form>
    </section>`);

    return parts.join('');
  }

  function renderPools(d) {
    const poolsObj = d.pools || {};
    const pools = poolsObj.pools || [];
    const parts = [];

    if (poolsObj.routingAdvice) {
      const cls = poolsObj.routingAdvice.level === 'critical' ? 'bad' : 'warn';
      parts.push(`<div class="callout ${cls}">${esc(poolsObj.routingAdvice.text)}</div>`);
    }

    if (!pools.length) {
      parts.push(`<section class="card"><div class="ch"><span class="ctitle">模型配额池</span></div>
        <div class="sub">${esc(poolsObj.error || '暂未从 Language Server 获取到模型配额数据，请点击右上角刷新重试。')}</div></section>`);
    } else {
      for (const p of pools) {
        const isActive = p.key === poolsObj.activePoolKey;
        const activeCls = isActive ? `active-${p.accent}` : '';
        const wins = poolWindowsList(p);
        const pillsHtml = wins.length
          ? wins.map((w) => `<span class="pill ${healthCls(w.health)} num">${esc(w.shortLabel)} ${w.remainingPct !== null ? `${w.remainingPct.toFixed(1)}%` : '--'}</span>`).join('')
          : `<span class="pill ${healthCls(p.health)} num">${p.remainingPct !== null ? `余 ${p.remainingPct.toFixed(1)}%` : '--'}</span>`;
        const winBoxesHtml = wins.map((w) => {
          const wpct = w.remainingPct !== null ? w.remainingPct : 0;
          const pctCls = w.health === 'critical' ? 'bad' : w.health === 'warning' ? 'warn' : '';
          const isBottleneck = wins.length > 1 && p.bottleneckWindow === w.window && w.remainingPct !== null && w.remainingPct < 50;
          return `<div class="win-box">
            <div class="win-head">
              <span class="win-name">${esc(w.label)}${isBottleneck ? ' <span class="pill warn" style="font-size:10px;padding:1px 5px">当前瓶颈</span>' : ''}</span>
              <span class="num">
                <span class="win-pct ${pctCls}">余 ${w.remainingPct !== null ? `${w.remainingPct.toFixed(1)}%` : '--'}</span>
                ${w.usedPct !== null ? `<span class="dim" style="margin-left:5px;font-size:11px">已用 ${w.usedPct.toFixed(1)}%</span>` : ''}
              </span>
            </div>
            <div class="bar-wrap" style="margin:5px 0">
              <div class="bar-fill" style="width:${Math.max(0, Math.min(100, wpct))}%;background:${barFillColor(w.health, p.accent)}"></div>
            </div>
            <div class="meta-row">
              <span>${w.window === '5h' ? '5 小时平滑峰值窗口' : w.window === 'weekly' ? '7 天滚动回血池' : '周期额度'}</span>
              <span>${winResetHtml(w, false)}</span>
            </div>
            ${w.window === 'weekly' ? renderPoolWeeklyRecoveryDetail(p.weeklyRecovery, p.accent) : ''}
          </div>`;
        }).join('');
        parts.push(`<section class="card ${activeCls}">
          <div class="ch">
            <span class="ctitle">${esc(p.label)} ${isActive ? `<span class="pill ${p.accent}">当前对话所在池</span>` : ''}</span>
            <span class="pill-row">${pillsHtml}</span>
          </div>
          <div class="sub">${esc(p.description || '')}${p.familyCount ? ` · ${p.familyCount} 模型族 (${p.modelCount} 档位)` : ''}</div>
          <div class="win-list" style="margin:8px 0 6px">${winBoxesHtml || '<div class="sub">暂未获取到窗口额度明细</div>'}</div>
          ${!p.hasDualWindows && poolsObj.quotaSummaryAvailable === false ? '<div class="sub" style="margin-bottom:4px">注：RetrieveUserQuotaSummary 暂不可用，当前仅展示单窗口回退数据。</div>' : ''}
          <div class="sec-sep" style="margin-top:6px;padding-top:6px">
            ${(() => {
              const rowHtml = (m) => `<div class="model-row">
                <div class="model-left">
                  <div class="model-name">
                    ${m.tier ? `<span class="tier ${m.tier === 'IMG' ? 'IMG' : ''}">${esc(m.tier)}</span>` : ''}
                    <span>${esc(m.family)}</span>
                    ${m.variantsCount > 1 ? `<span class="dim" style="font-size:11px">×${m.variantsCount}</span>` : ''}
                  </div>
                  ${m.role ? `<div class="ev-sub">${esc(m.role)}</div>` : ''}
                </div>
                <div class="num dim" style="font-size:11.5px;text-align:right;white-space:nowrap">
                  ${p.hasMixedQuotas && m.remainingPct !== null ? `<div style="color:var(--fg);font-weight:600">${m.remainingPct.toFixed(1)}%</div>` : ''}
                  ${m.maxTokens ? `<div>${fmtTok(m.maxTokens)}</div>` : ''}
                </div>
              </div>`;
              const all = p.models || [];
              const isPrimary = (m) => Boolean(m.tier) && !/(-sonar|-tiered|orchestrator|worker-agy)/i.test(m.id || '') && !/^orchestrator\b/i.test(m.family || '');
              const primary = all.filter(isPrimary);
              const extra = all.filter((m) => !isPrimary(m));
              if (primary.length && extra.length) {
                return primary.map(rowHtml).join('') +
                  `<details style="margin-top:4px"><summary class="sub" style="cursor:pointer;padding:4px 0;user-select:none">展开其余 ${extra.length} 个内部/兼容模型</summary>${extra.map(rowHtml).join('')}</details>`;
              }
              return all.map(rowHtml).join('');
            })()}
          </div>
        </section>`);
      }
    }

    if (poolsObj.imageModelPoolNote) {
      parts.push(`<div class="callout info">${esc(poolsObj.imageModelPoolNote)}</div>`);
    }
    return parts.join('');
  }

  function renderFileList(title, hint, items) {
    if (!items || !items.length) return '';
    return `<section class="card">
      <div class="h2"><span>${esc(title)}</span><span class="hint">${esc(hint)}</span></div>
      <ul class="list files">${items.map((it) => {
        const [name, dir] = splitPath(it.path || '');
        const tok = Number(it.tokens) > 0 ? `<span class="tok num">${fmtTok(it.tokens)}</span>` : '<span></span>';
        return `<li><div class="name" title="${esc(it.path || '')}">${esc(name)}${dir ? `<span class="dir">${esc(dir)}</span>` : ''}</div>${tok}</li>`;
      }).join('')}</ul>
    </section>`;
  }

  function renderContext(d) {
    const ctx = d.context;
    if (!ctx || ctx.error) {
      const msg = ctx?.error === 'no-conversation'
        ? '在具体对话中打开本面板，即可查看实时上下文占用明细。'
        : ctx?.error === 'no-database'
          ? '新对话尚无落盘数据，发送首条消息后自动更新。'
          : (ctx?.message || '读取上下文报告失败。');
      return `<p class="empty">${esc(msg)}</p>`;
    }

    const parts = [];
    const budget = Number(ctx.request_budget_tokens) || 0;
    const nearBudget = budget > 0 && ctx.used_tokens >= budget * 0.8;
    const cells = gridCells(ctx.grid_segments, ctx.limit_tokens);

    const byKey = new Map((ctx.categories || []).map((c) => [c.key, c]));
    const groupsHtml = CTX_GROUPS.map((g) => {
      const items = g.keys.map((k) => byKey.get(k)).filter(Boolean);
      if (!items.length) return '';
      return `<div class="group">${items.map((c) => `<div class="crow">
        <span class="mark${g.sq ? ' sq' : ''}" style="background:${CAT_COLOR[c.key] || 'var(--dim)'}"></span>
        <span>${esc(CAT_LABEL[c.key] || c.name)}</span>
        <span class="tok num">${fmtTok(c.tokens)}</span>
        <span class="p num">${Number(c.pct || 0).toFixed(1)}%</span>
      </div>`).join('')}</div>`;
    }).join('');

    const freePct = ctx.limit_tokens ? ((ctx.free_tokens / ctx.limit_tokens) * 100).toFixed(1) : '0.0';
    parts.push(`<section class="card">
      <div class="ch">
        <span class="ctitle">${esc(ctx.model || '当前上下文')}</span>
        <button id="btn-copy-ctx" type="button">复制文本</button>
      </div>
      <div class="bigrow">
        <div class="big num" style="font-size:18px">${fmtTok(ctx.used_tokens)} <span class="dim" style="font-size:12.5px;font-weight:500">/ ${ctx.limit_tokens ? fmtTok(ctx.limit_tokens) : '?'} tokens</span></div>
        <span class="pill ${nearBudget ? 'warn' : ''}">${ctx.limit_tokens ? `${ctx.used_pct.toFixed(1)}%` : '--'}</span>
      </div>
      ${nearBudget ? `<div class="callout warn" style="margin-bottom:6px">接近单次请求预算（${fmtTok(budget)} tokens），建议及时执行 <span class="mono">/compact</span> 瘦身。</div>` : ''}
      <div class="grid">${cells.map((col) => `<span class="dot"${col ? ` style="background:${col}"` : ''}></span>`).join('')}</div>
      <div class="sec-sep">
        <div class="h2"><span>${esc(ctx.heading || '分类占用明细')}</span></div>
        ${groupsHtml}
        <div class="group">
          <div class="crow">
            <span class="mark free"></span>
            <span class="dim">剩余可用空间</span>
            <span class="tok num dim">${fmtTok(ctx.free_tokens)}</span>
            <span class="p num">${freePct}%</span>
          </div>
          ${ctx.checkpoint_buffer > 0 ? `<div class="crow">
            <span class="mark sq" style="background:var(--empty)"></span>
            <span class="dim">检查点缓冲（不计入占用）</span>
            <span class="tok num dim">${fmtTok(ctx.checkpoint_buffer)}</span>
            <span class="p"></span>
          </div>` : ''}
        </div>
      </div>
    </section>`);

    if (ctx.cache && ctx.cache.has_data) {
      parts.push(renderCacheCard(ctx.cache));
    }

    if (ctx.checkpoint_view) {
      const ck = ctx.checkpoint_view;
      parts.push(`<section class="card">
        <div class="h2"><span>检查点 (${ck.count})</span><span class="hint mono">/rewind</span></div>
        <div style="font-size:12px">Checkpoint ${ck.active_number}（活跃）：<span class="dim">${esc(ck.active_text || '')}</span></div>
        ${ck.historical > 0 ? `<div class="sub" style="margin-top:4px">另有 ${ck.historical} 个历史检查点（已归档，不占上下文）</div>` : ''}
      </section>`);
    }

    parts.push(renderFileList('知识库文件 (Knowledge)', '/rules', ctx.knowledge_files));
    parts.push(renderFileList('产物文件 (Artifacts)', '/artifact', ctx.artifact_files));
    parts.push(renderFileList('技能文件 (Skills)', '/skill', ctx.skill_files));
    parts.push(renderFileList('系统文件 (System)', '自动加载', ctx.system_files));

    parts.push(`<footer>
      <span class="mono">/compact · /artifact · /skill · /rewind</span>
      <span class="num">${ctx.updatedAt ? `更新 ${fmtClock(Date.parse(ctx.updatedAt) / 1000)}` : ''}</span>
    </footer>`);

    return parts.join('');
  }

  function render(force = false) {
    const d = state.dash;
    if (!d) return;
    updateHeader(d);

    // Avoid overwriting form inputs while the user is editing settings or pinned peak
    if (!force && (state.tab === 'image' || state.tab === 'flow') && document.activeElement?.closest('#settings-form, #pin-peak-form, #flow-settings-form')) {
      return;
    }

    const iq = d.imageQuota || {};
    const w5 = iq.window_5h || {};
    const fq = d.flowQuota || {};
    const fcr = fq.credits || {};
    const frl = fq.rolling || {};
    const fbr = fq.breaker || {};
    const ctx = d.context || {};
    const po = d.pools || {};
    const key = JSON.stringify([
      state.tab,
      d.settings,
      state.toast?.id || 0,
      state.pinToast?.id || 0,
      state.flowSyncing,
      state.flowToast?.id || 0,
      state.flowSettingsToast?.id || 0,
      po.fetchedAt, po.activePoolKey, po.stale, po.error, po.quotaSummaryAvailable,
      (po.pools || []).map((p) => [
        p.key, p.remainingPct, p.bottleneckWindow,
        (p.windows || []).map((w) => [w.window, w.remainingPct, w.resetTs, w.isFull]),
        p.weeklyRecovery?.source, p.weeklyRecovery?.recoverNext24hPct, p.weeklyRecovery?.buckets?.length,
        p.weeklyRecovery?.observedRecovery?.sampleCount, p.weeklyRecovery?.observedRecovery?.recovered24hPct,
      ]),
      iq.error, w5.mode, w5.health, w5.metric_used, w5.ok, w5.eof, w5.err, w5.rate_limited,
      w5.weekly_cooldown_active, w5.weekly_reset_ts,
      w5.tokens_total, w5.next_recover_ts, w5.full_clear_ts,
      w5.window_end, w5.soft_cap, w5.hard_cap, w5.token_cap, w5.anchor_mode, w5.last_429_at,
      iq.anchor?.status, iq.anchor?.source, iq.anchor?.ref_calls, iq.anchor?.ref_tokens,
      iq.anchor?.calls_pct, iq.anchor?.tokens_pct, iq.anchor?.used_pct_basis, iq.anchor?.remaining_calls,
      iq.anchor?.remaining_tokens, iq.anchor?.est_remaining_imgs_with_refs,
      iq.anchor?.pinned_calls, iq.calibration?.pinned_peak?.calls,
      iq.calibration?.persisted_safe_peak_used, iq.calibration?.truncated_lock_count, iq.scan_meta?.archived_dbs,
      Date.now() < state.calResetArmUntil,
      iq.per_image_avg?.with_refs?.avg_tokens_total,
      iq.rolling_schedule?.buckets?.length,
      iq.weekly_rolling_schedule?.total_calls, iq.weekly_rolling_schedule?.cooldown_active, iq.weekly_rolling_schedule?.buckets?.length,
      iq.window_24h?.attempts, iq.window_7d?.attempts,
      (iq.workspace_ledgers || []).map((l) => [l.path, l.updated_at]),
      iq.recent_events?.[0]?.ts,
      fq.error, fq.available, fq.health, fq.status_label,
      fcr.synced, fcr.synced_at, fcr.estimated_total, fcr.spent_since_sync, fcr.spendable, fcr.last_error, fcr.profile_busy,
      frl.hour_used, frl.hour_limit, frl.day_used, frl.day_limit, frl.day_credits_used, frl.day_credits_limit,
      frl.hour_next_recover_ts, frl.day_next_recover_ts, frl.min_gap_wait_sec, frl.untracked_db_24h,
      fbr.open, fbr.requires_manual_reset, fbr.until_ts, fbr.reason,
      fq.usage?.window_7d?.total, fq.usage?.window_30d?.total,
      fq.recent_events?.[0]?.ts, (fq.workspace_runs || []).map((r) => [r.path, r.completed, r.updated_at]),
      ctx.updatedAt, ctx.error, ctx.used_tokens,
    ]);
    if (!force && key === state.lastKey) return;
    state.lastKey = key;

    const view = $('view');
    if (state.tab === 'overview') view.innerHTML = renderOverview(d);
    else if (state.tab === 'image') view.innerHTML = renderImage(d);
    else if (state.tab === 'flow') view.innerHTML = renderFlow(d);
    else if (state.tab === 'pools') view.innerHTML = renderPools(d);
    else view.innerHTML = renderContext(d);

    tickCountdowns();
  }

  function setTab(nextTab) {
    if (!['overview', 'image', 'flow', 'pools', 'context'].includes(nextTab)) return;
    state.tab = nextTab;
    document.querySelectorAll('.tab').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.tab === nextTab);
    });
    render(true);
  }

  async function copyText(text, btn) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    if (btn) {
      const prev = btn.textContent;
      btn.textContent = '已复制';
      setTimeout(() => { btn.textContent = prev; }, 1200);
    }
  }

  async function saveSettings(opts) {
    const { anchorMode, softCap, hardCap, tokenCap, countMode } = opts;
    try {
      const res = await window.sidecar.fetch('/api/settings', {
        method: 'POST',
        body: JSON.stringify({
          anchorMode,
          softCap,
          hardCap,
          tokenCap,
          countMode,
          workspace: state.workspace,
        }),
      });
      const json = await res.json();
      if (!res.ok || !json.ok) throw new Error(json.error || `HTTP ${res.status}`);
      if (state.dash) {
        state.dash.settings = json.settings;
        if (json.imageQuota) state.dash.imageQuota = json.imageQuota;
        if (json.flowQuota) state.dash.flowQuota = json.flowQuota;
        if (json.serverNow) state.clockOffsetSec = json.serverNow - Math.floor(Date.now() / 1000);
        state.dash.updatedAt = new Date().toISOString();
      }
      state.toast = { id: Date.now(), msg: '已保存并重新计算', err: false };
      render(true);
    } catch (err) {
      state.toast = { id: Date.now(), msg: `保存失败：${err.message}`, err: true };
      render(true);
    }
  }

  async function saveFlowSettings(opts) {
    try {
      const res = await window.sidecar.fetch('/api/settings', {
        method: 'POST',
        body: JSON.stringify({
          ...opts,
          workspace: state.workspace,
        }),
      });
      const json = await res.json();
      if (!res.ok || !json.ok) throw new Error(json.error || `HTTP ${res.status}`);
      if (state.dash) {
        state.dash.settings = json.settings;
        if (json.flowQuota) state.dash.flowQuota = json.flowQuota;
        if (json.serverNow) state.clockOffsetSec = json.serverNow - Math.floor(Date.now() / 1000);
        state.dash.updatedAt = new Date().toISOString();
      }
      state.flowSettingsToast = { id: Date.now(), msg: '已保存 Flow 阈值', err: false };
      render(true);
    } catch (err) {
      state.flowSettingsToast = { id: Date.now(), msg: `保存失败：${err.message}`, err: true };
      render(true);
    }
  }

  async function syncFlowCredits() {
    if (state.flowSyncing) return;
    state.flowSyncing = true;
    state.flowToast = null;
    render(true);
    try {
      const res = await window.sidecar.fetch('/api/flow/sync-credits', {
        method: 'POST',
        body: JSON.stringify({ workspace: state.workspace }),
      });
      const json = await res.json();
      if (state.dash && json.flowQuota) {
        state.dash.flowQuota = json.flowQuota;
        if (json.serverNow) state.clockOffsetSec = json.serverNow - Math.floor(Date.now() / 1000);
        state.dash.updatedAt = new Date().toISOString();
      }
      if (!res.ok || !json.ok) {
        throw new Error(json.error || json.sync?.error || `HTTP ${res.status}`);
      }
      const tot = json.sync?.total_credits ?? json.flowQuota?.credits?.synced_total;
      state.flowToast = { id: Date.now(), msg: `已同步 Flow 真实余额：${fmtCredits(tot)} 积分`, err: false };
    } catch (err) {
      state.flowToast = { id: Date.now(), msg: `同步未完成：${err.message}`, err: true };
    } finally {
      state.flowSyncing = false;
      render(true);
    }
  }

  async function pinPeak(calls, unpin = false) {
    try {
      const res = await window.sidecar.fetch('/api/calibration/pin', {
        method: 'POST',
        body: JSON.stringify({
          calls: unpin ? 0 : calls,
          unpin,
          workspace: state.workspace,
        }),
      });
      const json = await res.json();
      if (!res.ok || !json.ok) throw new Error(json.error || `HTTP ${res.status}`);
      if (state.dash) {
        if (json.imageQuota) state.dash.imageQuota = json.imageQuota;
        if (json.serverNow) state.clockOffsetSec = json.serverNow - Math.floor(Date.now() / 1000);
        state.dash.updatedAt = new Date().toISOString();
      }
      state.pinToast = {
        id: Date.now(),
        msg: unpin ? '已取消固定，恢复自动水位带学习' : `已永久固定 5h 峰值为 ${json.pinnedPeak?.calls || calls} 次`,
        err: false,
      };
      render(true);
    } catch (err) {
      state.pinToast = { id: Date.now(), msg: `操作失败：${err.message}`, err: true };
      render(true);
    }
  }

  async function resetCalibration() {
    try {
      const res = await window.sidecar.fetch('/api/calibration/reset', {
        method: 'POST',
        body: JSON.stringify({ workspace: state.workspace }),
      });
      const json = await res.json();
      if (!res.ok || !json.ok) throw new Error(json.error || `HTTP ${res.status}`);
      if (state.dash) {
        if (json.imageQuota) state.dash.imageQuota = json.imageQuota;
        if (json.serverNow) state.clockOffsetSec = json.serverNow - Math.floor(Date.now() / 1000);
        state.dash.updatedAt = new Date().toISOString();
      }
      state.calResetArmUntil = 0;
      state.toast = { id: Date.now(), msg: '已重置永久校准峰值并重算', err: false };
      render(true);
    } catch (err) {
      state.calResetArmUntil = 0;
      state.toast = { id: Date.now(), msg: `重置失败：${err.message}`, err: true };
      render(true);
    }
  }

  async function refresh(force = false) {
    if (state.inFlight && !force) return;
    state.inFlight = true;
    const btn = $('btn-refresh');
    if (force && btn) btn.disabled = true;
    try {
      const params = new URLSearchParams();
      const cid = window.sidecar?.conversationId || '';
      if (cid) params.set('conversationId', cid);
      if (state.workspace) params.set('workspace', state.workspace);
      if (force) params.set('force', '1');
      const res = await window.sidecar.fetch(`/api/dashboard?${params.toString()}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      state.dash = data;
      if (data.serverNow) {
        state.clockOffsetSec = data.serverNow - Math.floor(Date.now() / 1000);
      }
      render(force);
    } catch (err) {
      $('live-dot').className = 'live err';
      if (!state.dash) {
        $('view').innerHTML = `<p class="empty">读取面板数据失败：${esc(err.message)}</p>`;
      }
    } finally {
      state.inFlight = false;
      if (btn) btn.disabled = false;
    }
  }

  // Wire UI interactions
  document.querySelectorAll('.tab').forEach((btn) => {
    btn.addEventListener('click', () => setTab(btn.dataset.tab));
  });
  $('hdr-pool').addEventListener('click', () => setTab('pools'));
  $('hdr-quota').addEventListener('click', () => setTab('pools'));
  $('btn-refresh').addEventListener('click', () => refresh(true));

  $('view').addEventListener('click', (e) => {
    const jump = e.target.closest('[data-jump]');
    if (jump) {
      setTab(jump.dataset.jump);
      return;
    }
    const flowSyncBtn = e.target.closest('[data-flow-sync]');
    if (flowSyncBtn) {
      syncFlowCredits();
      return;
    }
    const flowResetBtn = e.target.closest('#btn-flow-reset-default');
    if (flowResetBtn) {
      saveFlowSettings({
        flowMaxPerHour: 6,
        flowMaxPerDay: 20,
        flowMaxDailyCredits: 400,
        flowMinCredits: 100,
        flowMinGapSec: 35,
      });
      return;
    }
    const copyBtn = e.target.closest('#btn-copy-ctx');
    if (copyBtn && state.dash?.context?.text) {
      copyText(state.dash.context.text, copyBtn);
      return;
    }
    const unpinBtn = e.target.closest('#btn-unpin-peak');
    if (unpinBtn) {
      pinPeak(0, true);
      return;
    }
    const pinObsBtn = e.target.closest('#btn-pin-observed');
    if (pinObsBtn) {
      const c = Number(pinObsBtn.dataset.calls || 0);
      if (c > 0) pinPeak(c, false);
      return;
    }
    const resetBtn = e.target.closest('#btn-reset-auto');
    if (resetBtn) {
      saveSettings({ anchorMode: 'auto', softCap: 54, hardCap: 60, tokenCap: 0, countMode: 'attempts' });
      return;
    }
    const resetCalBtn = e.target.closest('#btn-reset-cal');
    if (resetCalBtn) {
      if (Date.now() < state.calResetArmUntil) {
        resetCalibration();
      } else {
        state.calResetArmUntil = Date.now() + 5000;
        render(true);
        setTimeout(() => {
          if (state.calResetArmUntil && Date.now() >= state.calResetArmUntil) {
            state.calResetArmUntil = 0;
            render(true);
          }
        }, 5100);
      }
    }
  });

  $('view').addEventListener('change', (e) => {
    if (e.target && e.target.id === 'inp-anchor') {
      const box = $('manual-fields');
      if (box) box.classList.toggle('dimmed', e.target.value !== 'manual');
    }
  });

  $('view').addEventListener('submit', (e) => {
    const pinForm = e.target.closest('#pin-peak-form');
    if (pinForm) {
      e.preventDefault();
      const calls = Math.round(Number(pinForm.elements.calls.value));
      if (!Number.isFinite(calls) || calls < 1 || calls > 5000) {
        state.pinToast = { id: Date.now(), msg: '请输入 1–5000 之间的峰值次数', err: true };
        render(true);
        return;
      }
      pinPeak(calls, false);
      return;
    }
    const flowForm = e.target.closest('#flow-settings-form');
    if (flowForm) {
      e.preventDefault();
      const flowMaxPerHour = Math.max(1, Number(flowForm.elements.flowMaxPerHour.value) || 6);
      const flowMaxPerDay = Math.max(flowMaxPerHour, Number(flowForm.elements.flowMaxPerDay.value) || 20);
      const flowMaxDailyCredits = Math.max(10, Number(flowForm.elements.flowMaxDailyCredits.value) || 400);
      const flowMinCredits = Math.max(0, Number(flowForm.elements.flowMinCredits.value) || 0);
      const flowMinGapSec = Math.max(0, Number(flowForm.elements.flowMinGapSec.value) || 0);
      saveFlowSettings({
        flowMaxPerHour,
        flowMaxPerDay,
        flowMaxDailyCredits,
        flowMinCredits,
        flowMinGapSec,
      });
      return;
    }
    const form = e.target.closest('#settings-form');
    if (!form) return;
    e.preventDefault();
    const anchorMode = form.elements.anchorMode.value;
    const softCap = Number(form.elements.softCap.value);
    const hardCap = Math.max(softCap, Number(form.elements.hardCap.value));
    const tokenCap = Math.max(0, Number(form.elements.tokenCap.value) || 0);
    const countMode = form.elements.countMode.value;
    saveSettings({ anchorMode, softCap, hardCap, tokenCap, countMode });
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refresh(false);
  });

  // Subscribe to workspace URIs without blocking initial render
  if (window.sidecar?.getWorkspaceUris) {
    window.sidecar.getWorkspaceUris().then((uris) => {
      const first = (uris && uris[0]) || '';
      if (first && first !== state.workspace) {
        state.workspace = first;
        refresh(true);
      }
    }).catch(() => {});
  }
  if (window.sidecar?.onWorkspaceChange) {
    window.sidecar.onWorkspaceChange((uris) => {
      const first = (uris && uris[0]) || '';
      if (first !== state.workspace) {
        state.workspace = first;
        refresh(true);
      }
    });
  }

  refresh(false);
  setInterval(() => { if (!document.hidden) refresh(false); }, POLL_MS);
  setInterval(() => { if (!document.hidden) tickCountdowns(); }, 1000);
})();
</script>
</body>
</html>
